<!-- ملف الأداة المنفصل: sparkle_modal.html -->
<div id="sparkleDialogScreen" class="screen-view">
    <!-- الشريط العلوي: زر الإغلاق صغير أقصى اليمين، اسم التطبيق مع ضبط حرفي tc فوق الدائرة، وزر الترقية صغير أقصى اليسار -->
    <div style="display: flex; justify-content: space-between; align-items: center; width: 100%; margin-bottom: 20px;">
        <div style="cursor: pointer; color: #fff; font-size: 14px; background: rgba(255,255,255,0.1); width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center;" onclick="playClickSound(); closeSparkleDialog()">✕</div>
        <div class="brand-title" style="transform: translateX(-12px); font-size: 18px;">Plotcraft</div>
        <div class="upgrade-badge" onclick="playClickSound(); openSubscriptionModal()" style="display: flex; align-items: center; gap: 4px; padding: 5px 12px; font-size: 12px; border-radius: 20px; cursor: pointer;">
            <span style="font-size: 10px; filter: brightness(0) invert(1);">👑</span>
            <span>ترقية</span>
        </div>
    </div>

    <div style="display: flex; flex-direction: column; align-items: center; text-align: center; gap: 12px; margin-top: 5px; flex-grow: 1; overflow-y: auto; padding-bottom: 30px;">
        <div style="width: 75px; height: 75px; background: linear-gradient(135deg, #e0f2fe 0%, #3b82f6 100%); border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 25px rgba(59,130,246,0.5); position: relative; margin-bottom: 5px;">
            <svg width="38" height="38" viewBox="0 0 24 24" fill="#1f242d"><path d="M12 2L14.39 8.26L21 9.27L16 14.14L17.18 20.74L12 17.77L6.82 20.74L8 14.14L3 9.27L9.61 8.26L12 2Z"/></svg>
            <div style="position: absolute; bottom: 2px; right: 2px; width: 16px; height: 16px; background: #fff; clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);"></div>
        </div>

        <div style="color: #ffffff; font-size: 20px; font-weight: 700; line-height: 1.4;">طاب مساؤك، أيها المخرج</div>
        <div style="color: #cbd5e1; font-size: 13px; font-weight: 400; margin-bottom: 10px;">سلّم القصة التي تدور في ذهنك إلى Plotcraft</div>

        <!-- مربع الوصف المصغر -->
        <div style="width: 100%; max-width: 440px; background: rgba(30, 36, 50, 0.85); backdrop-filter: blur(15px); border: 1px solid rgba(255,255,255,0.15); border-radius: 18px; padding: 12px; display: flex; flex-direction: column; gap: 10px; text-align: right; box-shadow: 0 10px 30px rgba(0,0,0,0.5);">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <div style="display: inline-flex; align-items: center; gap: 6px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); padding: 5px 10px; border-radius: 10px; color: #fff; font-size: 11px; font-weight: 600; cursor: pointer;" onclick="playClickSound(); showToast('إضافة صورة شخصية')">
                    <span>إضافة</span>
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
                </div>
                <div style="color: #94a3b8; font-size: 11px;">صور مرجعية للشخصيات 0/2</div>
            </div>

            <textarea placeholder="صف القصة التي تريد إنشاءها..." style="width: 100%; height: 50px; background: transparent; border: none; color: #ffffff; font-size: 13px; outline: none; resize: none; line-height: 1.4;"></textarea>

            <div style="display: flex; justify-content: space-between; align-items: center; border-top: 1px solid rgba(255,255,255,0.08); padding-top: 8px;">
                <div style="color: #94a3b8; font-size: 11px;">0/5000</div>
                <div style="display: flex; gap: 6px;">
                    <div style="background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.15); padding: 4px 10px; border-radius: 10px; color: #fff; font-size: 11px; display: flex; align-items: center; gap: 4px; cursor: pointer;" onclick="playClickSound(); showToast('إدخال صوتي')">
                        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v1a7 7 0 0 1-14 0v-1"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
                        <span>إدخال صوتي</span>
                    </div>
                    <div style="background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.15); padding: 4px 10px; border-radius: 10px; color: #fff; font-size: 11px; display: flex; align-items: center; gap: 4px; cursor: pointer;" onclick="playClickSound(); showToast('إلهام القصة')">
                        <span>✨ إلهام</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- صور نوع القصة بالحجم الطبيعي الأصلي -->
        <div style="width: 100%; max-width: 440px; display: flex; flex-direction: column; gap: 10px; margin-top: 5px; text-align: right;">
            <div style="color: #ffffff; font-size: 14px; font-weight: 700;">نوع القصة</div>
            <div style="display: flex; gap: 10px; overflow-x: auto; padding-bottom: 5px; scrollbar-width: none;">
                <div style="min-width: 100px; height: 130px; border-radius: 14px; background: linear-gradient(180deg, rgba(0,0,0,0.2) 0%, rgba(0,0,0,0.9) 100%), #1f242d; border: 2px solid #3b82f6; position: relative; display: flex; flex-direction: column; justify-content: flex-end; padding: 10px; cursor: pointer;" onclick="playClickSound()">
                    <div style="position: absolute; top: 6px; right: 6px; width: 20px; height: 20px; background: #3b82f6; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 10px;">✓</div>
                    <div style="text-align: center; color: #fff; font-size: 12px; font-weight: 700;">أصلي</div>
                </div>
                <div style="min-width: 100px; height: 130px; border-radius: 14px; background: linear-gradient(180deg, rgba(0,0,0,0.2) 0%, rgba(0,0,0,0.9) 100%), url('https://images.unsplash.com/photo-1517604931442-7e0c8ed2963c?q=80&w=200&auto=format&fit=crop') center/cover; border: 1px solid rgba(255,255,255,0.1); position: relative; display: flex; flex-direction: column; justify-content: flex-end; padding: 10px; cursor: pointer;" onclick="playClickSound()">
                    <div style="text-align: center; color: #fff; font-size: 11px; font-weight: 700;">Romance</div>
                </div>
                <div style="min-width: 100px; height: 130px; border-radius: 14px; background: linear-gradient(180deg, rgba(0,0,0,0.2) 0%, rgba(0,0,0,0.9) 100%), url('https://images.unsplash.com/photo-1534447677768-be436bb09401?q=80&w=200&auto=format&fit=crop') center/cover; border: 1px solid rgba(255,255,255,0.1); position: relative; display: flex; flex-direction: column; justify-content: flex-end; padding: 10px; cursor: pointer;" onclick="playClickSound()">
                    <div style="text-align: center; color: #fff; font-size: 11px; font-weight: 700;">FPS-Game</div>
                </div>
            </div>
        </div>

        <div style="width: 100%; max-width: 440px; margin-top: 10px;">
            <button style="width: 100%; background: #ffffff; color: #0b0f19; font-size: 15px; font-weight: 700; padding: 14px; border-radius: 24px; border: none; cursor: pointer; text-align: center; box-shadow: 0 4px 20px rgba(255,255,255,0.2);" onclick="playClickSound(); showToast('جاري البدء...')">استمرار</button>
        </div>
    </div>
</div>

<style>
    #sparkleDialogScreen.screen-view {
        background-color: #0b0f19;
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        z-index: 99999;
        transform: translateY(100%);
        transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
        display: flex;
        padding: 20px;
    }
    #sparkleDialogScreen.screen-view.active {
        transform: translateY(0);
    }
</style>

<script>
    if (typeof playClickSound === 'undefined') {
        window.playClickSound = function() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(450, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(80, audioCtx.currentTime + 0.04);
                gainNode.gain.setValueAtTime(0.12, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.04);
                osc.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.04);
            } catch (e) {}
        };
    }

    if (typeof openSparkleDialog === 'undefined') {
        window.openSparkleDialog = function(event) {
            if (event) event.stopPropagation();
            const dialog = document.getElementById('sparkleDialogScreen');
            if (dialog) {
                dialog.style.display = 'flex';
                setTimeout(() => { dialog.classList.add('active'); }, 10);
            }
            let navBar = document.getElementById('mainNavBar');
            if (navBar) navBar.classList.add('hidden');
        };
    }

    if (typeof closeSparkleDialog === 'undefined') {
        window.closeSparkleDialog = function() {
            const dialog = document.getElementById('sparkleDialogScreen');
            if (dialog) {
                dialog.classList.remove('active');
                setTimeout(() => { dialog.style.display = 'none'; }, 350);
            }
            let navBar = document.getElementById('mainNavBar');
            if (navBar) navBar.classList.remove('hidden');
        };
    }
</script>
