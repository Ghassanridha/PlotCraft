<style>
.modal-overlay {
    display: none; 
    position: fixed; 
    top: 0; 
    left: 0; 
    width: 100%; 
    height: 100%;
    background: rgba(11, 15, 25, 0.9); 
    justify-content: center; 
    align-items: center; 
    z-index: 9999;
    direction: rtl;
}

.modal-container {
    /* جعل صورتك الأصلية هي الخلفية الكاملة والواضحة للنافذة */
    background: linear-gradient(180deg, rgba(11,15,25,0.1) 0%, rgba(11,15,25,0.6) 70%, #0b0f19 100%),
                url('https://raw.githubusercontent.com/Ghassanridha/PlotCraft/54a585f45b13b52a057d4ffeafc29915b9d2ab0c/Gh3.jpg');
    background-size: cover;
    background-position: center;
    padding: 30px 20px;
    border-radius: 28px;
    width: 95%;
    max-width: 440px;
    min-height: 480px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    text-align: center;
    color: white;
    border: 1px solid rgba(255, 255, 255, 0.2);
    box-shadow: 0 25px 50px rgba(0,0,0,0.9);
    box-sizing: border-box;
}

.modal-header-content {
    margin-top: 10px;
}

.modal-title {
    color: #ffffff;
    font-size: 24px;
    font-weight: 800;
    letter-spacing: 0.5px;
    text-shadow: 0 2px 10px rgba(0,0,0,0.8);
}

.modal-subtitle {
    color: #e2e8f0;
    font-size: 13px;
    margin-top: 8px;
    line-height: 1.5;
    text-shadow: 0 2px 8px rgba(0,0,0,0.8);
}

/* زر الاشتراك السفلي البارز */
.bottom-action-box {
    margin-top: 30px;
}

.auto-renew-note {
    font-size: 11px;
    color: #cbd5e1;
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
    text-shadow: 0 1px 4px rgba(0,0,0,0.8);
}

.subscribe-btn {
    width: 100%;
    padding: 14px;
    border-radius: 24px;
    border: none;
    background: #ffffff;
    color: #0b0f19;
    font-size: 15px;
    font-weight: 800;
    cursor: pointer;
    box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    transition: transform 0.1s ease;
}

.subscribe-btn:active {
    transform: scale(0.98);
}

.footer-links {
    margin-top: 15px;
    color: #94a3b8;
    font-size: 11px;
    display: flex;
    justify-content: center;
    gap: 10px;
}

.footer-links span {
    cursor: pointer;
}
.footer-links span:hover {
    color: #ffffff;
}
</style>

<div id="subscriptionModal" class="modal-overlay">
    <div class="modal-container">
        
        <!-- العنوان والترحيب في الأعلى لتكون الشخصية ظاهرة بوضوح -->
        <div class="modal-header-content">
            <div class="modal-title">PLOTCRAFT PRO</div>
            <div class="modal-subtitle">حول خيالك إلى بلوت كرافت<br>ترجم أفكارك إلى مشاهد نابضة بالحياة</div>
        </div>

        <!-- الجزء السفلي: ملاحظة التجديد وزر الاشتراك والروابط -->
        <div class="bottom-action-box">
            <div class="auto-renew-note">
                🔒 تجديد تلقائي، يمكن الإلغاء في أي وقت
            </div>

            <button class="subscribe-btn" onclick="showToast('تم الطلب بنجاح!')">اشتراك</button>
            
            <div class="footer-links">
                <span onclick="showToast('استعادة المشتريات')">استعادة</span>
                <span>|</span>
                <span onclick="showToast('شروط الاستخدام')">شروط الاستخدام</span>
                <span>|</span>
                <span onclick="showToast('سياسة الخصوصية')">الخصوصية</span>
            </div>
        </div>

    </div>
</div>

<script>
    // إغلاق النافذة عند النقر خارج الـ Container
    document.getElementById('subscriptionModal').onclick = function(event) {
        if (event.target === this) {
            closeSubscription();
        }
    };
</script>
