<div id="subscriptionModal" class="modal-overlay">
    <div class="modal-container">
        
        <!-- زر إغلاق (X) المطابق للصورة -->
        <button class="close-btn-overlay" onclick="closeSubscription()" ontouchstart="closeSubscription()">&times;</button>

        <!-- الأزرار الشفافة المطابقة لمواقع الباقات في الصورة البصرية بدقة -->
        <div class="transparent-plan-btn" onclick="selectPlan(this)" ontouchstart="selectPlan(this)" data-plan="weekly"></div>
        <div class="transparent-plan-btn active" onclick="selectPlan(this)" ontouchstart="selectPlan(this)" data-plan="monthly"></div>
        <div class="transparent-plan-btn" onclick="selectPlan(this)" ontouchstart="selectPlan(this)" data-plan="annual"></div>

        <!-- زر الاشتراك السفلي الشفاف أو الفعال -->
        <div class="transparent-subscribe-btn" onclick="executeSubscribe()" ontouchstart="executeSubscribe()"></div>
    </div>
</div>

<style>
.modal-overlay {
    display: none; 
    position: fixed; 
    top: 0; 
    left: 0; 
    width: 100vw; 
    height: 100vh;
    background: #0b0f19; 
    z-index: 999999;
    direction: rtl;
    margin: 0;
    padding: 0;
    overflow: hidden;
    pointer-events: auto !important;
}

.modal-container {
    position: absolute;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    max-width: 100vw;
    max-height: 100vh;
    border-radius: 0;
    border: none;
    margin: 0;
    padding: 0;
    background: url('https://raw.githubusercontent.com/Ghassanridha/PlotCraft/54a585f45b13b52a057d4ffeafc29915b9d2ab0c/Gh3.jpg');
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    box-sizing: border-box;
    pointer-events: auto !important;
}

/* زر إغلاق (X) العلوي الأيمن */
.close-btn-overlay {
    position: absolute;
    top: 35px;
    right: 35px;
    background: rgba(255, 255, 255, 0.15);
    color: #ffffff;
    border: none;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    font-size: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    z-index: 100000;
    touch-action: manipulation;
}

/* الأزرار الشفافة فوق الباقات البصرية بالصور */
.transparent-plan-btn {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    width: 88%;
    max-width: 380px;
    height: 85px;
    background: transparent;
    border: 2px solid transparent;
    border-radius: 18px;
    cursor: pointer;
    z-index: 10;
    touch-action: manipulation;
}

/* مواقع الباقات الثلاثة بالتحديد حسب الصورة البصرية */
.transparent-plan-btn:nth-of-type(1) {
    top: 275px; /* باقة الأسبوع */
}

.transparent-plan-btn:nth-of-type(2) {
    top: 375px; /* باقة الشهر */
}

.transparent-plan-btn:nth-of-type(3) {
    top: 475px; /* باقة السنة */
}

/* إطار أزرق خفيف يظهر على الباقة عند اختيارها لتعرف أنها مفعلة */
.transparent-plan-btn.active {
    border-color: #3b82f6;
    background: rgba(59, 130, 246, 0.1);
    box-shadow: 0 0 15px rgba(59, 130, 246, 0.3);
}

/* زر الاشتراك الكبير السفلي */
.transparent-subscribe-btn {
    position: absolute;
    bottom: 45px;
    left: 50%;
    transform: translateX(-50%);
    width: 88%;
    max-width: 380px;
    height: 60px;
    background: transparent;
    cursor: pointer;
    z-index: 10;
    touch-action: manipulation;
}
</style>

<script>
    if (typeof window.closeSubscription === 'undefined') {
        window.closeSubscription = function() {
            if (window.navigator && window.navigator.vibrate) {
                try { window.navigator.vibrate(30); } catch (e) {}
            }
            const modal = document.getElementById('subscriptionModal');
            if (modal) {
                modal.style.display = 'none';
            }
        };
    }

    if (typeof window.selectPlan === 'undefined') {
        window.selectPlan = function(element) {
            if (window.navigator && window.navigator.vibrate) {
                try { window.navigator.vibrate(40); } catch (e) {}
            }
            document.querySelectorAll('.transparent-plan-btn').forEach(btn => btn.classList.remove('active'));
            element.classList.add('active');
        };
    }

    if (typeof window.executeSubscribe === 'undefined') {
        window.executeSubscribe = function() {
            if (window.navigator && window.navigator.vibrate) {
                try { window.navigator.vibrate(60); } catch (e) {}
            }
            alert("تم إرسال طلب الاشتراك بنجاح!");
        };
    }
</script>
