<div style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #0b0f19; z-index: 99999; direction: rtl; overflow-y: auto; font-family: sans-serif; display: flex; justify-content: center; align-items: center;">
    <div style="width: 100%; max-width: 420px; background: #0d111d; color: #ffffff; padding: 24px; box-sizing: border-box; border-radius: 20px;">
        
        <!-- العنوان -->
        <div style="text-align: center; margin-bottom: 24px;">
            <div style="font-size: 24px; font-weight: 800; color: #c084fc; margin-bottom: 6px;">PlotCraft Pro</div>
            <div style="font-size: 14px; color: #9ca3af;">اختر الباقة المناسبة لك واستمتع بالمميزات</div>
        </div>

        <!-- الباقات الجديدة كلياً -->
        <div style="display: flex; flex-direction: column; gap: 14px; margin-bottom: 24px;">
            
            <!-- باقة أسبوعية -->
            <div class="new-plan-box" onclick="selectNewPlan(this)" style="background: #141a29; border: 2px solid rgba(255, 255, 255, 0.1); border-radius: 14px; padding: 16px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; transition: 0.2s;">
                <div>
                    <div style="font-size: 16px; font-weight: 700; color: #fff;">باقة أسبوعية</div>
                    <div style="font-size: 11px; color: #9ca3af;">تجارب سريعة ومميزات كاملة</div>
                </div>
                <div style="text-align: left;">
                    <div style="font-size: 16px; font-weight: 800; color: #fff;">9.99$</div>
                    <div style="font-size: 11px; color: #9ca3af;">أسبوع</div>
                </div>
            </div>

            <!-- باقة شهرية (مفعلة افتراضياً للإختبار) -->
            <div class="new-plan-box active-box" onclick="selectNewPlan(this)" style="background: #162035; border: 2px solid #3b82f6; box-shadow: 0 0 15px rgba(59, 130, 246, 0.4); border-radius: 14px; padding: 16px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; transition: 0.2s;">
                <div>
                    <div style="font-size: 16px; font-weight: 700; color: #fff;">باقة شهرية (رائج)</div>
                    <div style="font-size: 11px; color: #9ca3af;">الخيار الأفضل للمبدعين</div>
                </div>
                <div style="text-align: left;">
                    <div style="font-size: 16px; font-weight: 800; color: #fff;">29.99$</div>
                    <div style="font-size: 11px; color: #9ca3af;">شهر</div>
                </div>
            </div>

            <!-- باقة سنوية -->
            <div class="new-plan-box" onclick="selectNewPlan(this)" style="background: #141a29; border: 2px solid rgba(255, 255, 255, 0.1); border-radius: 14px; padding: 16px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; transition: 0.2s;">
                <div>
                    <div style="font-size: 16px; font-weight: 700; color: #fff;">باقة سنوية</div>
                    <div style="font-size: 11px; color: #9ca3af;">توفير عالي واستخدام غير محدود</div>
                </div>
                <div style="text-align: left;">
                    <div style="font-size: 16px; font-weight: 800; color: #fff;">69.99$</div>
                    <div style="font-size: 11px; color: #9ca3af;">سنة</div>
                </div>
            </div>

        </div>

        <!-- زر الاشتراك -->
        <button onclick="alert('تم النقر على زر الاشتراك بنجاح!')" style="width: 100%; height: 50px; background: #ffffff; color: #000000; border: none; border-radius: 25px; font-size: 16px; font-weight: 800; cursor: pointer;">اشتراك الآن</button>

    </div>
</div>

<script>
    function selectNewPlan(element) {
        // إزالة التحديد عن كل الباقات
        const allBoxes = document.querySelectorAll('.new-plan-box');
        allBoxes.forEach(box => {
            box.style.borderColor = "rgba(255, 255, 255, 0.1)";
            box.style.background = "#141a29";
            box.style.boxShadow = "none";
        });

        // تحديد الباقة الحالية باللون الأزرق والإضاءة
        element.style.borderColor = "#3b82f6";
        element.style.background = "#162035";
        element.style.boxShadow = "0 0 15px rgba(59, 130, 246, 0.4)";
    }
</script>
