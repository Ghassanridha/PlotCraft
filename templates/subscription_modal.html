<style>
.modal-overlay {
    display: none; 
    position: fixed; 
    top: 0; 
    left: 0; 
    width: 100vw; 
    height: 100vh;
    background: #0b0f19; 
    z-index: 99999;
    direction: rtl;
    margin: 0;
    padding: 0;
    overflow: hidden;
}

.modal-container {
    position: absolute;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    max-width: 100vw;
    max-height: 100vh;
    border-radius: 0;
    border: none;
    margin: 0;
    padding: 0;
    /* عرض تصميمك الأصلي بالكامل بملء الشاشة وبدون أي إضافات فوقه */
    background: url('https://raw.githubusercontent.com/Ghassanridha/PlotCraft/54a585f45b13b52a057d4ffeafc29915b9d2ab0c/Gh3.jpg');
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    box-sizing: border-box;
    cursor: pointer;
}
</style>

<div id="subscriptionModal" class="modal-overlay">
    <div class="modal-container" onclick="closeSubscription()"></div>
</div>

<script>
    // دالة إغلاق النافذة عند النقر عليها (أو اربطها بالزر الخاص بك)
    function closeSubscription() {
        const modal = document.getElementById('subscriptionModal');
        if (modal) {
            modal.style.display = 'none';
        }
    }
</script>
