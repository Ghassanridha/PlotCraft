<!-- 1. التنسيقات CSS -->
<style>
.modal-overlay {
    display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0, 0, 0, 0.9); justify-content: center; align-items: center; z-index: 9999;
}
.modal-container {
    background: #1a1d23; padding: 25px; border-radius: 20px; width: 90%; max-width: 400px;
    text-align: center; color: white; border: 1px solid #333;
}
.plan-card {
    background: #252a34; padding: 15px; margin: 10px 0; border-radius: 12px; cursor: pointer; border: 2px solid transparent; text-align: left;
}
.plan-card.active { border-color: #3b82f6; }
.subscribe-btn {
    width: 100%; padding: 15px; border-radius: 50px; border: none; background: #fff; font-weight: bold; cursor: pointer; margin-top: 20px;
}
.badge { background: #3b82f6; font-size: 10px; padding: 2px 8px; border-radius: 5px; float: right; }
.footer-links { margin-top: 20px; color: #666; font-size: 12px; }
</style>

<!-- 2. الهيكل HTML -->
<div id="subscriptionModal" class="modal-overlay">
    <div class="modal-container">
        <h2 style="color: #fff; margin: 10px 0;">PLOTCRAFT PRO</h2>
        <p style="color: #ccc; margin-bottom: 20px;">حوّل خيالك إلى بلوت كرافت</p>

        <div class="plan-card">
            <div class="price">US 9.99$ <span style="font-size: 12px; color: #888;">/ أسبوع</span></div>
            <div class="details">PlotCraft Pro Weekly</div>
        </div>
        
        <div class="plan-card active">
            <span class="badge">رائج</span>
            <div class="price">US 29.99$ <span style="font-size: 12px; color: #888;">/ شهر</span></div>
            <div class="details">PlotCraft Pro Monthly</div>
        </div>
        
        <div class="plan-card">
            <div class="price">US 69.99$ <span style="font-size: 12px; color: #888;">/ سنة</span></div>
            <div class="details">PlotCraft Pro Annual</div>
        </div>

        <button class="subscribe-btn" onclick="alert('تم الطلب!')">اشترك</button>
        
        <div class="footer-links">
            استعادة | شروط الاستخدام | الخصوصية
        </div>
    </div>
</div>

<!-- 3. البرمجة JS -->
<script>
    function openSubscription() {
        document.getElementById('subscriptionModal').style.display = 'flex';
    }
    window.onclick = function(event) {
        if (event.target == document.getElementById('subscriptionModal')) {
            document.getElementById('subscriptionModal').style.display = 'none';
        }
    }
</script>
