<button id="upgradeBtn">ترقية</button>

<div id="subscriptionModal" class="subscription-modal-overlay hidden">
  <div class="subscription-modal-box">
    <button class="sub-modal-close-x" onclick="closeSubscriptionModal()">×</button>
    <img
      src="https://raw.githubusercontent.com/Ghassanridha/PlotCraft/main/Gh.jpg"
      class="design-image"
      alt="Subscription design"
    >
  </div>
</div>

<script>
  function openSubscriptionModal() {
    document.getElementById('subscriptionModal').classList.remove('hidden');
  }

  function closeSubscriptionModal() {
    document.getElementById('subscriptionModal').classList.add('hidden');
  }

  document.getElementById('upgradeBtn').addEventListener('click', function () {
    openSubscriptionModal();
  });
</script>

<style>
  .subscription-modal-overlay {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,0,0.72);
    z-index: 99999;
    padding: 18px;
  }

  .subscription-modal-overlay.hidden {
    display: none;
  }

  .subscription-modal-box {
    position: relative;
    width: min(92vw, 420px);
    height: min(92vh, 760px);
    background: #fff;
    border-radius: 24px;
    overflow: hidden;
    box-shadow: 0 20px 50px rgba(0,0,0,0.35);
  }

  .sub-modal-close-x {
    position: absolute;
    top: 14px;
    right: 14px;
    width: 36px;
    height: 36px;
    border: none;
    border-radius: 50%;
    background: rgba(255,255,255,0.85);
    font-size: 24px;
    cursor: pointer;
  }

  .design-image {
    width: 100%;
    height: 100%;
    display: block;
    object-fit: contain;
    background: #fff;
  }
</style>
