<!-- نافذة الاشتراكات والترقية المستقلة -->
<div class="subscription-modal-overlay hidden" id="subscriptionModal">
    <div class="subscription-modal-box">
        <div class="sub-modal-header">
            <div class="sub-modal-title">PlotCraft PRO</div>
            <button class="sub-modal-close-x" onclick="closeSubscriptionModal()">✕</button>
        </div>
        
        <div class="plans-list">
            <!-- الخطة الأسبوعية -->
            <div class="plan-card" onclick="selectPlan(this)">
                <div class="plan-top">
                    <span class="plan-name">PlotCraft Pro Weekly</span>
                    <span class="plan-price">$US 9.99 / أسبوع</span>
                </div>
                <div class="plan-desc">Credits / Week , Try AI PlotCraft 500 Creation</div>
            </div>

            <!-- الخطة الشهرية -->
            <div class="plan-card selected" onclick="selectPlan(this)">
                <span class="new-tag">رائج</span>
                <div class="plan-top">
                    <span class="plan-name">PlotCraft Pro Monthly</span>
                    <span class="plan-price">$US 29.99 / شهر</span>
                </div>
                <div class="plan-desc">Credits / Month, Ideal for regular 1800 creators</div>
            </div>

            <!-- الخطة السنوية -->
            <div class="plan-card" onclick="selectPlan(this)">
                <div class="plan-top">
                    <span class="plan-name">PlotCraft Pro Annual</span>
                    <span class="plan-price">$US 69.99 / سنة</span>
                </div>
                <div class="plan-desc">5000 Credits / Year, Ideal for professional creators</div>
            </div>
        </div>

        <button class="action-main-btn" onclick="confirmSubscription()">اشتراك</button>
    </div>
</div>
