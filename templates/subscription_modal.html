<div id="subscriptionModal" class="modal-overlay">
    <!-- أضفنا زر إغلاق وهمي أو صريح في الأعلى يمين التصميم ليتم النقر عليه للإغلاق، أو انقر على الخلفية -->
    <button class="close-btn-overlay" onclick="closeSubscription(event)" ontouchstart="closeSubscription(event)">&times;</button>
    <div class="modal-container"></div>
</div>

<style>
.modal-overlay {
    display: none; 
    position: fixed; 
    top: 0; 
    left: 0; 
    width: 100vw; 
    height: 100vh;
    background: #0b0f19; 
    z-index: 999999;
    direction: rtl;
    margin: 0;
    padding: 0;
    overflow: hidden;
    pointer-events: auto !important;
}

/* زر إغلاق أنيق وشفاف في أعلى اليمين ليتمكن المستخدم من الخروج متى ما أراد */
.close-btn-overlay {
    position: absolute;
    top: 20px;
    right: 20px;
    background: rgba(0, 0, 0, 0.6);
    color: #ffffff;
    border: 1px solid rgba(255, 255, 255, 0.3);
    width: 40px;
    height: 40px;
    border-radius: 50%;
    font-size: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    z-index: 1000000;
    pointer-events: auto !important;
    touch-action: manipulation;
}

.modal-container {
    position: absolute;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    max-width: 100vw;
    max-height: 100vh;
    border-radius: 0;
    border: none;
    margin: 0;
    padding: 0;
    background: url('https://raw.githubusercontent.com/Ghassanridha/PlotCraft/54a585f45b13b52a057d4ffeafc29915b9d2ab0c/Gh3.jpg');
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    box-sizing: border-box;
    pointer-events: auto !important;
}
</style>

<script>
    if (typeof window.closeSubscription === 'undefined') {
        window.closeSubscription = function(event) {
            if (event) event.stopPropagation(); // منع انتقال الحدث للحاويات الأخرى
            if (window.navigator && window.navigator.vibrate) {
                try { window.navigator.vibrate(30); } catch (e) {}
            }
            const modal = document.getElementById('subscriptionModal');
            if (modal) {
                modal.style.display = 'none';
            }
        };
    }
</script>
