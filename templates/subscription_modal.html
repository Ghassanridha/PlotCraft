<!-- نافذة الاشتراكات والترقية المستقلة -->
<div class="subscription-modal-overlay hidden" id="subscriptionModal">
    <div class="subscription-modal-box">
        <div class="sub-modal-header">
            <div class="sub-modal-title">اختر خطة الاشتراك</div>
            <button class="sub-modal-close-x" onclick="closeSubscriptionModal()">✕</button>
        </div>
        
        <div class="plans-list">
            <!-- الخطة الأسبوعية -->
            <div class="plan-card" onclick="selectPlan(this)">
                <div class="plan-top">
                    <span class="plan-name">الاشتراك الأسبوعي</span>
                    <span class="plan-price">$2.99 / أسبوع</span>
                </div>
                <div class="plan-desc">تجربة سريعة لجميع الميزات الفائقة والتصدير.</div>
            </div>

            <!-- الخطة الشهرية -->
            <div class="plan-card selected" onclick="selectPlan(this)">
                <span class="new-tag">الأكثر شعبية</span>
                <div class="plan-top">
                    <span class="plan-name">الاشتراك الشهري</span>
                    <span class="plan-price">$9.99 / شهر</span>
                </div>
                <div class="plan-desc">إنشاء قصص وفيديوهات غير محدودة بجودة عالية.</div>
            </div>

            <!-- الخطة السنوية -->
            <div class="plan-card" onclick="selectPlan(this)">
                <span class="best-value-tag">توفير 30%</span>
                <div class="plan-top">
                    <span class="plan-name">الاشتراك السنوي</span>
                    <span class="plan-price">$79.99 / سنة</span>
                </div>
                <div class="plan-desc">وصول كامل ومفتوح طوال السنة مع التحديثات.</div>
            </div>
        </div>

        <button class="action-main-btn" onclick="confirmSubscription()">اشترك الآن</button>
    </div>
</div>
