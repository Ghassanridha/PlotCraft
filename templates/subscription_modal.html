<div id="subscriptionModal" class="modal-overlay">
    <div class="modal-container" onclick="closeSubscription()" ontouchstart="closeSubscription()"></div>
</div>

<style>
.modal-overlay {
    display: none; 
    position: fixed; 
    top: 0; 
    left: 0; 
    width: 100vw; 
    height: 100vh;
    background: #0b0f19; 
    z-index: 999999;
    direction: rtl;
    margin: 0;
    padding: 0;
    overflow: hidden;
    pointer-events: auto !important;
}

.modal-container {
    position: absolute;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    max-width: 100vw;
    max-height: 100vh;
    border-radius: 0;
    border: none;
    margin: 0;
    padding: 0;
    background: url('https://raw.githubusercontent.com/Ghassanridha/PlotCraft/54a585f45b13b52a057d4ffeafc29915b9d2ab0c/Gh3.jpg');
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    box-sizing: border-box;
    cursor: pointer;
    pointer-events: auto !important;
    touch-action: manipulation;
}
</style>

<script>
    if (typeof window.closeSubscription === 'undefined') {
        window.closeSubscription = function() {
            if (window.navigator && window.navigator.vibrate) {
                try { window.navigator.vibrate(30); } catch (e) {}
            }
            const modal = document.getElementById('subscriptionModal');
            if (modal) {
                modal.style.display = 'none';
            }
        };
    }
</script>
