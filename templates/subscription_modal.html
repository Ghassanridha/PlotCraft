<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PlotCraft Pro - اشتراك</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #0d111d;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }

        .sub-wrapper {
            width: 100%;
            max-width: 420px;
            background: #111827;
            border-radius: 24px;
            padding: 24px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        /* العناوين */
        .sub-header {
            text-align: center;
            margin-bottom: 24px;
        }

        .sub-title {
            font-size: 24px;
            font-weight: 800;
            background: linear-gradient(90deg, #c084fc, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 6px;
        }

        .sub-desc {
            font-size: 13px;
            color: #9ca3af;
        }

        /* حاوية الباقات */
        .plans-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 24px;
        }

        /* تصميم كارت الباقة المفردة */
        .plan-card {
            position: relative;
            background: #1f2937;
            border: 2px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: all 0.2s ease;
            touch-action: manipulation;
        }

        .plan-card:active {
            transform: scale(0.98);
        }

        /* حالة الباقة النشطة (الإطار الأزرق والإضاءة) */
        .plan-card.selected {
            border-color: #3b82f6 !important;
            background: #1e293b !important;
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.4);
        }

        .plan-badge {
            position: absolute;
            top: -10px;
            left: 16px;
            background: #3b82f6;
            color: #ffffff;
            font-size: 10px;
            font-weight: bold;
            padding: 2px 8px;
            border-radius: 6px;
        }

        .plan-info h3 {
            font-size: 16px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 4px;
        }

        .plan-info p {
            font-size: 11px;
            color: #9ca3af;
        }

        .plan-pricing {
            text-align: left;
        }

        .plan-pricing .price {
            font-size: 17px;
            font-weight: 800;
            color: #ffffff;
        }

        .plan-pricing .period {
            font-size: 11px;
            color: #9ca3af;
        }

        /* زر الاشتراك */
        .subscribe-btn {
            width: 100%;
            height: 50px;
            background: #ffffff;
            color: #000000;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            touch-action: manipulation;
        }

        .subscribe-btn:active {
            transform: scale(0.97);
            background: #e5e7eb;
        }

        .footer-note {
            text-align: center;
            font-size: 11px;
            color: #9ca3af;
            margin-top: 14px;
        }
    </style>
</head>
<body>

    <div class="sub-wrapper">
        
        <!-- الترويسة -->
        <div class="sub-header">
            <div class="sub-title">PLOTCRAFT PRO</div>
            <div class="sub-desc">اختر الباقة المناسبة وفعل مميزات الذكاء الاصطناعي</div>
        </div>

        <!-- الباقات -->
        <div class="plans-list">
            
            <!-- باقة الأسبوع -->
            <div class="plan-card" onclick="choosePlan(this)" ontouchstart="choosePlan(this)">
                <div class="plan-info">
                    <h3>باقة أسبوعية</h3>
                    <p>500 نقطة، تجربة سريعة كاملة</p>
                </div>
                <div class="plan-pricing">
                    <div class="price">9.99$</div>
                    <div class="period">أسبوع</div>
                </div>
            </div>

            <!-- باقة الشهر (مفعلة افتراضياً) -->
            <div class="plan-card selected" onclick="choosePlan(this)" ontouchstart="choosePlan(this)">
                <div class="plan-badge">رائج</div>
                <div class="plan-info">
                    <h3>باقة شهرية</h3>
                    <p>1800 نقطة، الخيار الأفضل للمبدعين</p>
                </div>
                <div class="plan-pricing">
                    <div class="price">29.99$</div>
                    <div class="period">شهر</div>
                </div>
            </div>

            <!-- باقة السنة -->
            <div class="plan-card" onclick="choosePlan(this)" ontouchstart="choosePlan(this)">
                <div class="plan-info">
                    <h3>باقة سنوية</h3>
                    <p>5000 نقطة، توفير عالي واستخدام موسع</p>
                </div>
                <div class="plan-pricing">
                    <div class="price">69.99$</div>
                    <div class="period">سنة</div>
                </div>
            </div>

        </div>

        <!-- زر الاشتراك -->
        <button class="subscribe-btn" onclick="executeSubscribe()" ontouchstart="executeSubscribe()">اشتراك الآن</button>
        
        <div class="footer-note">تجديد تلقائي، يمكنك الإلغاء في أي وقت</div>

    </div>

    <script>
        // دالة اختيار الباقة والتفاعل الفوري مع اللمس والنقر
        function choosePlan(cardElement) {
            // اهتزاز خفيف للهاتف
            if (window.navigator && window.navigator.vibrate) {
                try { window.navigator.vibrate(40); } catch (e) {}
            }

            // إزالة التحديد عن جميع الكروت
            const allCards = document.querySelectorAll('.plan-card');
            allCards.forEach(card => card.classList.remove('selected'));

            // تحديد الكارت الحالي باللون الأزرق والإضاءة
            cardElement.classList.add('selected');
        }

        // دالة زر الاشتراك
        function executeSubscribe() {
            if (window.navigator && window.navigator.vibrate) {
                try { window.navigator.vibrate(60); } catch (e) {}
            }
            alert("تم إرسال طلب الاشتراك بنجاح!");
        }
    </script>
</body>
</html>
