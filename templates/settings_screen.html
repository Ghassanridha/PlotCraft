<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PlotCraft - الإعدادات والاشتراك</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1f242d;
            font-family: system-ui, -apple-system, sans-serif;
        }

        .settings-screen {
            display: flex;
            flex-direction: column;
            padding: 20px;
            box-sizing: border-box;
            min-height: 100vh;
        }

        .settings-top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }
        .settings-title {
            color: #ffffff;
            font-size: 18px;
            font-weight: 700;
        }
        .settings-close-btn, .settings-upgrade-badge {
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 13px;
            cursor: pointer;
        }

        /* نافذة الاشتراك العلوية المضبوطة بدقة */
        .subscription-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: #1f242d;
            z-index: 1000000;
            flex-direction: column;
            overflow-y: auto;
        }
        .subscription-modal.show { display: flex !important; }

        .sub-hero-image-container {
            position: relative;
            width: 100%;
            flex-shrink: 0;
        }
        .sub-hero-img-tag {
            width: 100%;
            height: auto;
            display: block;
        }
        .sub-close-circle {
            position: absolute;
            top: 16px;
            left: 16px;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff; width: 36px; height: 36px;
            border-radius: 50%; cursor: pointer; font-size: 18px;
            display: flex; align-items: center; justify-content: center;
            z-index: 10;
        }

        .sub-content-body {
            max-width: 480px;
            width: 100%;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
            padding: 20px;
            box-sizing: border-box;
        }

        .pricing-card {
            background: #161b22;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 16px;
            padding: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
        }
        .pricing-card.active {
            border: 2px solid #3b82f6;
            background: #1a2333;
        }
    </style>
</head>
<body>

    <div class="settings-screen">
        <div class="settings-top-bar">
            <button class="settings-close-btn" onclick="triggerHaptic()">‹</button>
            <div class="settings-title">الإعدادات</div>
            <button class="settings-upgrade-badge" onclick="triggerHaptic(); openSubModal()">ترقية</button>
        </div>
        <div style="color: #fff; text-align: center; margin-top: 40px;">
            <button onclick="triggerHaptic(); openSubModal()" style="padding: 12px 24px; background: #3b82f6; color: #fff; border: none; border-radius: 12px; font-weight: bold; cursor: pointer;">عرض نافذة الاشتراكات</button>
        </div>
    </div>

    <!-- نافذة الاشتراكات العلوية الأصلية الصافية -->
    <div class="subscription-modal" id="subModal">
        <div class="sub-hero-image-container">
            <img src="https://raw.githubusercontent.com/Ghassanridha/PlotCraft/ec9da0e286f63eeabed9d411cce650d0aa7da5e3/Gh3.jpg" class="sub-hero-img-tag" alt="صورة الغلاف">
            <button class="sub-close-circle" onclick="triggerHaptic(); closeSubModal()">✕</button>
        </div>

        <div class="sub-content-body">
            <div style="text-align: right;">
                <div style="font-size: 24px; font-weight: 800; color: #fff;">PLOTCRAFT PRO</div>
                <div style="font-size: 17px; font-weight: 700; color: #fff; margin-top: 4px;">حوْل خيالك إلى بلوت كرافت</div>
                <div style="font-size: 12px; color: #94a3b8; margin-top: 2px;">ترجم أفكارك إلى مشاهد نابضة بالحياة</div>
            </div>

            <!-- الميزات -->
            <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; text-align: center;">
                <div style="background: #161b22; padding: 12px 4px; border-radius: 12px; font-size: 11px; color: #cbd5e1; border: 1px solid rgba(255,255,255,0.08);">نص AI</div>
                <div style="background: #161b22; padding: 12px 4px; border-radius: 12px; font-size: 11px; color: #cbd5e1; border: 1px solid rgba(255,255,255,0.08);">القصة المصورة</div>
                <div style="background: #161b22; padding: 12px 4px; border-radius: 12px; font-size: 11px; color: #cbd5e1; border: 1px solid rgba(255,255,255,0.08);">لقطة AI</div>
                <div style="background: #161b22; padding: 12px 4px; border-radius: 12px; font-size: 11px; color: #cbd5e1; border: 1px solid rgba(255,255,255,0.08);">مونتاج AI</div>
            </div>

            <!-- خيارات الباقات التفاعلية -->
            <div class="pricing-card" data-plan="weekly" data-price="$US 9.99" onclick="triggerHaptic(); selectPlan(this)">
                <div>
                    <div style="font-size: 15px; font-weight: 700; color: #fff;">PlotCraft Pro Weekly</div>
                    <div style="font-size: 11px; color: #94a3b8; margin-top: 4px;">500 Credits / Week</div>
                </div>
                <div style="text-align: left;">
                    <div style="font-size: 15px; font-weight: 800; color: #fff;">$US 9.99</div>
                    <div style="font-size: 11px; color: #94a3b8;">أسبوع</div>
                </div>
            </div>

            <div class="pricing-card active" data-plan="monthly" data-price="$US 29.99" onclick="triggerHaptic(); selectPlan(this)">
                <div>
                    <div style="font-size: 15px; font-weight: 700; color: #fff;">PlotCraft Pro Monthly</div>
                    <div style="font-size: 11px; color: #94a3b8; margin-top: 4px;">1800 Credits / Month</div>
                </div>
                <div style="text-align: left;">
                    <div style="font-size: 15px; font-weight: 800; color: #fff;">$US 29.99</div>
                    <div style="font-size: 11px; color: #3b82f6;">شهر</div>
                </div>
            </div>

            <div class="pricing-card" data-plan="annual" data-price="$US 69.99" onclick="triggerHaptic(); selectPlan(this)">
                <div>
                    <div style="font-size: 15px; font-weight: 700; color: #fff;">PlotCraft Pro Annual</div>
                    <div style="font-size: 11px; color: #94a3b8; margin-top: 4px;">5000 Credits / Year</div>
                </div>
                <div style="text-align: left;">
                    <div style="font-size: 15px; font-weight: 800; color: #fff;">$US 69.99</div>
                    <div style="font-size: 11px; color: #94a3b8;">سنة</div>
                </div>
            </div>

            <button onclick="triggerHaptic(); alert('تم اختيار الباقة')" style="width: 100%; background: #ffffff; color: #0b0f19; font-size: 16px; font-weight: 800; padding: 16px; border-radius: 20px; border: none; cursor: pointer;">
                اشتراك
            </button>
        </div>
    </div>

    <script>
        function triggerHaptic() {
            if (navigator.vibrate) { navigator.vibrate(50); }
        }

        function openSubModal() { document.getElementById('subModal').classList.add('show'); }
        function closeSubModal() { document.getElementById('subModal').classList.remove('show'); }

        function selectPlan(element) {
            document.querySelectorAll('.pricing-card').forEach(card => card.classList.remove('active'));
            element.classList.add('active');
        }
    </script>
</body>
</html>
