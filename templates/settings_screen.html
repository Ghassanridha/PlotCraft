<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الإعدادات</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background-color: #1f242d;
            font-family: Tahoma, Arial, sans-serif;
            color: #fff;
            box-sizing: border-box;
        }
        .settings-top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            margin-bottom: 25px;
        }
        .settings-title {
            font-size: 18px;
            font-weight: 700;
        }
        .settings-close-btn, .settings-upgrade-badge {
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
        }
        .profile-header-card {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 20px;
            background: #282f3d;
            padding: 15px;
            border-radius: 16px;
        }
        .profile-avatar-box {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: #111827;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #60a5fa;
            font-weight: bold;
        }
        .settings-group-box {
            background: #282f3d;
            border-radius: 16px;
            padding: 10px 16px;
            margin-bottom: 16px;
        }
        .settings-item-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="settings-top-bar">
        <button class="settings-close-btn" onclick="goBack()">‹ رجوع</button>
        <div class="settings-title">الإعدادات</div>
        <button class="settings-upgrade-badge" onclick="alert('ترقية الحساب')">ترقية</button>
    </div>

    <div class="profile-header-card">
        <div class="profile-avatar-box">P</div>
        <div>
            <div style="font-weight: bold; font-size: 16px;">NewUser</div>
            <div style="color: #cbd5e1; font-size: 12px;">معرف المستخدم: 0000000</div>
        </div>
    </div>

    <div class="settings-group-box">
        <div class="settings-item-row" onclick="alert('سجل النقاط')">
            <span>سجل النقاط</span>
            <span>›</span>
        </div>
    </div>

    <script>
        function goBack() {
            // العودة للصفحة الرئيسية أو إغلاق الإعدادات
            window.location.href = 'index.html'; 
        }
    </script>
</body>
</html>
