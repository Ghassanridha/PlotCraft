<!-- شاشة اليوتيوب الكاملة والتفاعلية (youtube.html) -->
<div id="toolsScreen" class="screen-view" style="padding-bottom: 70px; background-color: #0f0f0f; position: relative;">

    <!-- 1. الهيدر والشريط العلوي المتحرك (Hide on Scroll Down / Show on Scroll Up) -->
    <div id="ytHeaderContainer" style="position: sticky; top: 0; z-index: 100; background-color: #0f0f0f; transition: transform 0.3s ease, opacity 0.3s ease; border-bottom: 1px solid rgba(255,255,255,0.08);">
        
        <!-- السطر العلوي: الشعار + الإشعارات + البحث -->
        <div style="display: flex; justify-content: space-between; align-items: center; padding: 12px 16px;">
            <!-- اليسار: أيقونة البحث والإشعارات -->
            <div style="display: flex; align-items: center; gap: 18px;">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="cursor: pointer;">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
                <div style="position: relative; cursor: pointer;">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                        <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
                    </svg>
                    <span style="position: absolute; top: -5px; right: -7px; background: #ff0000; color: #ffffff; font-size: 9px; font-weight: bold; padding: 1px 4px; border-radius: 8px;">+9</span>
                </div>
            </div>

            <!-- اليمين: شعار YouTube الرسمي -->
            <div style="display: flex; align-items: center; gap: 5px; cursor: pointer;">
                <span style="color: #ffffff; font-weight: bold; font-size: 18px; letter-spacing: -0.5px; font-family: Roboto, sans-serif;">YouTube</span>
                <svg width="28" height="20" viewBox="0 0 24 24" fill="none">
                    <rect x="2" y="4" width="20" height="16" rx="4" fill="#FF0000" />
                    <polygon points="10,8 16,12 10,16" fill="#FFFFFF" />
                </svg>
            </div>
        </div>

        <!-- السطر الثاني: شريط التبويبات العلوي -->
        <div style="display: flex; gap: 20px; padding: 8px 16px 12px 16px; overflow-x: auto; white-space: nowrap; scrollbar-width: none; direction: rtl;">
            <div style="color: #ffffff; font-size: 14px; font-weight: bold; position: relative; padding-bottom: 4px; cursor: pointer;">
                الصفحة الرئيسية
                <div style="position: absolute; bottom: 0; right: 0; width: 100%; height: 2px; background: #ff0000; border-radius: 2px;"></div>
            </div>
            <div style="color: #aaaaaa; font-size: 14px; font-weight: 500; cursor: pointer;">الاشتراكات</div>
            <div style="color: #aaaaaa; font-size: 14px; font-weight: 500; cursor: pointer;">موسيقى</div>
            <div style="color: #aaaaaa; font-size: 14px; font-weight: 500; cursor: pointer;">مباشر</div>
            <div style="color: #aaaaaa; font-size: 14px; font-weight: 500; cursor: pointer;">المزيد</div>
        </div>
    </div>

    <!-- 2. محتوى القائمة والبطاقات -->
    <div style="padding: 16px; display: flex; flex-direction: column; gap: 18px;">
        
        <!-- بطاقة فيديو 1 -->
        <div style="background: #1f242d; border-radius: 16px; overflow: hidden; border: 1px solid rgba(255,255,255,0.08);" onclick="showToast('جاري فتح الأداة...')">
            <div style="width: 100%; height: 180px; background: linear-gradient(180deg, rgba(0,0,0,0.1) 0%, rgba(0,0,0,0.8) 100%), url('https://images.unsplash.com/photo-1611162617213-7d7a39e9b1d7?q=80&w=600&auto=format&fit=crop') center/cover; position: relative; display: flex; align-items: center; justify-content: center;">
                <div style="width: 48px; height: 48px; background: rgba(255,0,0,0.9); border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 12px rgba(255,0,0,0.5);">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="#ffffff"><polygon points="8,5 19,12 8,19" /></svg>
                </div>
                <span style="position: absolute; bottom: 8px; left: 8px; background: rgba(0,0,0,0.8); color: #fff; font-size: 10px; font-weight: bold; padding: 2px 6px; border-radius: 4px;">10:25</span>
            </div>
            <div style="padding: 12px; display: flex; gap: 12px; align-items: center;">
                <div style="width: 38px; height: 38px; border-radius: 50%; background: #ff0000; display: flex; align-items: center; justify-content: center; color: #fff; font-weight: bold; font-size: 15px; flex-shrink: 0;">🎬</div>
                <div style="flex-grow: 1;">
                    <h3 style="color: #ffffff; font-size: 14px; font-weight: 700; margin-bottom: 2px;">مُنشئ سكربتات وحوارات اليوتيوب</h3>
                    <p style="color: #aaa; font-size: 11px;">توليد سيناريو كامل بالذكاء الاصطناعي</p>
                </div>
            </div>
        </div>

        <!-- بطاقة فيديو 2 -->
        <div style="background: #1f242d; border-radius: 16px; overflow: hidden; border: 1px solid rgba(255,255,255,0.08);" onclick="showToast('جاري تحويل النص...')">
            <div style="width: 100%; height: 180px; background: linear-gradient(180deg, rgba(0,0,0,0.1) 0%, rgba(0,0,0,0.8) 100%), url('https://images.unsplash.com/photo-1574717024653-61fd2cf4d44d?q=80&w=600&auto=format&fit=crop') center/cover; position: relative; display: flex; align-items: center; justify-content: center;">
                <div style="width: 48px; height: 48px; background: rgba(255,255,255,0.2); backdrop-filter: blur(8px); border-radius: 50%; display: flex; align-items: center; justify-content: center;">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="#ffffff"><polygon points="8,5 19,12 8,19" /></svg>
                </div>
                <span style="position: absolute; bottom: 8px; left: 8px; background: rgba(0,0,0,0.8); color: #fff; font-size: 10px; font-weight: bold; padding: 2px 6px; border-radius: 4px;">Shorts</span>
            </div>
            <div style="padding: 12px; display: flex; gap: 12px; align-items: center;">
                <div style="width: 38px; height: 38px; border-radius: 50%; background: #3b82f6; display: flex; align-items: center; justify-content: center; color: #fff; font-weight: bold; font-size: 15px; flex-shrink: 0;">⚡</div>
                <div style="flex-grow: 1;">
                    <h3 style="color: #ffffff; font-size: 14px; font-weight: 700; margin-bottom: 2px;">تحويل القصة إلى شورتس عمودي</h3>
                    <p style="color: #aaa; font-size: 11px;">توليد المقاطع والأصوات المصممة لـ Shorts</p>
                </div>
            </div>
        </div>

    </div>

    <!-- 3. الشريط السفلي الثابت حصراً (Fixed Bottom Bar) -->
    <div style="position: fixed; bottom: 0; left: 0; width: 100%; height: 60px; background-color: #0f0f0f; border-top: 1px solid rgba(255,255,255,0.1); display: flex; justify-content: space-around; align-items: center; z-index: 999999; box-sizing: border-box;">
        
        <!-- 1. أيقونة الرئيسية -->
        <div style="display: flex; flex-direction: column; align-items: center; cursor: pointer; color: #ffffff;" onclick="switchScreen('homeScreen', event)">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
                <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>
            </svg>
        </div>

        <!-- 2. أيقونة Shorts -->
        <div style="display: flex; flex-direction: column; align-items: center; cursor: pointer; color: #ffffff;" onclick="showToast('Shorts')">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
                <path d="M17.77 10.32l-1.2-.5L18 9.06c1.84-.96 2.53-3.23 1.56-5.06s-3.24-2.53-5.07-1.56L6 6.22C4.13 7.18 3.42 9.48 4.38 11.33c.53 1.02 1.45 1.7 2.53 1.94l1.2.5-1.43.76c-1.84.96-2.53 3.23-1.56 5.06 1 1.83 3.27 2.5 5.1 1.53l8.43-3.78c1.87-.96 2.58-3.26 1.62-5.11-.53-1.01-1.45-1.7-2.5-1.91zM10 14.5v-5l4.5 2.5L10 14.5z"/>
            </svg>
        </div>

        <!-- 3. أيقونة الزائد + (إنشاء) -->
        <div style="display: flex; flex-direction: column; align-items: center; cursor: pointer; color: #ffffff;" onclick="openSparkleDialog(event)">
            <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                <circle cx="12" cy="12" r="10" stroke="#ffffff"/>
                <line x1="12" y1="8" x2="12" y2="16" stroke="#ffffff"/>
                <line x1="8" y1="12" x2="16" y2="12" stroke="#ffffff"/>
            </svg>
        </div>

        <!-- 4. أيقونة الحساب / الصورة الشخصية -->
        <div style="display: flex; flex-direction: column; align-items: center; cursor: pointer;" onclick="openSettingsScreen(event)">
            <div style="width: 26px; height: 26px; border-radius: 50%; overflow: hidden; border: 1.5px solid #ffffff;">
                <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?q=80&w=100&auto=format&fit=crop" style="width: 100%; height: 100%; object-fit: cover;" alt="Profile">
            </div>
        </div>

    </div>

</div>

<!-- 4. سكربت إخفاء وإظهار الهيدر العلوي عند السحب (Scroll) -->
<script>
    (function() {
        let lastScrollTop = 0;
        const toolsScreen = document.getElementById('toolsScreen');
        const ytHeader = document.getElementById('ytHeaderContainer');

        if (toolsScreen && ytHeader) {
            toolsScreen.addEventListener('scroll', function() {
                let scrollTop = toolsScreen.scrollTop;
                
                // إذا سحب لأسفل أختفي الهيدر، وإذا سحب للأعلى يظهر فوراً
                if (scrollTop > lastScrollTop && scrollTop > 50) {
                    ytHeader.style.transform = 'translateY(-100%)';
                    ytHeader.style.opacity = '0';
                } else {
                    ytHeader.style.transform = 'translateY(0)';
                    ytHeader.style.opacity = '1';
                }
                lastScrollTop = scrollTop;
            });
        }
    })();
</script>
