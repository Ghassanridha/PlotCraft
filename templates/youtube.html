 <!-- شاشة اليوتيوب الرئيسية (youtube.html) -->
<div id="toolsScreen" class="screen-view" style="padding-bottom: 70px; background-color: #0f0f0f; position: relative; height: 100vh; overflow-y: auto;">

    <!-- 1. مشغل يوتيوب العلوي المباشر -->
    <div id="activePlayerContainer" style="display: none; width: 100%; background: #000; position: sticky; top: 0; z-index: 200; border-bottom: 1px solid rgba(255,255,255,0.1);">
        <div style="position: relative; width: 100%; height: 215px; background: #000;">
            <iframe id="mainYouTubeEmbed" src="" style="width: 100%; height: 100%; border: none;" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
            <!-- زر إغلاق المشغل -->
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="position: absolute; top: 10px; left: 10px; cursor: pointer; background: rgba(0,0,0,0.8); border-radius: 50%; padding: 4px; z-index: 210;" onclick="closeActivePlayer()">
                <line x1="18" y1="6" x2="6" y2="18"></line>
                <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
        </div>
        <div id="activeVideoInfo" style="padding: 10px 16px; color: #fff; font-size: 14px; font-weight: bold; border-bottom: 1px solid rgba(255,255,255,0.05); text-align: right;"></div>
    </div>

    <!-- الهيدر العلوي وشريط البحث -->
    <div id="ytHeaderContainer" style="position: sticky; top: 0; z-index: 100; background-color: #0f0f0f; border-bottom: 1px solid rgba(255,255,255,0.08);">
        
        <div id="mainHeaderView" style="display: flex; justify-content: space-between; align-items: center; padding: 12px 16px;">
            <div style="display: flex; align-items: center; gap: 18px;">
                <!-- أيقونة البحث -->
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="cursor: pointer;" onclick="openSearchUI()">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
                <!-- الإشعارات -->
                <div style="position: relative; cursor: pointer;">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                        <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
                    </svg>
                    <span style="position: absolute; top: -5px; right: -7px; background: #ff0000; color: #ffffff; font-size: 9px; font-weight: bold; padding: 1px 4px; border-radius: 8px;">+9</span>
                </div>
            </div>

            <!-- اللوجو -->
            <div style="display: flex; align-items: center; gap: 5px; cursor: pointer;">
                <span style="color: #ffffff; font-weight: bold; font-size: 18px; font-family: Roboto, sans-serif;">YouTube</span>
                <svg width="28" height="20" viewBox="0 0 24 24" fill="none">
                    <rect x="2" y="4" width="20" height="16" rx="4" fill="#FF0000" />
                    <polygon points="10,8 16,12 10,16" fill="#FFFFFF" />
                </svg>
            </div>
        </div>

        <!-- واجهة البحث التفاعلية -->
        <div id="searchHeaderView" style="display: none; padding: 10px 16px; background: #0f0f0f; align-items: center; gap: 12px; position: relative;">
            <input type="text" id="searchInput" oninput="handleSearchInput(this.value)" placeholder="ابحث في الفيديوهات..." style="width: 100%; background: #222222; border: 1px solid rgba(255,255,255,0.2); border-radius: 20px; padding: 8px 16px; color: #ffffff; font-size: 14px; outline: none; text-align: right;">
            
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="cursor: pointer;" onclick="closeSearchUI()">
                <line x1="18" y1="6" x2="6" y2="18"></line>
                <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>

            <!-- قائمة الاقتراحات المنسدلة للبحث -->
            <div id="searchSuggestions" style="display: none; position: absolute; top: 50px; left: 16px; right: 16px; background: #1f1f1f; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); max-height: 220px; overflow-y: auto; z-index: 300; box-shadow: 0 8px 20px rgba(0,0,0,0.8); text-align: right;">
            </div>
        </div>

        <!-- شريط التبويبات العلوي -->
        <div style="display: flex; gap: 22px; padding: 8px 16px 12px 16px; overflow-x: auto; white-space: nowrap; scrollbar-width: none; direction: rtl;" id="ytTabsContainer">
            <div class="yt-top-tab active" style="color: #ffffff; font-size: 14px; font-weight: bold; position: relative; padding: 6px 10px; cursor: pointer;">
                الصفحة الرئيسية
                <div style="position: absolute; bottom: 0; right: 10px; left: 10px; height: 2px; background: #ff0000; border-radius: 2px;"></div>
            </div>
            <div class="yt-top-tab" style="color: #aaaaaa; font-size: 14px; font-weight: 500; padding: 6px 10px; cursor: pointer;">الاشتراكات</div>
            <div class="yt-top-tab" style="color: #aaaaaa; font-size: 14px; font-weight: 500; padding: 6px 10px; cursor: pointer;">موسيقى</div>
            <div class="yt-top-tab" style="color: #aaaaaa; font-size: 14px; font-weight: 500; padding: 6px 10px; cursor: pointer;">مباشر</div>
        </div>
    </div>

    <!-- 2. قائمة الفيديوهات (تجلب البيانات الحقيقية من السيرفر الآمن) -->
    <div id="videoFeedContainer" style="padding: 16px; display: flex; flex-direction: column; gap: 20px;">
        <div style="color: #aaa; text-align: center; padding: 40px 0;">جاري تحميل الفيديوهات الحقيقية...</div>
    </div>

    <!-- 3. الشريط السفلي الثابت -->
    <div style="position: fixed; bottom: 0; left: 0; width: 100%; height: 60px; background-color: #0f0f0f; border-top: 1px solid rgba(255,255,255,0.1); display: flex; justify-content: space-around; align-items: center; z-index: 999999;">
        <div style="cursor: pointer; color: #ffffff;"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg></div>
        <div style="cursor: pointer; color: #ffffff;"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M17.77 10.32l-1.2-.5L18 9.06c1.84-.96 2.53-3.23 1.56-5.06s-3.24-2.53-5.07-1.56L6 6.22C4.13 7.18 3.42 9.48 4.38 11.33c.53 1.02 1.45 1.7 2.53 1.94l1.2.5-1.43.76c-1.84.96-2.53 3.23-1.56 5.06 1 1.83 3.27 2.5 5.1 1.53l8.43-3.78c1.87-.96 2.58-3.26 1.62-5.11-.53-1.01-1.45-1.7-2.5-1.91zM10 14.5v-5l4.5 2.5L10 14.5z"/></svg></div>
        <div style="cursor: pointer; color: #ffffff;" onclick="openPlusMenu()"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="1.8"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg></div>
        <div style="cursor: pointer; color: #ffffff;"><div style="width: 26px; height: 26px; border-radius: 50%; overflow: hidden; border: 1.5px solid #ffffff;"><img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?q=80&w=100&auto=format&fit=crop" style="width: 100%; height: 100%; object-fit: cover;"></div></div>
    </div>

</div>

<!-- البرمجة والدوال التفاعلية -->
<script>
    let videosData = [];

    // دالة جلب الفيديوهات الحقيقية من مسار الفلاسك/فاست‌آبي الآمن
    async function fetchRealYouTubeVideos(query = 'football highlights') {
        const container = document.getElementById('videoFeedContainer');
        try {
            const response = await fetch(`/api/videos?query=${encodeURIComponent(query)}`);
            const data = await response.json();

            if (!data.items || data.items.length === 0) {
                container.innerHTML = `<div style="color: #aaa; text-align: center; padding: 40px 0; direction: rtl;">لا توجد نتائج مطابقة</div>`;
                return;
            }

            videosData = data.items.map(item => ({
                ytId: item.id.videoId,
                title: item.snippet.title,
                channel: item.snippet.channelTitle,
                thumbnail: item.snippet.thumbnails.high.url,
                duration: "10:00",
                views: "مشاهدة جديدة"
            }));

            renderVideos(videosData);
        } catch (error) {
            console.error('Error fetching videos:', error);
            container.innerHTML = `<div style="color: #f87171; text-align: center; padding: 40px 0; direction: rtl;">حدث خطأ أثناء جلب الفيديوهات</div>`;
        }
    }

    function renderVideos(list) {
        const container = document.getElementById('videoFeedContainer');
        container.innerHTML = '';

        if (list.length === 0) {
            container.innerHTML = `<div style="color: #aaa; text-align: center; padding: 40px 0; direction: rtl;">لا توجد نتائج مطابقة للبحث</div>`;
            return;
        }

        list.forEach(video => {
            const card = document.createElement('div');
            card.style.cssText = "background: #1f242d; border-radius: 16px; overflow: hidden; border: 1px solid rgba(255,255,255,0.08); cursor: pointer;";
            card.onclick = function() { playVideo(video); };
            card.innerHTML = `
                <div style="width: 100%; height: 190px; background: url('${video.thumbnail}') center/cover no-repeat; position: relative; display: flex; align-items: center; justify-content: center;">
                    <div style="width: 48px; height: 48px; background: rgba(255,0,0,0.9); border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 12px rgba(255,0,0,0.5);">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="#ffffff"><polygon points="8,5 19,12 8,19" /></svg>
                    </div>
                    <span style="position: absolute; bottom: 8px; left: 8px; background: rgba(0,0,0,0.85); color: #fff; font-size: 10px; font-weight: bold; padding: 2px 6px; border-radius: 4px;">${video.duration}</span>
                </div>
                <div style="padding: 12px; display: flex; gap: 12px; align-items: flex-start; direction: rtl;">
                    <div style="width: 40px; height: 40px; border-radius: 50%; background: #ff0000; display: flex; align-items: center; justify-content: center; color: #fff; font-weight: bold; flex-shrink: 0;">
                        ${video.channel.charAt(0)}
                    </div>
                    <div style="flex-grow: 1;">
                        <h3 style="color: #ffffff; font-size: 14px; font-weight: 700; margin-bottom: 4px; line-height: 1.4; text-align: right;">${video.title}</h3>
                        <p style="color: #aaa; font-size: 12px; text-align: right; margin: 0;">${video.channel} • ${video.views}</p>
                    </div>
                </div>
            `;
            container.appendChild(card);
        });
    }

    function playVideo(video) {
        const playerContainer = document.getElementById('activePlayerContainer');
        const iframePlayer = document.getElementById('mainYouTubeEmbed');
        const videoInfo = document.getElementById('activeVideoInfo');

        playerContainer.style.display = 'block';
        iframePlayer.src = `https://www.youtube.com/embed/${video.ytId}?autoplay=1`;
        videoInfo.innerHTML = `${video.title}<br><span style="color: #aaa; font-size: 11px;">${video.channel}</span>`;
        
        document.getElementById('toolsScreen').scrollTo({ top: 0, behavior: 'smooth' });
    }

    function closeActivePlayer() {
        const playerContainer = document.getElementById('activePlayerContainer');
        const iframePlayer = document.getElementById('mainYouTubeEmbed');
        iframePlayer.src = '';
        playerContainer.style.display = 'none';
    }

    function openSearchUI() {
        document.getElementById('mainHeaderView').style.display = 'none';
        const searchView = document.getElementById('searchHeaderView');
        searchView.style.display = 'flex';
        document.getElementById('searchInput').focus();
    }

    function closeSearchUI() {
        document.getElementById('mainHeaderView').style.display = 'flex';
        document.getElementById('searchHeaderView').style.display = 'none';
        document.getElementById('searchSuggestions').style.display = 'none';
        renderVideos(videosData);
    }

    function handleSearchInput(query) {
        const suggestionsBox = document.getElementById('searchSuggestions');
        if (!query.trim()) {
            suggestionsBox.style.display = 'none';
            renderVideos(videosData);
            return;
        }

        const filtered = videosData.filter(v => 
            v.title.toLowerCase().includes(query.toLowerCase()) || 
            v.channel.toLowerCase().includes(query.toLowerCase())
        );

        renderVideos(filtered);

        suggestionsBox.innerHTML = '';
        if (filtered.length > 0) {
            suggestionsBox.style.display = 'block';
            filtered.slice(0, 6).forEach(item => {
                const row = document.createElement('div');
                row.style.cssText = "padding: 10px 14px; color: #fff; font-size: 13px; cursor: pointer; border-bottom: 1px solid rgba(255,255,255,0.05);";
                row.innerText = `${item.title} (${item.channel})`;
                row.onclick = function() {
                    document.getElementById('searchInput').value = item.title;
                    suggestionsBox.style.display = 'none';
                    renderVideos([item]);
                };
                suggestionsBox.appendChild(row);
            });
        } else {
            suggestionsBox.style.display = 'none';
        }
    }

    // جلب الفيديوهات الحقيقية تلقائياً عند تحميل الصفحة
    fetchRealYouTubeVideos();
</script>
