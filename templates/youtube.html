<!-- شاشة اليوتيوب (youtube.html) -->
<div id="toolsScreen" class="screen-view" style="padding-bottom: 80px; background-color: #0f0f0f; position: relative; height: 100vh; overflow-y: scroll; -webkit-overflow-scrolling: touch;">

    <!-- 1. مشغل يوتيوب العلوي المباشر -->
    <div id="activePlayerContainer" style="display: none; width: 100%; background: #000; position: sticky; top: 0; z-index: 200; border-bottom: 1px solid rgba(255,255,255,0.1); transition: all 0.3s ease;">
        <div id="playerWrapper" style="position: relative; width: 100%; height: 215px; background: #000; transition: all 0.3s ease;">
            <iframe id="mainYouTubeEmbed" src="" style="width: 100%; height: 100%; border: none;" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
        </div>
        <div id="activeVideoInfo" style="padding: 10px 16px; color: #fff; font-size: 14px; font-weight: bold; border-bottom: 1px solid rgba(255,255,255,0.05); text-align: right;"></div>
    </div>

    <!-- الهيدر العلوي وشريط التصنيفات -->
    <div id="ytHeaderContainer" style="position: sticky; top: 0; z-index: 100; background-color: #0f0f0f; border-bottom: 1px solid rgba(255,255,255,0.08);">
        
        <div id="mainHeaderView" style="display: flex; justify-content: space-between; align-items: center; padding: 12px 16px;">
            <div style="display: flex; align-items: center; gap: 18px;">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="cursor: pointer;" onclick="openSearchUI()">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
                <div style="position: relative; cursor: pointer;">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                        <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
                    </svg>
                    <span style="position: absolute; top: -3px; right: -5px; background: #ff0000; color: #fff; font-size: 10px; padding: 1px 4px; border-radius: 10px; font-weight: bold;">9+</span>
                </div>
            </div>

            <!-- زر لوجو يوتيوب المتناسق -->
            <div style="display: flex; align-items: center; gap: 6px; cursor: pointer; padding: 4px 8px; border-radius: 8px; transition: background 0.2s;" onclick="resetToYouTubeHome()">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M22.54 6.42a2.78 2.78 0 0 0-1.94-2C18.88 4 12 4 12 4s-6.88 0-8.6.46a2.78 2.78 0 0 0-1.94 2A29 29 0 0 0 1 11.75a29 29 0 0 0 .46 5.33A2.78 2.78 0 0 0 3.4 19c1.72.46 8.6.46 8.6.46s6.88 0 8.6-.46a2.78 2.78 0 0 0 1.94-2 29 29 0 0 0 .46-5.25 29 29 0 0 0-.46-5.33z"></path>
                    <polygon points="9.75 15.02 15.5 11.75 9.75 8.48 9.75 15.02" fill="#ffffff"></polygon>
                </svg>
                <span style="color: #ffffff; font-weight: 600; font-size: 16px; font-family: Roboto, sans-serif; letter-spacing: -0.3px;">YouTube</span>
            </div>
        </div>

        <!-- شريط التصنيفات مع تصميم الخط الأحمر الثابت وتأثير النقر -->
        <style>
            .yt-chip {
                color: #fff;
                background: #272727;
                padding: 6px 14px;
                border-radius: 8px;
                font-size: 13px;
                font-weight: 500;
                cursor: pointer;
                position: relative;
                transition: background 0.2s ease;
                white-space: nowrap;
            }
            .yt-chip::after {
                content: '';
                position: absolute;
                bottom: -8px;
                left: 50%;
                transform: translateX(-50%);
                width: 0;
                height: 2px;
                background-color: #ff0000;
                transition: width 0.25s ease;
            }
            .yt-chip.active-chip::after {
                width: 70%;
            }
            .yt-chip.clicked-flash {
                background: #ffffff !important;
                color: #000000 !important;
            }
        </style>

        <div style="display: flex; gap: 10px; padding: 8px 16px; overflow-x: auto; scrollbar-width: none; direction: rtl; border-bottom: 1px solid rgba(255,255,255,0.05);">
            <div class="yt-chip active-chip" onclick="selectChip(this); resetToYouTubeHome();">الصفحة الرئيسية</div>
            <div class="yt-chip" onclick="selectChip(this); fetchYouTubeVideos('الاشتراكات يوتيوب', false);">الاشتراكات</div>
            <div class="yt-chip" onclick="selectChip(this); fetchYouTubeVideos('أغاني وموسيقى مشهورة', false);">موسيقى</div>
            <div class="yt-chip" onclick="selectChip(this); fetchYouTubeVideos('بث مباشر يوتيوب', false);">مباشر</div>
            <div class="yt-chip" onclick="selectChip(this); fetchYouTubeVideos('منوعات وبرامج متنوعة', false);">المزيد</div>
        </div>

        <!-- واجهة البحث التفاعلية -->
        <div id="searchHeaderView" style="display: none; padding: 10px 16px; background: #0f0f0f; align-items: center; gap: 12px; position: relative;">
            <input type="text" id="searchInput" placeholder="ابحث عن شخصية، برامج، أو فيديوهات..." style="width: 100%; background: #222222; border: 1px solid rgba(255,255,255,0.2); border-radius: 20px; padding: 8px 16px; color: #ffffff; font-size: 14px; outline: none; text-align: right;" onkeydown="if(event.key === 'Enter'){ performSearch(this.value); }">
            
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="cursor: pointer;" onclick="closeSearchUI()">
                <line x1="18" y1="6" x2="6" y2="18"></line>
                <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
        </div>
    </div>

    <!-- 2. قائمة الفيديوهات -->
    <div id="videoFeedContainer" style="display: flex; flex-direction: column; gap: 20px; padding: 0 0 40px 0; min-height: 100vh;"></div>

    <div id="loadingMoreIndicator" style="display: none; text-align: center; padding: 15px; color: #aaa; font-size: 13px;"></div>

    <!-- 3. شريط التنقل السفلي -->
    <div id="bottomNavBar" style="position: fixed; bottom: 0; left: 0; width: 100%; height: 60px; background: #121212; border-top: 1px solid rgba(255,255,255,0.1); display: flex; justify-content: space-around; align-items: center; z-index: 999; padding: 0 10px; transition: all 0.3s ease;">
        
        <div onclick="resetToYouTubeHome()" style="color: #fff; font-size: 11px; cursor: pointer; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 3px;">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        </div>

        <div onclick="fetchYouTubeVideos('فيديوهات ريلز وقنوات مشهورة', false)" style="color: #fff; font-size: 11px; cursor: pointer; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 3px;">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"/></svg>
        </div>

        <div style="cursor: pointer; display: flex; align-items: center; justify-content: center;">
            <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
        </div>

        <div style="width: 26px; height: 26px; border-radius: 50%; background: #333; display: flex; align-items: center; justify-content: center; overflow: hidden; cursor: pointer; border: 1.5px solid #fff;">
            <img src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=100" style="width: 100%; height: 100%; object-fit: cover;" alt="Profile">
        </div>

    </div>

</div>

<!-- البرمجة والدوال التفاعلية -->
<script>
    let globalVideosList = [];
    let seenVideoIds = new Set();
    let isVideoPlaying = false;
    let isMiniPlayer = false;
    let currentQuery = '';
    let nextPageToken = '';
    let isLoadingMore = false;

    const mixedKeywords = [
        'بودكاست عراقي مشهور', 
        'مشاهير العراق يوتيوب', 
        'برامج ولقاءات عربية', 
        'trending technology 2026', 
        'gaming highlights arab', 
        'documentaries arabic', 
        'vlogs عراقي'
    ];

    const fallbackKeywords = [
        'بودكاست عراقي مشهور',
        'برامج عربية مشهورة',
        'تكنولوجيا 2026'
    ];

    function getRandomMixedQuery() {
        return mixedKeywords[Math.floor(Math.random() * mixedKeywords.length)];
    }

    function getRandomFallbackQuery() {
        return fallbackKeywords[Math.floor(Math.random() * fallbackKeywords.length)];
    }

    function selectChip(element) {
        document.querySelectorAll('.yt-chip').forEach(chip => {
            chip.classList.remove('active-chip');
        });
        element.classList.add('active-chip');

        element.classList.add('clicked-flash');
        setTimeout(() => {
            element.classList.remove('clicked-flash');
        }, 300);
    }

    let touchStartX = 0;
    const edgeThreshold = 40; 
    const toolsScreen = document.getElementById('toolsScreen');

    toolsScreen.addEventListener('touchstart', function(e) {
        touchStartX = e.touches[0].clientX;
    }, {passive: true});

    toolsScreen.addEventListener('touchend', function(e) {
        let touchEndX = e.changedTouches[0].clientX;
        let diffX = touchEndX - touchStartX;

        let isFromLeftEdge = touchStartX <= edgeThreshold;
        let isFromRightEdge = touchStartX >= (window.innerWidth - edgeThreshold);

        if ((isFromLeftEdge || isFromRightEdge) && Math.abs(diffX) > 50) {
            handleEdgeSwipe();
        }
    }, {passive: true});

    // معالج التمرير التلقائي المحسّن لجلب المزيد من الفيديوهات بلا توقف
    toolsScreen.addEventListener('scroll', function() {
        if (toolsScreen.scrollTop + toolsScreen.clientHeight >= toolsScreen.scrollHeight - 300) {
            if (!isLoadingMore) {
                loadMoreVideos();
            }
        }
    });

    function handleEdgeSwipe() {
        if (isVideoPlaying) {
            if (!isMiniPlayer) {
                makeMiniPlayer();
            } else {
                exitToHomeApp();
            }
        } else {
            exitToHomeApp();
        }
    }

    function makeMiniPlayer() {
        isMiniPlayer = true;
        const container = document.getElementById('activePlayerContainer');
        const wrapper = document.getElementById('playerWrapper');
        const videoInfo = document.getElementById('activeVideoInfo');
        
        container.style.position = 'fixed';
        container.style.bottom = '70px';
        container.style.right = '16px';
        container.style.left = 'auto';
        container.style.top = 'auto';
        container.style.width = '280px';
        container.style.zIndex = '9999';
        container.style.borderRadius = '12px';
        container.style.overflow = 'hidden';
        container.style.boxShadow = '0 8px 24px rgba(0,0,0,0.8)';
        
        wrapper.style.height = '150px';
        if (videoInfo) videoInfo.style.display = 'none';

        document.getElementById('ytHeaderContainer').style.display = 'block';
        document.getElementById('bottomNavBar').style.display = 'flex';
    }

    function resetToYouTubeHome() {
        toolsScreen.scrollTo({ top: 0, behavior: 'smooth' });
        seenVideoIds.clear();
        nextPageToken = '';
        fetchYouTubeVideos(getRandomMixedQuery(), false);
    }

    async function fetchYouTubeVideos(query, isAppend = false, isRetryWithFallback = false) {
        if (!query) query = getRandomMixedQuery();
        currentQuery = query;

        if (!isAppend) {
            seenVideoIds.clear();
            globalVideosList = [];
            nextPageToken = '';
        }

        if (isLoadingMore) return;
        isLoadingMore = true;
        
        try {
            let url = `/api/videos?query=${encodeURIComponent(query)}`;
            if (isAppend && nextPageToken) {
                url += `&pageToken=${nextPageToken}`;
            }

            const response = await fetch(url);
            const data = await response.json();

            isLoadingMore = false;

            if (!data.items || data.items.length === 0) {
                if (!isAppend) {
                    if (!isRetryWithFallback) {
                        fetchYouTubeVideos(getRandomFallbackQuery(), false, true);
                        return;
                    }
                    loadCachedVideosOrEmpty();
                } else {
                    // إذا انتهت صفحات الـ API الحالية أثناء التمرير، ننتقل تلقائياً لكلمة عشوائية أخرى لجلب فيديوهات جديدة بلا توقف
                    nextPageToken = '';
                    fetchYouTubeVideos(getRandomMixedQuery(), true, true);
                }
                return;
            }

            nextPageToken = data.nextPageToken || '';

            const newVideos = data.items
                .filter(item => item.id && item.id.videoId && !seenVideoIds.has(item.id.videoId))
                .map(item => {
                    seenVideoIds.add(item.id.videoId);
                    return {
                        ytId: item.id.videoId,
                        title: item.snippet.title,
                        channel: item.snippet.channelTitle,
                        thumbnail: item.snippet.thumbnails.high ? item.snippet.thumbnails.high.url : item.snippet.thumbnails.default.url
                    };
                });

            if (newVideos.length === 0 && isAppend) {
                fetchYouTubeVideos(getRandomMixedQuery(), true, true);
                return;
            }

            if (newVideos.length === 0 && !isAppend && !isRetryWithFallback) {
                fetchYouTubeVideos(getRandomFallbackQuery(), false, true);
                return;
            }

            if (isAppend) {
                globalVideosList = [...globalVideosList, ...newVideos];
                appendVideos(newVideos);
            } else {
                globalVideosList = newVideos;
                saveVideosToCache(globalVideosList);
                renderVideos(globalVideosList);
            }

        } catch (error) {
            console.error('Error:', error);
            isLoadingMore = false;
            if (!isAppend) {
                loadCachedVideosOrEmpty();
            }
        }
    }

    function saveVideosToCache(videos) {
        try {
            if (videos && videos.length > 0) {
                localStorage.setItem('plotcraft_yt_cached_videos', JSON.stringify(videos));
            }
        } catch(e) {
            console.error('Cache Save Error:', e);
        }
    }

    function loadCachedVideosOrEmpty() {
        const container = document.getElementById('videoFeedContainer');
        try {
            const cachedData = localStorage.getItem('plotcraft_yt_cached_videos');
            if (cachedData) {
                const cachedVideos = JSON.parse(cachedData);
                if (cachedVideos && cachedVideos.length > 0) {
                    globalVideosList = cachedVideos;
                    renderVideos(cachedVideos);
                    return;
                }
            }
        } catch(e) {
            console.error('Cache Load Error:', e);
        }
    }

    function loadMoreVideos() {
        fetchYouTubeVideos(currentQuery, true);
    }

    function renderVideos(list) {
        const container = document.getElementById('videoFeedContainer');
        container.innerHTML = '';
        appendVideos(list);
    }

    function appendVideos(list) {
        const container = document.getElementById('videoFeedContainer');

        list.forEach(video => {
            const card = document.createElement('div');
            card.style.cssText = "background: #0f0f0f; width: 100%; cursor: pointer;";
            card.onclick = function() { playVideo(video); };
            card.innerHTML = `
                <div style="width: 100%; aspect-ratio: 16/9; background: url('${video.thumbnail}') center/cover no-repeat; position: relative;">
                </div>
                
                <div style="padding: 12px 14px; display: flex; gap: 12px; align-items: flex-start; direction: rtl;">
                    <div style="width: 36px; height: 36px; border-radius: 50%; background: #272727; display: flex; align-items: center; justify-content: center; color: #fff; font-weight: bold; flex-shrink: 0; overflow: hidden; font-size: 14px;">
                        ${video.channel.charAt(0)}
                    </div>
                    
                    <div style="flex-grow: 1;">
                        <h3 style="color: #ffffff; font-size: 14px; font-weight: 500; margin: 0 0 4px 0; line-height: 1.4; text-align: right; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;">${video.title}</h3>
                        <p style="color: #aaa; font-size: 12px; text-align: right; margin: 0;">${video.channel}</p>
                    </div>

                    <div style="color: #aaa; padding: 2px; cursor: pointer;">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg>
                    </div>
                </div>
            `;
            container.appendChild(card);
        });
    }

    function playVideo(video) {
        isVideoPlaying = true;
        isMiniPlayer = false;

        const playerContainer = document.getElementById('activePlayerContainer');
        const wrapper = document.getElementById('playerWrapper');
        const iframePlayer = document.getElementById('mainYouTubeEmbed');
        const videoInfo = document.getElementById('activeVideoInfo');

        playerContainer.style.position = 'sticky';
        playerContainer.style.top = '0';
        playerContainer.style.width = '100%';
        playerContainer.style.display = 'block';
        playerContainer.style.borderRadius = '0';
        wrapper.style.height = '215px';
        
        if (videoInfo) {
            videoInfo.style.display = 'block';
            videoInfo.innerHTML = `${video.title}<br><span style="color: #aaa; font-size: 11px;">${video.channel}</span>`;
        }

        document.getElementById('ytHeaderContainer').style.display = 'none';
        document.getElementById('bottomNavBar').style.display = 'none';

        iframePlayer.src = `https://www.youtube.com/embed/${video.ytId}?autoplay=1`;
        toolsScreen.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function exitToHomeApp() {
        isVideoPlaying = false;
        isMiniPlayer = false;
        const playerContainer = document.getElementById('activePlayerContainer');
        const iframePlayer = document.getElementById('mainYouTubeEmbed');
        iframePlayer.src = '';
        playerContainer.style.display = 'none';

        document.getElementById('ytHeaderContainer').style.display = 'block';
        document.getElementById('bottomNavBar').style.display = 'flex';

        if (typeof switchScreen === 'function') {
            switchScreen('home');
        }
    }

    function openSearchUI() {
        document.getElementById('mainHeaderView').style.display = 'none';
        document.getElementById('searchHeaderView').style.display = 'flex';
        document.getElementById('searchInput').focus();
    }

    function closeSearchUI() {
        document.getElementById('mainHeaderView').style.display = 'flex';
        document.getElementById('searchHeaderView').style.display = 'none';
        resetToYouTubeHome();
    }

    function performSearch(query) {
        if (!query.trim()) return;
        let enhancedQuery = query;
        if (query.includes('علي شاكر') || query.length < 10) {
            enhancedQuery = query + ' مقابلات برامج بودكاست';
        }
        fetchYouTubeVideos(enhancedQuery, false);
    }

    resetToYouTubeHome();
</script>
