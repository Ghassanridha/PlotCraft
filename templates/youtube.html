<!-- شاشة اليوتيوب والأدوات (تظهر فقط كقائمة كاملة عند الضغط على الزر الصغير) -->
<div id="toolsScreen" class="screen-view">
    
    <!-- الشريط العلوي للقائمة -->
    <div style="display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; background: #0f0f0f; border-bottom: 1px solid rgba(255,255,255,0.1);">
        <div style="display: flex; align-items: center; gap: 8px;">
            <svg width="24" height="20" viewBox="0 0 24 24">
                <rect x="2" y="4" width="20" height="16" rx="4" fill="#FF0000"/>
                <polygon points="10,8 16,12 10,16" fill="#FFFFFF"/>
            </svg>
            <span style="color: #ffffff; font-weight: bold; font-size: 16px;">YouTube</span>
        </div>
        <div style="color: #ffffff; font-size: 13px; font-weight: 600;">قائمة الأدوات</div>
    </div>

    <!-- أقسام وتصنيفات القائمة -->
    <div style="display: flex; gap: 8px; padding: 10px 16px; overflow-x: auto; background: #0f0f0f;">
        <div style="background: #ffffff; color: #000; padding: 6px 14px; border-radius: 8px; font-size: 12px; font-weight: bold;">الكل</div>
        <div style="background: rgba(255,255,255,0.1); color: #fff; padding: 6px 14px; border-radius: 8px; font-size: 12px;">الموسيقى</div>
        <div style="background: rgba(255,255,255,0.1); color: #fff; padding: 6px 14px; border-radius: 8px; font-size: 12px;">الألعاب</div>
        <div style="background: rgba(255,255,255,0.1); color: #fff; padding: 6px 14px; border-radius: 8px; font-size: 12px;">مباشر</div>
    </div>

    <!-- محتوى قائمة الفيديوهات المفرغة (Skeleton) -->
    <div style="padding: 16px; display: flex; flex-direction: column; gap: 16px;">
        
        <!-- عنصر 1 في القائمة -->
        <div style="background: #282f3d; border-radius: 14px; overflow: hidden; border: 1px solid rgba(255,255,255,0.05);">
            <div style="width: 100%; height: 160px; background: #343d50; position: relative;">
                <span style="position: absolute; bottom: 8px; left: 8px; background: rgba(0,0,0,0.8); color: #fff; font-size: 10px; padding: 2px 6px; border-radius: 4px;">10:25</span>
            </div>
            <div style="padding: 12px; display: flex; gap: 10px;">
                <div style="width: 36px; height: 36px; border-radius: 50%; background: #343d50; flex-shrink: 0;"></div>
                <div style="flex-grow: 1;">
                    <div style="height: 12px; background: #343d50; border-radius: 4px; margin-bottom: 6px; width: 85%;"></div>
                    <div style="height: 10px; background: #343d50; border-radius: 4px; width: 50%;"></div>
                </div>
            </div>
        </div>

        <!-- عنصر 2 في القائمة -->
        <div style="background: #282f3d; border-radius: 14px; overflow: hidden; border: 1px solid rgba(255,255,255,0.05);">
            <div style="width: 100%; height: 160px; background: #343d50; position: relative;">
                <span style="position: absolute; bottom: 8px; left: 8px; background: rgba(0,0,0,0.8); color: #fff; font-size: 10px; padding: 2px 6px; border-radius: 4px;">04:12</span>
            </div>
            <div style="padding: 12px; display: flex; gap: 10px;">
                <div style="width: 36px; height: 36px; border-radius: 50%; background: #343d50; flex-shrink: 0;"></div>
                <div style="flex-grow: 1;">
                    <div style="height: 12px; background: #343d50; border-radius: 4px; margin-bottom: 6px; width: 70%;"></div>
                    <div style="height: 10px; background: #343d50; border-radius: 4px; width: 40%;"></div>
                </div>
            </div>
        </div>

    </div>

</div>
