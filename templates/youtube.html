<!-- شاشة اليوتيوب (youtube.html) -->
<div id="toolsScreen" class="screen-view" style="padding-bottom: 70px; background-color: #0f0f0f; position: relative; height: 100vh; overflow-y: auto;">

    <!-- 1. مشغل يوتيوب العلوي المباشر (أو المصغر لاحقاً) -->
    <div id="activePlayerContainer" style="display: none; width: 100%; background: #000; position: sticky; top: 0; z-index: 200; border-bottom: 1px solid rgba(255,255,255,0.1); transition: all 0.3s ease;">
        <div id="playerWrapper" style="position: relative; width: 100%; height: 215px; background: #000; transition: all 0.3s ease;">
            <iframe id="mainYouTubeEmbed" src="" style="width: 100%; height: 100%; border: none;" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
        </div>
        <div id="activeVideoInfo" style="padding: 10px 16px; color: #fff; font-size: 14px; font-weight: bold; border-bottom: 1px solid rgba(255,255,255,0.05); text-align: right;"></div>
    </div>

    <!-- الهيدر العلوي وشريط التصنيفات (مطابق للصورة تماماً) -->
    <div id="ytHeaderContainer" style="position: sticky; top: 0; z-index: 100; background-color: #0f0f0f; border-bottom: 1px solid rgba(255,255,255,0.08);">
        
        <!-- صف اللوجو وأيقونات البحث والإشعارات -->
        <div id="mainHeaderView" style="display: flex; justify-content: space-between; align-items: center; padding: 12px 16px;">
            <div style="display: flex; align-items: center; gap: 18px;">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="cursor: pointer;" onclick="openSearchUI()">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
                <!-- أيقونة الإشعارات مع نقطة التنبيه -->
                <div style="position: relative; cursor: pointer;">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                        <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
                    </svg>
                    <span style="position: absolute; top: -3px; right: -5px; background: #ff0000; color: #fff; font-size: 10px; padding: 1px 4px; border-radius: 10px; font-weight: bold;">9+</span>
                </div>
            </div>

            <!-- لوجو يوتيوب -->
            <div style="display: flex; align-items: center; gap: 5px; cursor: pointer;">
                <span style="color: #ffffff; font-weight: bold; font-size: 18px; font-family: Roboto, sans-serif;">YouTube</span>
                <svg width="28" height="20" viewBox="0 0 24 24" fill="none">
                    <rect x="2" y="4" width="20" height="16" rx="4" fill="#FF0000" />
                    <polygon points="10,8 16,12 10,16" fill="#FFFFFF" />
                </svg>
            </div>
        </div>

        <!-- شريط التصنيفات (الصفحة الرئيسية، الاشتراكات، موسيقى، مباشر، المزيد)[span_2](start_span)[span_2](end_span) -->
        <div style="display: flex; gap: 10px; padding: 8px 16px; overflow-x: auto; white-space: nowrap; scrollbar-width: none; direction: rtl; border-bottom: 1px solid rgba(255,255,255,0.05);">
            <div onclick="fetchYouTubeVideos('football highlights')" style="color: #fff; background: #272727; padding: 6px 14px; border-radius: 8px; font-size: 13px; font-weight: 500; cursor: pointer;">الصفحة الرئيسية</div>
            <div onclick="fetchYouTubeVideos('subscriptions')" style="color: #fff; background: #272727; padding: 6px 14px; border-radius: 8px; font-size: 13px; font-weight: 500; cursor: pointer;">الاشتراكات</div>
            <div onclick="fetchYouTubeVideos('music')" style="color: #fff; background: #272727; padding: 6px 14px; border-radius: 8px; font-size: 13px; font-weight: 500; cursor: pointer;">موسيقى</div>
            <div onclick="fetchYouTubeVideos('live stream')" style="color: #fff; background: #272727; padding: 6px 14px; border-radius: 8px; font-size: 13px; font-weight: 500; cursor: pointer;">مباشر</div>
            <div onclick="fetchYouTubeVideos('trending')" style="color: #fff; background: #272727; padding: 6px 14px; border-radius: 8px; font-size: 13px; font-weight: 500; cursor: pointer;">المزيد</div>
        </div>

        <!-- واجهة البحث التفاعلية -->
        <div id="searchHeaderView" style="display: none; padding: 10px 16px; background: #0f0f0f; align-items: center; gap: 12px; position: relative;">
            <input type="text" id="searchInput" placeholder="ابحث في الفيديوهات..." style="width: 100%; background: #222222; border: 1px solid rgba(255,255,255,0.2); border-radius: 20px; padding: 8px 16px; color: #ffffff; font-size: 14px; outline: none; text-align: right;" onkeydown="if(event.key === 'Enter'){ performSearch(this.value); }">
            
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="cursor: pointer;" onclick="closeSearchUI()">
                <line x1="18" y1="6" x2="6" y2="18"></line>
                <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
        </div>
    </div>

    <!-- 2. قائمة الفيديوهات بالتصميم وحجم العرض المطابق للصورة (Full-Width) -->
    <div id="videoFeedContainer" style="display: flex; flex-direction: column; gap: 20px; padding: 0;">
        <div style="color: #aaa; text-align: center; padding: 40px 0;">جاري تحميل الفيديوهات...</div>
    </div>

    <!-- 3. شريط التنقل السفلي الثابت -->
    <div style="position: fixed; bottom: 0; left: 0; width: 100%; height: 60px; background: #121212; border-top: 1px solid rgba(255,255,255,0.1); display: flex; justify-content: space-around; align-items: center; z-index: 999;">
        <div onclick="exitToHome()" style="color: #aaa; font-size: 13px; cursor: pointer; text-align: center;">الرئيسية</div>
        <div style="color: #ff0000; font-size: 13px; cursor: pointer; text-align: center; font-weight: bold;">يوتيوب</div>
    </div>

</div>

<!-- البرمجة والدوال التفاعلية -->
<script>
    let globalVideosList = [];
    let isVideoPlaying = false;
    let isMiniPlayer = false;

    // إيماءات السحب من الأطراف فقط (Edge Swipe)
    let touchStartX = 0;
    const edgeThreshold = 40; 

    const toolsScreen = document.getElementById('toolsScreen');

    toolsScreen.addEventListener('touchstart', function(e) {
        touchStartX = e.touches[0].clientX;
    }, {passive: true});

    toolsScreen.addEventListener('touchend', function(e) {
        let touchEndX = e.changedTouches[0].clientX;
        let diffX = touchEndX - touchStartX;

        let isFromLeftEdge = touchStartX <= edgeThreshold;
        let isFromRightEdge = touchStartX >= (window.innerWidth - edgeThreshold);

        if ((isFromLeftEdge || isFromRightEdge) && Math.abs(diffX) > 50) {
            handleEdgeSwipe();
        }
    }, {passive: true});

    function handleEdgeSwipe() {
        if (isVideoPlaying) {
            if (!isMiniPlayer) {
                makeMiniPlayer();
            } else {
                exitToHome();
            }
        } else {
            exitToHome();
        }
    }

    function makeMiniPlayer() {
        isMiniPlayer = true;
        const container = document.getElementById('activePlayerContainer');
        const wrapper = document.getElementById('playerWrapper');
        const videoInfo = document.getElementById('activeVideoInfo');
        
        container.style.position = 'fixed';
        container.style.bottom = '70px';
        container.style.right = '16px';
        container.style.left = 'auto';
        container.style.top = 'auto';
        container.style.width = '280px';
        container.style.zIndex = '9999';
        container.style.borderRadius = '12px';
        container.style.overflow = 'hidden';
        container.style.boxShadow = '0 8px 24px rgba(0,0,0,0.8)';
        
        wrapper.style.height = '150px';
        if (videoInfo) videoInfo.style.display = 'none';
    }

    async function fetchYouTubeVideos(query = 'football highlights') {
        const container = document.getElementById('videoFeedContainer');
        container.innerHTML = `<div style="color: #aaa; text-align: center; padding: 40px 0;">جاري البحث...</div>`;
        
        try {
            const response = await fetch(`/api/videos?query=${encodeURIComponent(query)}`);
            const data = await response.json();

            if (!data.items || data.items.length === 0) {
                container.innerHTML = `<div style="color: #aaa; text-align: center; padding: 40px 0; direction: rtl;">لا توجد نتائج مطابقة</div>`;
                return;
            }

            globalVideosList = data.items.map(item => ({
                ytId: item.id.videoId,
                title: item.snippet.title,
                channel: item.snippet.channelTitle,
                thumbnail: item.snippet.thumbnails.high ? item.snippet.thumbnails.high.url : item.snippet.thumbnails.default.url
            }));

            renderVideos(globalVideosList);
        } catch (error) {
            console.error('Error:', error);
            container.innerHTML = `<div style="color: #f87171; text-align: center; padding: 40px 0; direction: rtl;">حدث خطأ أثناء جلب الفيديوهات</div>`;
        }
    }

    function renderVideos(list) {
        const container = document.getElementById('videoFeedContainer');
        container.innerHTML = '';

        list.forEach(video => {
            const card = document.createElement('div');
            // إزالة الحواف والحواف الدائرية لجعل الفيديو يأخذ عرض الشاشة بالكامل وبنسبة 16:9 كما في الصورة[span_3](start_span)[span_3](end_span)
            card.style.cssText = "background: #0f0f0f; width: 100%; cursor: pointer;";
            card.onclick = function() { playVideo(video); };
            card.innerHTML = `
                <!-- صورة الفيديو بحجم كامل 16:9 مطابق للصورة -->
                <div style="width: 100%; aspect-ratio: 16/9; background: url('${video.thumbnail}') center/cover no-repeat; position: relative;">
                </div>
                
                <!-- تفاصيل الفيديو (العنوان، الأيقونة، أزرار الخيارات) بنفس التنسيق بالصورة[span_4](start_span)[span_4](end_span) -->
                <div style="padding: 12px 14px; display: flex; gap: 12px; align-items: flex-start; direction: rtl;">
                    <!-- الأيقونة الدائرية للقناة -->
                    <div style="width: 36px; height: 36px; border-radius: 50%; background: #272727; display: flex; align-items: center; justify-content: center; color: #fff; font-weight: bold; flex-shrink: 0; overflow: hidden; font-size: 14px;">
                        ${video.channel.charAt(0)}
                    </div>
                    
                    <!-- عنوان الفيديو واسم القناة -->
                    <div style="flex-grow: 1;">
                        <h3 style="color: #ffffff; font-size: 14px; font-weight: 500; margin: 0 0 4px 0; line-height: 1.4; text-align: right; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;">${video.title}</h3>
                        <p style="color: #aaa; font-size: 12px; text-align: right; margin: 0;">${video.channel}</p>
                    </div>

                    <!-- زر الثلاث نقاط للخيارات -->
                    <div style="color: #aaa; padding: 2px; cursor: pointer;">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg>
                    </div>
                </div>
            `;
            container.appendChild(card);
        });
    }

    function playVideo(video) {
        isVideoPlaying = true;
        isMiniPlayer = false;

        const playerContainer = document.getElementById('activePlayerContainer');
        const wrapper = document.getElementById('playerWrapper');
        const iframePlayer = document.getElementById('mainYouTubeEmbed');
        const videoInfo = document.getElementById('activeVideoInfo');

        playerContainer.style.position = 'sticky';
        playerContainer.style.top = '0';
        playerContainer.style.width = '100%';
        playerContainer.style.display = 'block';
        playerContainer.style.borderRadius = '0';
        wrapper.style.height = '215px';
        
        if (videoInfo) {
            videoInfo.style.display = 'block';
            videoInfo.innerHTML = `${video.title}<br><span style="color: #aaa; font-size: 11px;">${video.channel}</span>`;
        }

        iframePlayer.src = `https://www.youtube.com/embed/${video.ytId}?autoplay=1`;
        document.getElementById('toolsScreen').scrollTo({ top: 0, behavior: 'smooth' });
    }

    function exitToHome() {
        isVideoPlaying = false;
        isMiniPlayer = false;
        const playerContainer = document.getElementById('activePlayerContainer');
        const iframePlayer = document.getElementById('mainYouTubeEmbed');
        iframePlayer.src = '';
        playerContainer.style.display = 'none';

        if (typeof switchScreen === 'function') {
            switchScreen('home');
        }
    }

    function openSearchUI() {
        document.getElementById('mainHeaderView').style.display = 'none';
        document.getElementById('searchHeaderView').style.display = 'flex';
        document.getElementById('searchInput').focus();
    }

    function closeSearchUI() {
        document.getElementById('mainHeaderView').style.display = 'flex';
        document.getElementById('searchHeaderView').style.display = 'none';
        fetchYouTubeVideos('football highlights');
    }

    function performSearch(query) {
        if (!query.trim()) return;
        fetchYouTubeVideos(query);
    }

    // جلب الفيديوهات تلقائياً عند فتح الصفحة
    fetchYouTubeVideos('football highlights');
</script>
