<!-- شاشة اليوتيوب (youtube.html) -->
<div id="toolsScreen" class="screen-view" style="padding-bottom: 70px; background-color: #0f0f0f; position: relative; height: 100vh; overflow-y: auto; -webkit-overflow-scrolling: touch;">

    <!-- استدعاء مكتبة تسجيل الدخول الرسمية من جوجل -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <!-- 1. مشغل يوتيوب العلوي المباشر -->
    <div id="activePlayerContainer" style="display: none; width: 100%; background: #000; position: sticky; top: 0; z-index: 200; border-bottom: 1px solid rgba(255,255,255,0.1); transition: all 0.3s ease;">
        
        <!-- زر سحب صغير وواضح لتصغير الفيديو بدون تداخل -->
        <div id="playerDragBar" style="width: 100%; height: 18px; background: #1a1a1a; display: flex; align-items: center; justify-content: center; cursor: pointer;" onclick="makeMiniPlayer()" title="تصغير الفيديو">
            <div style="width: 32px; height: 4px; background: rgba(255,255,255,0.4); border-radius: 2px;"></div>
        </div>

        <div id="playerWrapper" style="position: relative; width: 100%; height: 200px; background: #000;">
            <iframe id="mainYouTubeEmbed" src="" style="width: 100%; height: 100%; border: none;" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
        </div>
        <div id="activeVideoInfo" style="padding: 10px 16px; color: #fff; font-size: 14px; font-weight: bold; border-bottom: 1px solid rgba(255,255,255,0.05); text-align: right; background: #111;"></div>
    </div>

    <!-- الهيدر العلوي وشريط التصنيفات (للصفحة الرئيسية) -->
    <div id="ytHeaderContainer" style="position: sticky; top: 0; z-index: 100; background-color: #0f0f0f; border-bottom: 1px solid rgba(255,255,255,0.08);">
        
        <div id="mainHeaderView" style="display: flex; justify-content: space-between; align-items: center; padding: 12px 16px;">
            <div style="display: flex; align-items: center; gap: 18px;">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="cursor: pointer;" onclick="openSearchUI()">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
                <div style="position: relative; cursor: pointer;">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                        <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
                    </svg>
                </div>
            </div>

            <div style="display: flex; align-items: center; gap: 5px; cursor: pointer;" onclick="resetToYouTubeHome()">
                <span style="color: #ffffff; font-weight: bold; font-size: 18px; font-family: Roboto, sans-serif;">YouTube</span>
                <svg width="28" height="20" viewBox="0 0 24 24" fill="none">
                    <rect x="2" y="4" width="20" height="16" rx="4" fill="#FF0000" />
                    <polygon points="10,8 16,12 10,16" fill="#FFFFFF" />
                </svg>
            </div>
        </div>

        <style>
            .yt-chip {
                color: #fff;
                background: #272727;
                padding: 6px 14px;
                border-radius: 8px;
                font-size: 13px;
                font-weight: 500;
                cursor: pointer;
                position: relative;
                transition: background 0.2s ease;
                white-space: nowrap;
            }
            .yt-chip::after {
                content: '';
                position: absolute;
                bottom: -8px;
                left: 50%;
                transform: translateX(-50%);
                width: 0;
                height: 2px;
                background-color: #ff0000;
                transition: width 0.25s ease;
            }
            .yt-chip.active-chip::after {
                width: 70%;
            }
            .yt-chip.clicked-flash {
                background: #ffffff !important;
                color: #000000 !important;
            }
            .no-scrollbar::-webkit-scrollbar { display: none; }
            .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        </style>

        <div style="display: flex; gap: 10px; padding: 8px 16px; overflow-x: auto; scrollbar-width: none; direction: rtl; border-bottom: 1px solid rgba(255,255,255,0.05);">
            <div class="yt-chip active-chip" onclick="selectChip(this); resetToYouTubeHome();">الصفحة الرئيسية</div>
            <div class="yt-chip" onclick="selectChip(this); fetchYouTubeVideos('الاشتراكات يوتيوب', false);">الاشتراكات</div>
            <div class="yt-chip" onclick="selectChip(this); fetchYouTubeVideos('أغاني وموسيقى مشهورة', false);">موسيقى</div>
            <div class="yt-chip" onclick="selectChip(this); fetchYouTubeVideos('بث مباشر يوتيوب', false);">مباشر</div>
            <div class="yt-chip" onclick="selectChip(this); fetchYouTubeVideos('منوعات وبرامج متنوعة', false);">المزيد</div>
        </div>

        <!-- واجهة البحث التفاعلية -->
        <div id="searchHeaderView" style="display: none; padding: 10px 16px; background: #0f0f0f; align-items: center; gap: 12px; position: relative;">
            <input type="text" id="searchInput" placeholder="ابحث عن فيديوهات..." style="width: 100%; background: #222222; border: 1px solid rgba(255,255,255,0.2); border-radius: 20px; padding: 8px 16px; color: #ffffff; font-size: 14px; outline: none; text-align: right;" onkeydown="if(event.key === 'Enter'){ performSearch(this.value); }">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="cursor: pointer;" onclick="closeSearchUI()">
                <line x1="18" y1="6" x2="6" y2="18"></line>
                <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
        </div>
    </div>

    <!-- 2. قائمة الفيديوهات الرئيسية -->
    <div id="videoFeedContainer" style="display: flex; flex-direction: column; gap: 20px; padding: 0 0 40px 0; min-height: 100vh;"></div>

    <div id="loadingMoreIndicator" style="display: none; text-align: center; padding: 15px; color: #aaa; font-size: 13px;"></div>

    <!-- 3. واجهة الملف الشخصي -->
    <div id="profilePageScreen" class="no-scrollbar" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100vh; background-color: #0f0f0f; z-index: 99999; padding: 16px 16px 80px 16px; box-sizing: border-box; overflow-y: auto;">
        <div id="unauthState" style="width: 100%; max-width: 320px; margin: 80px auto 0 auto; text-align: center;">
            <div style="display: flex; justify-content: flex-end; width: 100%; position: absolute; top: 16px; left: 16px;">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="cursor: pointer;" onclick="closeProfileScreen()">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </div>
            <h3 style="color: #fff; font-size: 18px; margin-bottom: 8px;">تسجيل الدخول</h3>
            <div style="background: #1a1a1a; border: 1px solid rgba(255,255,255,0.12); border-radius: 12px; padding: 14px; display: flex; justify-content: center; align-items: center;">
                <div id="g_id_onload" data-client_id="962930295593-gnl6t3hg9tf3fvurilv6den0dg1tjubh.apps.googleusercontent.com" data-callback="handleGoogleSignIn" data-auto_prompt="false"></div>
                <div class="g_id_signin" data-type="standard" data-shape="rectangular" data-theme="dark" data-size="large" data-text="signin_with" data-logo_alignment="left"></div>
            </div>
        </div>

        <div id="authState" style="display: none; width: 100%;">
            <div style="display: flex; justify-content: space-between; align-items: center; padding-bottom: 16px; border-bottom: 1px solid rgba(255,255,255,0.05); direction: ltr;">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="cursor: pointer;" onclick="googleSignOut()" title="تسجيل الخروج">
                    <circle cx="12" cy="12" r="3"></circle>
                    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06-.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                </svg>
            </div>
            <div style="display: flex; align-items: center; gap: 16px; padding: 20px 0; direction: rtl;">
                <img id="loggedInUserImg" src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=100" style="width: 70px; height: 70px; border-radius: 50%; object-fit: cover;">
                <div style="text-align: right;">
                    <h2 id="loggedInUserName" style="color: #fff; font-size: 19px; margin: 0 0 4px 0;">اسم المستخدم</h2>
                    <p id="loggedInUserHandle" style="color: #aaa; font-size: 13px; margin: 0;">@user</p>
                </div>
            </div>
            <div style="margin-bottom: 28px; direction: rtl;">
                <h3 style="color: #fff; font-size: 18px; margin-bottom: 12px;">السجلّ</h3>
                <div id="historyFeedContainer" class="no-scrollbar" style="display: flex; gap: 12px; overflow-x: auto; padding-bottom: 8px;"></div>
            </div>
        </div>
    </div>

    <!-- نافذة الحسابات -->
    <div id="accountsModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 1000000; align-items: center; justify-content: center; padding: 20px;">
        <div style="background: #1f242d; border-radius: 20px; width: 100%; max-width: 400px; padding: 24px; direction: rtl;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                <h3 style="color: #fff; font-size: 18px; margin: 0;">الحسابات</h3>
                <span onclick="closeAccountsModal()" style="color: #fff; cursor: pointer; font-weight: bold;">✕</span>
            </div>
            <div id="accountsListContainer" style="display: flex; flex-direction: column; gap: 10px; max-height: 250px; overflow-y: auto;"></div>
        </div>
    </div>

    <!-- 4. شريط التنقل السفلي -->
    <div id="bottomNavBar" style="position: fixed; bottom: 0; left: 0; width: 100%; height: 60px; background: #0f0f0f; border-top: 1px solid rgba(255,255,255,0.1); display: flex; justify-content: space-around; align-items: center; z-index: 999999; padding: 0 10px;">
        <div onclick="closeProfileScreen(); resetToYouTubeHome();" style="color: #fff; font-size: 11px; cursor: pointer; text-align: center;">الرئيسية</div>
        <div onclick="openProfileScreen()" style="width: 26px; height: 26px; border-radius: 50%; background: #333; overflow: hidden; cursor: pointer; border: 1.5px solid #fff;">
            <img id="userProfileImg" src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=100" style="width: 100%; height: 100%; object-fit: cover;">
        </div>
    </div>

</div>

<!-- البرمجة والدوال الأساسية -->
<script>
    let globalVideosList = [];
    let seenVideoIds = new Set();
    let userHistoryVideos = [];
    let isVideoPlaying = false;
    let isMiniPlayer = false;
    let currentQuery = '';
    let nextPageToken = '';
    let isLoadingMore = false;

    const keywords = ['بودكاست عراقي مشهور', 'أغاني وموسيقى', 'برامج ترفيهية', 'تكنولوجيا وتقنية'];

    function selectChip(element) {
        document.querySelectorAll('.yt-chip').forEach(chip => chip.classList.remove('active-chip'));
        element.classList.add('active-chip');
    }

    function openProfileScreen() { document.getElementById('profilePageScreen').style.display = 'block'; }
    function closeProfileScreen() { document.getElementById('profilePageScreen').style.display = 'none'; }

    window.addEventListener('load', function() {
        loadHistoryFromStorage();
        resetToYouTubeHome();
    });

    function makeMiniPlayer() {
        isMiniPlayer = true;
        const container = document.getElementById('activePlayerContainer');
        const wrapper = document.getElementById('playerWrapper');
        const videoInfo = document.getElementById('activeVideoInfo');
        const dragBar = document.getElementById('playerDragBar');
        
        container.style.position = 'fixed';
        container.style.bottom = '70px';
        container.style.right = '16px';
        container.style.left = 'auto';
        container.style.top = 'auto';
        container.style.width = '220px';
        container.style.zIndex = '999999';
        container.style.borderRadius = '10px';
        container.style.overflow = 'hidden';
        container.style.boxShadow = '0 8px 24px rgba(0,0,0,0.9)';
        
        wrapper.style.height = '124px';
        if (videoInfo) videoInfo.style.display = 'none';
        if (dragBar) dragBar.style.display = 'none';

        // النقر على المشغل المصغر لتكبيره
        container.onclick = function() { expandPlayer(); };
    }

    function expandPlayer() {
        isMiniPlayer = false;
        const container = document.getElementById('activePlayerContainer');
        const wrapper = document.getElementById('playerWrapper');
        const videoInfo = document.getElementById('activeVideoInfo');
        const dragBar = document.getElementById('playerDragBar');

        container.style.position = 'sticky';
        container.style.top = '0';
        container.style.right = 'auto';
        container.style.bottom = 'auto';
        container.style.width = '100%';
        container.style.borderRadius = '0';
        container.style.boxShadow = 'none';
        container.onclick = null;

        wrapper.style.height = '200px';
        if (videoInfo) videoInfo.style.display = 'block';
        if (dragBar) dragBar.style.display = 'flex';
    }

    function resetToYouTubeHome() {
        document.getElementById('toolsScreen').scrollTo({ top: 0, behavior: 'smooth' });
        seenVideoIds.clear();
        nextPageToken = '';
        fetchYouTubeVideos(keywords[Math.floor(Math.random() * keywords.length)], false);
    }

    async function fetchYouTubeVideos(query, isAppend = false) {
        if (!query) query = keywords[0];
        currentQuery = query;

        if (!isAppend) {
            seenVideoIds.clear();
            globalVideosList = [];
            nextPageToken = '';
        }

        if (isLoadingMore) return;
        isLoadingMore = true;

        try {
            let url = `/api/videos?query=${encodeURIComponent(query)}`;
            if (isAppend && nextPageToken) url += `&pageToken=${nextPageToken}`;

            const response = await fetch(url);
            const data = await response.json();
            isLoadingMore = false;

            if (!data.items || data.items.length === 0) return;

            nextPageToken = data.nextPageToken || '';

            const newVideos = data.items
                .filter(item => item.id && item.id.videoId && !seenVideoIds.has(item.id.videoId))
                .map(item => {
                    seenVideoIds.add(item.id.videoId);
                    return {
                        ytId: item.id.videoId,
                        title: item.snippet.title,
                        channel: item.snippet.channelTitle,
                        thumbnail: item.snippet.thumbnails.high ? item.snippet.thumbnails.high.url : item.snippet.thumbnails.default.url
                    };
                });

            if (isAppend) {
                globalVideosList = [...globalVideosList, ...newVideos];
                appendVideos(newVideos);
            } else {
                globalVideosList = newVideos;
                renderVideos(globalVideosList);
            }
        } catch (error) {
            isLoadingMore = false;
            console.error('Error fetching videos:', error);
        }
    }

    function renderVideos(list) {
        const container = document.getElementById('videoFeedContainer');
        container.innerHTML = '';
        appendVideos(list);
    }

    function appendVideos(list) {
        const container = document.getElementById('videoFeedContainer');
        list.forEach(video => {
            const card = document.createElement('div');
            card.style.cssText = "background: #0f0f0f; width: 100%; cursor: pointer;";
            card.onclick = () => playVideo(video);
            card.innerHTML = `
                <div style="width: 100%; aspect-ratio: 16/9; background: url('${video.thumbnail}') center/cover no-repeat;"></div>
                <div style="padding: 12px 14px; display: flex; gap: 12px; align-items: flex-start; direction: rtl;">
                    <div style="width: 36px; height: 36px; border-radius: 50%; background: #272727; display: flex; align-items: center; justify-content: center; color: #fff; font-weight: bold; flex-shrink: 0;">${video.channel.charAt(0)}</div>
                    <div style="flex-grow: 1;">
                        <h3 style="color: #ffffff; font-size: 14px; font-weight: 500; margin: 0 0 4px 0; line-height: 1.4; text-align: right; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;">${video.title}</h3>
                        <p style="color: #aaa; font-size: 12px; text-align: right; margin: 0;">${video.channel}</p>
                    </div>
                </div>
            `;
            container.appendChild(card);
        });
    }

    function playVideo(video) {
        isVideoPlaying = true;
        isMiniPlayer = false;
        addToHistory(video);

        const playerContainer = document.getElementById('activePlayerContainer');
        const wrapper = document.getElementById('playerWrapper');
        const iframePlayer = document.getElementById('mainYouTubeEmbed');
        const videoInfo = document.getElementById('activeVideoInfo');
        const dragBar = document.getElementById('playerDragBar');

        playerContainer.style.position = 'sticky';
        playerContainer.style.top = '0';
        playerContainer.style.right = 'auto';
        playerContainer.style.bottom = 'auto';
        playerContainer.style.width = '100%';
        playerContainer.style.display = 'block';
        playerContainer.style.borderRadius = '0';
        playerContainer.style.boxShadow = 'none';
        
        wrapper.style.height = '200px';
        if (videoInfo) videoInfo.style.display = 'block';
        if (dragBar) dragBar.style.display = 'flex';

        iframePlayer.src = `https://www.youtube.com/embed/${video.ytId}?autoplay=1&modestbranding=1&rel=0&controls=1`;
        document.getElementById('toolsScreen').scrollTo({ top: 0, behavior: 'smooth' });
    }

    function addToHistory(video) {
        userHistoryVideos = userHistoryVideos.filter(v => v.ytId !== video.ytId);
        userHistoryVideos.unshift(video);
        localStorage.setItem('plotcraft_yt_history', JSON.stringify(userHistoryVideos));
        renderHistoryUI();
    }

    function loadHistoryFromStorage() {
        try {
            const savedHistory = localStorage.getItem('plotcraft_yt_history');
            if (savedHistory) userHistoryVideos = JSON.parse(savedHistory);
        } catch(e) {}
        renderHistoryUI();
    }

    function renderHistoryUI() {
        const container = document.getElementById('historyFeedContainer');
        if (!container) return;
        container.innerHTML = '';
        userHistoryVideos.forEach(video => {
            const card = document.createElement('div');
            card.style.cssText = "min-width: 140px; width: 140px; flex-shrink: 0; cursor: pointer;";
            card.onclick = () => playVideo(video);
            card.innerHTML = `<div style="width: 100%; height: 80px; border-radius: 8px; background: url('${video.thumbnail}') center/cover no-repeat;"></div><h4 style="color: #fff; font-size: 11px; margin: 6px 0 0 0; text-align: right; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;">${video.title}</h4>`;
            container.appendChild(card);
        });
    }

    function openSearchUI() {
        document.getElementById('mainHeaderView').style.display = 'none';
        document.getElementById('searchHeaderView').style.display = 'flex';
        document.getElementById('searchInput').focus();
    }

    function closeSearchUI() {
        document.getElementById('mainHeaderView').style.display = 'flex';
        document.getElementById('searchHeaderView').style.display = 'none';
        resetToYouTubeHome();
    }

    function performSearch(query) {
        if (!query.trim()) return;
        fetchYouTubeVideos(query, false);
    }
</script>
