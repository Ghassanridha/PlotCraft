<div class="youtube-app-container">
    <!-- خلفية التصميم الأصلي (صورتك) -->
    <div class="bg-overlay" style="background-image: url('https://raw.githubusercontent.com/Ghassanridha/PlotCraft/860c24fa2b434dde4251af1bccd0ab6d798bdb48/Gh.jpg');"></div>

    <!-- المحتوى التفاعلي لمنصة يوتيوب -->
    <div class="yt-content-wrapper">
        
        <!-- الشريط العلوي (البحث والاشتراكات) -->
        <header class="yt-header">
            <div class="yt-logo">PlotTube</div>
            
            <!-- خانة البحث التفاعلية -->
            <div class="yt-search-box">
                <input type="text" id="ytSearchInput" placeholder="بحث عن فيديوهات..." oninput="filterVideos()">
                <button onclick="filterVideos()">بحث</button>
            </div>

            <!-- زر قائمة الاشتراكات -->
            <button class="yt-subs-btn" onclick="toggleSubscriptions()">الاشتراكات</button>
        </header>

        <!-- لوحة الاشتراكات -->
        <div id="subscriptionsPanel" class="yt-subs-panel" style="display: none;">
            <h3>القنوات المشترك بها</h3>
            <div class="channels-list">
                <div class="channel-item" onclick="filterByChannel('قناة التقنية')">قناة التقنية</div>
                <div class="channel-item" onclick="filterByChannel('قناة الألعاب')">قناة الألعاب</div>
                <div class="channel-item" onclick="filterByChannel('الكل')">عرض الكل</div>
            </div>
        </div>

        <!-- منطقة عرض الفيديوهات -->
        <main class="yt-videos-grid" id="ytVideosContainer">
            <div class="video-card" data-title="تصميم واجهات احترافية" data-channel="قناة التقنية">
                <div class="video-thumb">فيديو 1</div>
                <div class="video-info">
                    <h4>تصميم واجهات احترافية باستخدام HTML & CSS</h4>
                    <span class="channel-name">قناة التقنية</span>
                </div>
            </div>

            <div class="video-card" data-title="تحديات ألعاب" data-channel="قناة الألعاب">
                <div class="video-thumb">فيديو 2</div>
                <div class="video-info">
                    <h4>تحديات وألعاب ممتعة مع الأصدقاء</h4>
                    <span class="channel-name">قناة الألعاب</span>
                </div>
            </div>

            <div class="video-card" data-title="برمجة سكربتات جافاسكريبت" data-channel="قناة التقنية">
                <div class="video-thumb">فيديو 3</div>
                <div class="video-info">
                    <h4>أساسيات الجافاسكريبت المتقدمة</h4>
                    <span class="channel-name">قناة التقنية</span>
                </div>
            </div>
        </main>

    </div>
</div>

<script>
    function filterVideos() {
        const query = document.getElementById('ytSearchInput').value.toLowerCase();
        const cards = document.querySelectorAll('.video-card');

        cards.forEach(card => {
            const title = card.getAttribute('data-title').toLowerCase();
            if (title.includes(query)) {
                card.style.display = 'block';
            } else {
                card.style.display = 'none';
            }
        });
    }

    function toggleSubscriptions() {
        const panel = document.getElementById('subscriptionsPanel');
        panel.style.display = (panel.style.display === 'none') ? 'block' : 'none';
    }

    function filterByChannel(channelName) {
        const cards = document.querySelectorAll('.video-card');
        cards.forEach(card => {
            const cardChannel = card.getAttribute('data-channel');
            if (channelName === 'الكل' || cardChannel === channelName) {
                card.style.display = 'block';
            } else {
                card.style.display = 'none';
            }
        });
        document.getElementById('subscriptionsPanel').style.display = 'none';
    }
</script>
