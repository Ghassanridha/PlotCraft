<!-- شاشة اليوتيوب الرئيسية (youtube.html) -->
<div id="toolsScreen" class="screen-view" style="padding-bottom: 70px; background-color: #0f0f0f; position: relative; height: 100vh; overflow-y: auto;">

    <!-- 1. مشغل الفيديو العلوي (يظهر عند النقر على أي فيديو) -->
    <div id="activePlayerContainer" style="display: none; width: 100%; background: #000; position: sticky; top: 0; z-index: 200; border-bottom: 1px solid rgba(255,255,255,0.1);">
        <div style="position: relative; width: 100%; height: 210px; background: #000;">
            <video id="mainVideoPlayer" controls autoplay style="width: 100%; height: 100%; object-fit: cover;"></video>
            <!-- زر إغلاق المشغل العرضي -->
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="position: absolute; top: 10px; left: 10px; cursor: pointer; background: rgba(0,0,0,0.6); border-radius: 50%; padding: 4px;" onclick="closeActivePlayer()">
                <line x1="18" y1="6" x2="6" y2="18"></line>
                <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
        </div>
        <div id="activeVideoInfo" style="padding: 10px 16px; color: #fff; font-size: 14px; font-weight: bold; border-bottom: 1px solid rgba(255,255,255,0.05);"></div>
    </div>

    <!-- الهيدر العلوي وشريط البحث -->
    <div id="ytHeaderContainer" style="position: sticky; top: 0; z-index: 100; background-color: #0f0f0f; border-bottom: 1px solid rgba(255,255,255,0.08);">
        
        <div id="mainHeaderView" style="display: flex; justify-content: space-between; align-items: center; padding: 12px 16px;">
            <div style="display: flex; align-items: center; gap: 18px;">
                <!-- أيقونة البحث -->
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="cursor: pointer;" onclick="openSearchUI()">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
                <!-- الإشعارات -->
                <div style="position: relative; cursor: pointer;">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                        <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
                    </svg>
                    <span style="position: absolute; top: -5px; right: -7px; background: #ff0000; color: #ffffff; font-size: 9px; font-weight: bold; padding: 1px 4px; border-radius: 8px;">+9</span>
                </div>
            </div>

            <!-- اللوجو -->
            <div style="display: flex; align-items: center; gap: 5px; cursor: pointer;">
                <span style="color: #ffffff; font-weight: bold; font-size: 18px; font-family: Roboto, sans-serif;">YouTube</span>
                <svg width="28" height="20" viewBox="0 0 24 24" fill="none">
                    <rect x="2" y="4" width="20" height="16" rx="4" fill="#FF0000" />
                    <polygon points="10,8 16,12 10,16" fill="#FFFFFF" />
                </svg>
            </div>
        </div>

        <!-- واجهة البحث التفاعلية -->
        <div id="searchHeaderView" style="display: none; padding: 10px 16px; background: #0f0f0f; align-items: center; gap: 12px; position: relative;">
            <input type="text" id="searchInput" oninput="handleSearchInput(this.value)" placeholder="ابحث في YouTube..." style="width: 100%; background: #222222; border: 1px solid rgba(255,255,255,0.2); border-radius: 20px; padding: 8px 16px; color: #ffffff; font-size: 14px; outline: none;">
            
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="cursor: pointer;" onclick="closeSearchUI()">
                <line x1="18" y1="6" x2="6" y2="18"></line>
                <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>

            <!-- قائمة الاقتراحات المنسدلة للبحث -->
            <div id="searchSuggestions" style="display: none; position: absolute; top: 50px; left: 16px; right: 16px; background: #1f1f1f; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); max-height: 220px; overflow-y: auto; z-index: 300; box-shadow: 0 8px 20px rgba(0,0,0,0.8);">
            </div>
        </div>

        <!-- شريط التبويبات العلوي -->
        <div style="display: flex; gap: 22px; padding: 8px 16px 12px 16px; overflow-x: auto; white-space: nowrap; scrollbar-width: none; direction: rtl;" id="ytTabsContainer">
            <div class="yt-top-tab active" style="color: #ffffff; font-size: 14px; font-weight: bold; position: relative; padding: 6px 10px; cursor: pointer;">
                الصفحة الرئيسية
                <div style="position: absolute; bottom: 0; right: 10px; left: 10px; height: 2px; background: #ff0000; border-radius: 2px;"></div>
            </div>
            <div class="yt-top-tab" style="color: #aaaaaa; font-size: 14px; font-weight: 500; padding: 6px 10px; cursor: pointer;">الاشتراكات</div>
            <div class="yt-top-tab" style="color: #aaaaaa; font-size: 14px; font-weight: 500; padding: 6px 10px; cursor: pointer;">موسيقى</div>
            <div class="yt-top-tab" style="color: #aaaaaa; font-size: 14px; font-weight: 500; padding: 6px 10px; cursor: pointer;">مباشر</div>
        </div>
    </div>

    <!-- 2. قائمة الفيديوهات الضخمة (تتضمن أعداداً هائلة وتمرير عمودي لا نهائي) -->
    <div id="videoFeedContainer" style="padding: 16px; display: flex; flex-direction: column; gap: 20px;">
        <!-- يتم تعبئة الفيديوهات برمجياً -->
    </div>

    <!-- 3. الشريط السفلي الثابت -->
    <div style="position: fixed; bottom: 0; left: 0; width: 100%; height: 60px; background-color: #0f0f0f; border-top: 1px solid rgba(255,255,255,0.1); display: flex; justify-content: space-around; align-items: center; z-index: 999999;">
        <div style="cursor: pointer; color: #ffffff;"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg></div>
        <div style="cursor: pointer; color: #ffffff;"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M17.77 10.32l-1.2-.5L18 9.06c1.84-.96 2.53-3.23 1.56-5.06s-3.24-2.53-5.07-1.56L6 6.22C4.13 7.18 3.42 9.48 4.38 11.33c.53 1.02 1.45 1.7 2.53 1.94l1.2.5-1.43.76c-1.84.96-2.53 3.23-1.56 5.06 1 1.83 3.27 2.5 5.1 1.53l8.43-3.78c1.87-.96 2.58-3.26 1.62-5.11-.53-1.01-1.45-1.7-2.5-1.91zM10 14.5v-5l4.5 2.5L10 14.5z"/></svg></div>
        <div style="cursor: pointer; color: #ffffff;" onclick="openPlusMenu()"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="1.8"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg></div>
        <div style="cursor: pointer; color: #ffffff;"><div style="width: 26px; height: 26px; border-radius: 50%; overflow: hidden; border: 1.5px solid #ffffff;"><img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?q=80&w=100&auto=format&fit=crop" style="width: 100%; height: 100%; object-fit: cover;"></div></div>
    </div>

</div>

<!-- دوال التشغيل والعرض والبحث -->
<script>
    // قاعدة بيانات ضخمة تحتوي على عشرات الفيديوهات الحقيقية لصناع المحتوى مع روابط فيديو حقيقية وقابلة للتشغيل
    const rawVideosList = [
        { title: "أقوى ملخصات مباريات دوري أبطال أوروبا لهذا الموسم", channel: "بي إن سبورت", duration: "12:30", views: "340 ألف مشاهدة", thumbnail: "https://images.unsplash.com/photo-1508098682722-e99c43a406b2?q=80&w=600&auto=format&fit=crop", videoUrl: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4" },
        { title: "تعلم البرمجة وتطوير واجهات المستخدم من الصفر احترافياً", channel: "عالم البرمجة والتصميم", duration: "25:40", views: "89 ألف مشاهدة", thumbnail: "https://images.unsplash.com/photo-1551650975-87deedd944c3?q=80&w=600&auto=format&fit=crop", videoUrl: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ElephantsDream.mp4" },
        { title: "تجميعة PC احترافية للألعاب والمونتاج بأفضل أداء وعملي", channel: "تيك زون", duration: "15:10", views: "210 ألف مشاهدة", thumbnail: "https://images.unsplash.com/photo-1587202372775-e229f172b9d7?q=80&w=600&auto=format&fit=crop", videoUrl: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4" },
        { title: "أسرار وخبايا لعبة PUBG Mobile وتحديثات الموسم الجديد", channel: "محترفو الألعاب", duration: "18:20", views: "550 ألف مشاهدة", thumbnail: "https://images.unsplash.com/photo-1542751371-adc38448a05e?q=80&w=600&auto=format&fit=crop", videoUrl: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerEscapes.mp4" },
        { title: "أفضل النصائح للحفاظ على صحة القطط والكلاب المنزلية وتغذيتها", channel: "عالم الحيوان والأليفة", duration: "10:05", views: "75 ألف مشاهدة", thumbnail: "https://images.unsplash.com/photo-1514888286974-6c03e2ca1dba?q=80&w=600&auto=format&fit=crop", videoUrl: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerFun.mp4" },
        { title: "جولة مذهلة في أجمل الأماكن السياحية حول العالم", channel: "مسافرون بلا حدود", duration: "30:15", views: "1.2 مليون مشاهدة", thumbnail: "https://images.unsplash.com/photo-1488646953014-85cb44e25828?q=80&w=600&auto=format&fit=crop", videoUrl: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerJoyrides.mp4" },
        { title: "تحليل عميق لأداء ريال مدريد وبرشلونة في الدوري الإسباني", channel: "استوديو التحليل الرياضي", duration: "14:50", views: "430 ألف مشاهدة", thumbnail: "https://images.unsplash.com/photo-1574629810360-7efbbe195018?q=80&w=600&auto=format&fit=crop", videoUrl: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerMeltdowns.mp4" },
        { title: "شرح تداول العملات الرقمية للمبتدئين على منصات Binance و Web3", channel: "عالم الكريپتو", duration: "22:10", views: "95 ألف مشاهدة", thumbnail: "https://images.unsplash.com/photo-1621416894569-0f39ed31d247?q=80&w=600&auto=format&fit=crop", videoUrl: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/Sintel.mp4" }
    ];

    // تكرار البيانات برمجياً لتوليد قائمة ضخمة ولا نهائية من الفيديوهات (أكثر من 60 فيديو)
    let videosData = [];
    for (let i = 1; i <= 8; i++) {
        rawVideosList.forEach((v, index) => {
            videosData.push({
                id: (i * 10) + index,
                title: `${v.title} (${i})`,
                channel: v.channel,
                duration: v.duration,
                views: `${i * 15} ألف مشاهدة`,
                thumbnail: v.thumbnail,
                videoUrl: v.videoUrl
            });
        });
    }

    // عرض الفيديوهات في الصفحة
    function renderVideos(list) {
        const container = document.getElementById('videoFeedContainer');
        container.innerHTML = '';

        if (list.length === 0) {
            container.innerHTML = `<div style="color: #aaa; text-align: center; padding: 40px 0;">لا توجد نتائج مطابقة للبحث</div>`;
            return;
        }

        list.forEach(video => {
            const card = document.createElement('div');
            card.style.cssText = "background: #1f242d; border-radius: 16px; overflow: hidden; border: 1px solid rgba(255,255,255,0.08); cursor: pointer; transition: transform 0.2s;";
            card.onclick = function() { playVideo(video); };
            card.innerHTML = `
                <div style="width: 100%; height: 180px; background: linear-gradient(180deg, rgba(0,0,0,0.1) 0%, rgba(0,0,0,0.8) 100%), url('${video.thumbnail}') center/cover; position: relative; display: flex; align-items: center; justify-content: center;">
                    <div style="width: 48px; height: 48px; background: rgba(255,0,0,0.9); border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 12px rgba(255,0,0,0.5);">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="#ffffff"><polygon points="8,5 19,12 8,19" /></svg>
                    </div>
                    <span style="position: absolute; bottom: 8px; left: 8px; background: rgba(0,0,0,0.8); color: #fff; font-size: 10px; font-weight: bold; padding: 2px 6px; border-radius: 4px;">${video.duration}</span>
                </div>
                <div style="padding: 12px; display: flex; gap: 12px; align-items: center;">
                    <div style="width: 38px; height: 38px; border-radius: 50%; background: #ff0000; display: flex; align-items: center; justify-content: center; color: #fff; font-weight: bold; font-size: 15px; flex-shrink: 0;">▶</div>
                    <div style="flex-grow: 1;">
                        <h3 style="color: #ffffff; font-size: 14px; font-weight: 700; margin-bottom: 2px; line-height: 1.4;">${video.title}</h3>
                        <p style="color: #aaa; font-size: 11px;">${video.channel} • ${video.views}</p>
                    </div>
                </div>
            `;
            container.appendChild(card);
        });
    }

    // تشغيل الفيديو في الأعلى عند النقر عليه
    function playVideo(video) {
        const playerContainer = document.getElementById('activePlayerContainer');
        const videoPlayer = document.getElementById('mainVideoPlayer');
        const videoInfo = document.getElementById('activeVideoInfo');

        playerContainer.style.display = 'block';
        videoPlayer.src = video.videoUrl;
        videoPlayer.play();
        videoInfo.innerText = `${video.title} - ${video.channel}`;
        
        // التمرير بسلاسة للأعلى لرؤية المشغل
        document.getElementById('toolsScreen').scrollTo({ top: 0, behavior: 'smooth' });
    }

    // إغلاق مشغل الفيديو
    function closeActivePlayer() {
        const playerContainer = document.getElementById('activePlayerContainer');
        const videoPlayer = document.getElementById('mainVideoPlayer');
        videoPlayer.pause();
        playerContainer.style.display = 'none';
    }

    // فتح واجهة البحث
    function openSearchUI() {
        document.getElementById('mainHeaderView').style.display = 'none';
        const searchView = document.getElementById('searchHeaderView');
        searchView.style.display = 'flex';
        document.getElementById('searchInput').focus();
    }

    // إغلاق واجهة البحث
    function closeSearchUI() {
        document.getElementById('mainHeaderView').style.display = 'flex';
        document.getElementById('searchHeaderView').style.display = 'none';
        document.getElementById('searchSuggestions').style.display = 'none';
        renderVideos(videosData);
    }

    // البحث والاقتراحات الفورية
    function handleSearchInput(query) {
        const suggestionsBox = document.getElementById('searchSuggestions');
        if (!query.trim()) {
            suggestionsBox.style.display = 'none';
            renderVideos(videosData);
            return;
        }

        const filtered = videosData.filter(v => 
            v.title.toLowerCase().includes(query.toLowerCase()) || 
            v.channel.toLowerCase().includes(query.toLowerCase())
        );

        suggestionsBox.innerHTML = '';
        if (filtered.length > 0) {
            suggestionsBox.style.display = 'block';
            filtered.slice(0, 8).forEach(item => {
                const row = document.createElement('div');
                row.style.cssText = "padding: 10px 14px; color: #fff; font-size: 13px; cursor: pointer; border-bottom: 1px solid rgba(255,255,255,0.05); text-align: right;";
                row.innerText = item.title;
                row.onclick = function() {
                    document.getElementById('searchInput').value = item.title;
                    suggestionsBox.style.display = 'none';
                    renderVideos([item]);
                };
                suggestionsBox.appendChild(row);
            });
        } else {
            suggestionsBox.style.display = 'none';
            renderVideos([]);
        }
    }

    // عرض القائمة عند فتح الصفحة
    renderVideos(videosData);
</script>
