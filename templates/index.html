<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PlotCraft</title>
    <link rel="stylesheet" href="style.css"> <!-- اربط ملف التصميم مالتك هنا -->
</head>
<body>

    <!-- حاوية شاشة الواجهة الرئيسية -->
    <div id="homeScreenContainer"></div>

    <!-- حاوية شاشة الأدوات -->
    <div id="toolsScreenContainer"></div>

    <!-- حاوية شاشة الأعمال والمشاريع -->
    <div id="worksScreenContainer"></div>

    <!-- شريط التنقل السفلي (يبقى ثابت بالأسفل) -->
    <nav class="bottom-nav">
        <div class="nav-item active" onclick="loadScreen('home', event)">الرئيسية</div>
        <div class="nav-item" onclick="loadScreen('tools', event)">الأدوات</div>
        <div class="nav-item" onclick="loadScreen('works', event)">الأعمال</div>
    </nav>

    <!-- سكربت الـ Fetch لجلب الملفات ديناميكياً -->
    <script>
        function loadScreen(screenName, event) {
            // إزالة الكلاس active من كل الأزرار وإضافته للزر الحالي
            document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
            if (event && event.currentTarget) {
                event.currentTarget.classList.add('active');
            }

            // إخفاء كل الحاويات أولاً
            document.getElementById('homeScreenContainer').style.display = 'none';
            document.getElementById('toolsScreenContainer').style.display = 'none';
            document.getElementById('worksScreenContainer').style.display = 'none';

            // جلب وعرض الشاشة المطلوبة
            if (screenName === 'home') {
                const container = document.getElementById('homeScreenContainer');
                container.style.display = 'block';
                if (!container.innerHTML.trim()) {
                    fetch('home.html') // اسم ملف الواجهة الرئيسية مالك
                        .then(response => response.text())
                        .then(data => container.innerHTML = data);
                }
            } else if (screenName === 'tools') {
                const container = document.getElementById('toolsScreenContainer');
                container.style.display = 'block';
                if (!container.innerHTML.trim()) {
                    fetch('tools.html') // اسم ملف الأدوات مالك
                        .then(response => response.text())
                        .then(data => container.innerHTML = data);
                }
            } else if (screenName === 'works') {
                const container = document.getElementById('worksScreenContainer');
                container.style.display = 'block';
                if (!container.innerHTML.trim()) {
                    fetch('works.html') // اسم ملف الأعمال مالك
                        .then(response => response.text())
                        .then(data => container.innerHTML = data);
                }
            }
        }

        // تحميل الصفحة الرئيسية تلقائياً عند فتح التطبيق أول مرة
        window.onload = function() {
            loadScreen('home');
        };
    </script>
</body>
</html>
