<!DOCTYPE html>
<html lang="ar" dir="rtl" id="appHtmlRoot">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PlotCraft UI</title>
    <link rel="manifest" href="/manifest.json">
    
    <!-- استدعاء ملف التكوينات والمفاتيح السرية (Config) -->
    <script src="config.js"></script>

    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100%;
            max-height: 850px;
            background-color: #0b0f19;
            overflow: hidden;
            position: relative;
        }

        .app-shell {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100%;
            max-height: 850px;
            position: relative;
            overflow: hidden;
            background-color: #0b0f19;
        }

        .screen-view {
            display: none;
            flex-direction: column;
            width: 100%;
            height: 100%;
            background-color: #1f242d;
            overflow-y: auto;
            overflow-x: hidden;
            padding-bottom: 110px;
            box-sizing: border-box;
        }

        .screen-view.active {
            display: flex;
        }

        #homeScreen.screen-view {
            background-color: #0b0f19;
        }

        #sparkleDialogScreen.screen-view {
            background-color: #0b0f19;
        }

        .hero-box {
            position: relative;
            width: 100%;
            min-height: 40vh;
            background: linear-gradient(180deg, rgba(11,15,25,0.2) 0%, rgba(11,15,25,0.8) 75%, #0b0f19 100%),
                        url('https://images.unsplash.com/photo-1518709268805-4e9042af9f23?q=80&w=1080&auto=format&fit=crop') center/cover no-repeat;
            border-bottom-left-radius: 35px;
            border-bottom-right-radius: 35px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 24px 20px 20px 20px;
            flex-shrink: 0;
        }

        .top-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }

        .brand-title {
            color: #ffffff;
            font-size: 20px;
            font-weight: 700;
        }

        .upgrade-badge {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            padding: 8px 16px;
            border-radius: 25px;
            color: #ffffff;
            font-size: 14px;
            font-weight: 500;
            display: flex;
            align-items: center;
            border: 1px solid rgba(255, 255, 255, 0.2);
            cursor: pointer;
            transition: 0.2s;
        }

        .welcome-section {
            margin-top: 15px;
            margin-bottom: 10px;
        }

        .welcome-section h1 {
            color: #ffffff;
            font-size: 22px;
            font-weight: 700;
            line-height: 1.4;
            text-shadow: 0 2px 8px rgba(0,0,0,0.6);
        }

        .toast-notification {
            position: fixed;
            top: 25px;
            left: 50%;
            transform: translateX(-50%) translateY(-20px);
            background: rgba(31, 36, 45, 0.95);
            color: #ffffff;
            padding: 10px 20px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 600;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5);
            z-index: 9999999;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
            text-align: center;
            white-space: nowrap;
        }
        .toast-notification.show {
            opacity: 1;
            visibility: visible;
            transform: translateX(-50%) translateY(0);
        }

        #worksScreen {
            display: none;
            flex-direction: column;
            height: 100%;
            padding: 0;
            align-items: stretch;
        }
        #worksScreen.active {
            display: flex;
        }

        .works-top-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 20px 10px 20px;
            width: 100%;
            flex-shrink: 0;
        }

        .works-screen-title {
            color: #ffffff;
            font-size: 20px;
            font-weight: 700;
        }

        .works-header-left-group {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .works-upgrade-badge {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            padding: 6px 14px;
            border-radius: 20px;
            color: #ffffff;
            font-size: 13px;
            font-weight: 500;
            border: 1px solid rgba(255, 255, 255, 0.2);
            cursor: pointer;
        }

        .works-body-container {
            padding: 10px 20px 20px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            flex-grow: 1;
        }

        .works-tabs-container {
            display: flex;
            background: #282f3d;
            border-radius: 30px;
            padding: 4px;
            width: 100%;
            max-width: 360px;
            margin-top: 15px;
            margin-bottom: 60px;
            border: 1px solid rgba(255,255,255,0.08);
        }

        .works-tab {
            flex: 1;
            text-align: center;
            padding: 10px 0;
            font-size: 13px;
            font-weight: 600;
            color: #cbd5e1;
            background: transparent;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.2s ease;
            user-select: none;
        }

        .works-tab.active {
            background: #343d50 !important;
            color: #ffffff !important;
            font-weight: 700;
        }

        .works-empty-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex-grow: 1;
            text-align: center;
            margin-top: 10px;
        }

        .works-box-icon {
            width: 90px;
            height: 90px;
            margin-bottom: 24px;
            opacity: 0.8;
            background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="%23cbd5e1" stroke-width="1.5"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path><polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline><line x1="12" y1="22.08" x2="12" y2="12"></line></svg>') no-repeat center;
            background-size: contain;
        }

        .works-empty-text-sub {
            color: #cbd5e1;
            font-size: 13px;
            margin-bottom: 35px;
        }

        .works-create-btn {
            width: 100%;
            max-width: 220px;
            background: #ffffff;
            color: #1f242d;
            font-size: 14px;
            font-weight: 700;
            padding: 10px 16px;
            border-radius: 14px;
            border: none;
            cursor: pointer;
            text-align: center;
            box-shadow: 0 4px 15px rgba(255,255,255,0.15);
            transition: 0.2s;
        }
        .works-create-btn:active {
            transform: scale(0.98);
            background: #e2e8f0;
        }

        /* شريط التنقل السفلي والأزرار المكبرة قليلاً بشكل متناسق */
        .plotcraft-nav-bar {
            position: absolute;
            bottom: 0; left: 0; width: 100%;
            background-color: transparent;
            padding: 10px 14px 16px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            z-index: 1000;
            box-sizing: border-box;
            direction: rtl;
        }
        .plotcraft-nav-bar.hidden {
            display: none !important;
        }

        /* الزر المنفصل الدائري مكبر بنسبة بسيطة ومتناسقة */
        .plotcraft-nav-square {
            background-color: rgba(20, 24, 33, 0.95);
            backdrop-filter: blur(16px);
            border: 1.5px solid rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            width: 56px;
            height: 56px;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-shrink: 0;
            cursor: pointer;
            box-shadow: 0 6px 18px rgba(0,0,0,0.6);
            overflow: hidden;
            position: relative;
        }

        /* الشعار الداخلي مكبر */
        .nav-logo-icon {
            width: 34px;
            height: 34px;
            position: relative;
            background: linear-gradient(135deg, #1e3a8a 0%, #60a5fa 100%);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .nav-logo-icon::before {
            content: '';
            position: absolute;
            top: -3px;
            left: -6px;
            width: 15px;
            height: 15px;
            background: #ffffff;
            clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
            filter: drop-shadow(0 0 3px rgba(255,255,255,0.8));
        }
        .nav-logo-play {
            width: 0;
            height: 0;
            border-top: 6px solid transparent;
            border-bottom: 6px solid transparent;
            border-left: 9px solid #0b0f19;
            margin-right: -2px;
        }
        .nav-logo-stripes {
            position: absolute;
            right: 2px;
            top: 3px;
            bottom: 3px;
            width: 3px;
            display: flex;
            flex-direction: column;
            justify-content: space-around;
        }
        .nav-logo-stripes span {
            display: block;
            width: 100%;
            height: 2px;
            background: #000000;
            transform: skewX(-20deg);
        }

        /* الكبسولة السوداء المحتوية على الأزرار مكبرة الارتفاع والحجم قليلاً */
        .plotcraft-nav-pill {
            background-color: rgba(20, 24, 33, 0.92);
            backdrop-filter: blur(16px);
            border: 1.5px solid rgba(255, 255, 255, 0.15);
            border-radius: 40px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 6px 12px;
            flex-grow: 1;
            height: 56px;
        }

        /* الأزرار الداخلية الثلاثة مكبرة بشكل بسيط ومتناسق */
        .plotcraft-nav-item {
            display: flex;
            align-items: center;
            gap: 7px;
            color: #94a3b8;
            font-size: 14px;
            font-weight: 500;
            text-decoration: none;
            cursor: pointer;
            white-space: nowrap;
            padding: 8px 14px;
            border-radius: 24px;
            transition: all 0.2s ease;
        }

        .plotcraft-nav-item svg {
            width: 18px;
            height: 18px;
        }

        .plotcraft-nav-item.active {
            color: #ffffff;
            font-weight: 700;
            background-color: rgba(255, 255, 255, 0.15);
        }
    </style>
</head>
<body>

    <div class="app-shell" id="appShellContainer">
        <div class="toast-notification" id="toastNotification"></div>

        <!-- شاشة الرئيسية -->
        <div id="homeScreen" class="screen-view active">
            <div class="hero-box">
                <div class="top-header">
                    <div class="brand-title">PlotCraft</div>
                    <div class="upgrade-badge" onclick="openSubscriptionModal()">ترقية</div>
                </div>
                <div class="welcome-section">
                    <h1>مساء الخير، أيها المخرج<br>أي قصة سنصنع اليوم؟</h1>
                </div>
            </div>
        </div>

        <!-- شاشة الأعمال -->
        <div id="worksScreen" class="screen-view">
            <div class="works-top-header">
                <div class="works-screen-title">الأعمال</div>
                <div class="works-header-left-group">
                    <div class="works-upgrade-badge" onclick="openSubscriptionModal()">ترقية</div>
                </div>
            </div>
            <div class="works-body-container">
                <div class="works-tabs-container">
                    <div class="works-tab active" onclick="switchWorksTab(this)">المشاريع</div>
                    <div class="works-tab" onclick="switchWorksTab(this)">مكتبة الوسائط</div>
                </div>
                <div class="works-empty-content">
                    <div class="works-box-icon"></div>
                    <div class="works-empty-text-sub">ستظهر هنا مشاريع القصة الخاصة بك.</div>
                    <button class="works-create-btn" onclick="openSparkleDialog(event)">إنشاء قصة</button>
                </div>
            </div>
        </div>

        <!-- تضمين الأداة الجديدة المستقلة (Sparkle Modal) -->
        {% include 'sparkle_modal.html' %}

        <!-- تضمين مكون نافذة الاشتراكات المستقل -->
        {% include 'subscription_modal.html' %}

        <!-- شريط التنقل السفلي -->
        <div class="plotcraft-nav-bar" id="mainNavBar">
            <!-- 1. الزر المنفصل الدائري المكبر قليلاً في أقصى اليمين -->
            <div class="plotcraft-nav-square" onclick="openSparkleDialog(event)">
                <div class="nav-logo-icon">
                    <div class="nav-logo-play"></div>
                    <div class="nav-logo-stripes">
                        <span></span>
                        <span></span>
                        <span></span>
                    </div>
                </div>
            </div>

            <!-- 2. الكبسولة المحتوية على الأزرار الثلاثة المكبرة قليلاً من اليمين لليسار -->
            <div class="plotcraft-nav-pill">
                <!-- الصفحة الرئيسية -->
                <a href="#" class="plotcraft-nav-item active" id="navHome" onclick="switchScreen('homeScreen', event); setActiveNav('navHome')">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
                    <span>الصفحة الرئيسية</span>
                </a>

                <!-- الأدوات -->
                <a href="#" class="plotcraft-nav-item" id="navTools" onclick="switchScreen('toolsScreen', event); setActiveNav('navTools')">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v4m0 12v4M4.93 4.93l2.83 2.83m8.48 8.48l2.83 2.83M2 12h4m12 0h4M4.93 19.07l2.83-2.83m8.48-8.48l2.83-2.83"></path></svg>
                    <span>الأدوات</span>
                </a>

                <!-- الأعمال -->
                <a href="#" class="plotcraft-nav-item" id="navWorks" onclick="switchScreen('worksScreen', event); setActiveNav('navWorks')">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>
                    <span>الأعمال</span>
                </a>
            </div>
        </div>
    </div>

    <script>
        window.showToast = function(message) {
            const toast = document.getElementById('toastNotification');
            toast.innerText = message;
            toast.classList.add('show');
            setTimeout(() => { toast.classList.remove('show'); }, 1500);
        };

        window.switchScreen = function(screenId, event) {
            if (event) event.preventDefault();
            document.querySelectorAll('.screen-view').forEach(s => {
                if(s.id !== 'sparkleDialogScreen') s.classList.remove('active');
            });
            
            const targetScreen = document.getElementById(screenId);
            if (targetScreen) {
                targetScreen.classList.add('active');
            }

            let navBar = document.getElementById('mainNavBar');
            if (['sparkleDialogScreen', 'addCharacterScreen', 'storyDescriptionScreen', 'stepByStepScreen', 'toolsScreen'].includes(screenId)) {
                navBar.classList.add('hidden');
            } else {
                navBar.classList.remove('hidden');
            }
        };

        window.setActiveNav = function(navId) {
            document.querySelectorAll('.plotcraft-nav-item').forEach(i => i.classList.remove('active'));
            let targetNav = document.getElementById(navId);
            if(targetNav) targetNav.classList.add('active');
        };

        window.switchWorksTab = function(element) {
            document.querySelectorAll('.works-tab').forEach(t => t.classList.remove('active'));
            element.classList.add('active');
        };
    </script>

    <script src="/static/subscription.js"></script>
</body>
</html>
