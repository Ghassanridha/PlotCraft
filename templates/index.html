<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بلوتكرافت - PlotCraft AI</title>
    <style>
        body { font-family: Tahoma, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 20px; text-align: center; }
        .container { max-width: 600px; margin: 40px auto; background: #1e293b; padding: 30px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
        h1 { color: #38bdf8; margin-bottom: 10px; }
        p { color: #94a3b8; margin-bottom: 30px; }
        textarea { width: 100%; height: 120px; padding: 12px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: #fff; font-size: 16px; box-sizing: border-box; resize: vertical; }
        button { background: #0284c7; color: white; border: none; padding: 12px 30px; font-size: 18px; border-radius: 8px; cursor: pointer; margin-top: 20px; width: 100%; transition: background 0.3s; }
        button:hover { background: #0369a1; }
    </style>
</head>
<body>
    <div class="container">
        <h1>PlotCraft AI</h1>
        <p>منصة ذكاء اصطناعي لتحويل القصص والصور إلى مقاطع فيديو سينمائية</p>
        <textarea placeholder="اكتب قصتك أو وصف المشهد هنا لتحويله إلى فيديو..."></textarea>
        <button onclick="alert('جاري معالجة الفيديو بالذكاء الاصطناعي...')">إنشاء الفيديو السينمائي</button>
    </div>
</body>
</html>
