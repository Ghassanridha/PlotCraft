<!DOCTYPE html>
<html lang="ar" dir="rtl" id="appHtmlRoot">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PlotCraft UI</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        html, body {
            width: 100%;
            height: 100vh;
            background-color: #0b0f19;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .main-container {
            text-align: center;
            padding: 20px;
        }

        .brand-title {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 10px;
            color: #3b82f6;
        }

        .welcome-text {
            font-size: 16px;
            color: #cbd5e1;
            margin-bottom: 20px;
        }

        .status-badge {
            display: inline-block;
            background: rgba(59, 130, 246, 0.15);
            border: 1px solid rgba(59, 130, 246, 0.3);
            color: #60a5fa;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="main-container">
        <div class="brand-title">PlotCraft</div>
        <div class="welcome-text">التطبيق شغال وجاهز بكل استقرار</div>
        <div class="status-badge">النظام متصل 🟢</div>
    </div>

</body>
</html>
