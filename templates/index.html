    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js";
        import {
            getAuth,
            onAuthStateChanged,
            signInWithEmailAndPassword,
            createUserWithEmailAndPassword,
            signOut
        } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-auth.js";
        import {
            getFirestore,
            doc,
            setDoc,
            addDoc,
            collection,
            serverTimestamp
        } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC0yqVlGpM159foKmpMFiuySgF5uFxOA_k",
            authDomain: "plotcraft2.firebaseapp.com",
            projectId: "plotcraft2",
            storageBucket: "plotcraft2.firebasestorage.app",
            messagingSenderId: "338171528711",
            appId: "1:338171528711:web:f13544fb4e496fe39e8ca2",
            measurementId: "G-T2ZXFTGD5H"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        async function persistUserDoc(user, extraFields = {}) {
            if (!user) return;
            try {
                const userRef = doc(db, "users", user.uid);
                await setDoc(userRef, {
                    uid: user.uid,
                    email: user.email || "",
                    lastLoginAt: serverTimestamp(),
                    updatedAt: serverTimestamp(),
                    ...extraFields
                }, { merge: true });
            } catch (err) {
                console.error("Firestore user save error:", err);
            }
        }

        function setupFirebaseBridge() {
            const bridge = window.plotcraftAuthBridge = window.plotcraftAuthBridge || {};
            bridge.ready = true;
            bridge.auth = auth;
            bridge.db = db;

            const doLogin = async function (email, password) {
                const cred = await signInWithEmailAndPassword(auth, email, password);
                await persistUserDoc(cred.user);
                return cred.user;
            };

            const doRegister = async function (email, password) {
                const cred = await createUserWithEmailAndPassword(auth, email, password);
                await persistUserDoc(cred.user, {
                    createdAt: serverTimestamp(),
                    role: "user",
                    credits: 0
                });
                return cred.user;
            };

            const doLogout = async function () {
                await signOut(auth);
            };

            bridge.login = doLogin;
            bridge.signIn = doLogin;
            bridge.emailLogin = doLogin;

            bridge.register = doRegister;
            bridge.signUp = doRegister;
            bridge.emailRegister = doRegister;

            bridge.logout = doLogout;
            bridge.signOut = doLogout;
            bridge.emailLogout = doLogout;

            bridge.requestSubscription = async function (selectedPlan) {
                const user = auth.currentUser;
                if (!user) {
                    throw new Error("يجب تسجيل الدخول أولاً لإتمام الاشتراك.");
                }

                const subData = {
                    userId: user.uid,
                    email: user.email || "",
                    planId: selectedPlan?.planId || "monthly",
                    credits: Number(selectedPlan?.credits || 0),
                    title: selectedPlan?.title || "PlotCraft Pro",
                    status: "active",
                    updatedAt: serverTimestamp()
                };

                await persistUserDoc(user, {
                    subscription: subData,
                    credits: subData.credits
                });

                const created = await addDoc(collection(db, "subscriptions"), {
                    ...subData,
                    createdAt: serverTimestamp()
                });

                return {
                    id: created.id,
                    ...subData
                };
            };

            bridge.subscribe = bridge.requestSubscription;

            window.dispatchEvent(new CustomEvent("plotcraft:firebase-ready", { detail: bridge }));

            onAuthStateChanged(auth, (user) => {
                if (!user) {
                    window.isUserLoggedIn = false;
                    if (typeof window.setEmailLoggedIn === "function") {
                        window.setEmailLoggedIn(false);
                    }
                    if (typeof bridge.setAuthState === "function") {
                        bridge.setAuthState(null);
                    }
                    if (typeof bridge.onLogout === "function") {
                        bridge.onLogout();
                    }
                    return;
                }

                window.isUserLoggedIn = true;
                if (typeof window.setEmailLoggedIn === "function") {
                    window.setEmailLoggedIn(true);
                }

                const payload = {
                    uid: user.uid,
                    email: user.email
                };

                if (typeof bridge.setAuthState === "function") {
                    bridge.setAuthState(payload);
                }
                if (typeof bridge.onLoginSuccess === "function") {
                    bridge.onLoginSuccess(payload);
                }

                persistUserDoc(user);
            });
        }

        setupFirebaseBridge();
    </script>
