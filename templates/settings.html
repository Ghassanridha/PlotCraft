<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الإعدادات - PlotCraft</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #000;
            overflow: hidden;
        }

        /* حاوية الشاشة مع خلفية التصميم الجديد */
        .settings-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: url('https://raw.githubusercontent.com/Ghassanridha/PlotCraft/3c0d837613bae10a387c91a8a059563aa7cccd10/Ghas.jpg') center/100% 100% no-repeat;
            z-index: 999999;
            direction: rtl;
            transform: translateX(-100vw);
            transition: transform 0.3s ease-out;
            visibility: hidden;
            overflow: hidden;
        }

        .settings-screen.show {
            visibility: visible;
            transform: translateX(0);
        }

        .click-overlay-container {
            position: relative;
            width: 100%;
            max-width: 480px;
            height: 100vh;
            margin: 0 auto;
        }

        .clickable-area {
            position: absolute;
            cursor: pointer;
            z-index: 50;
        }

        /* زر الرجوع الشفرة في أقصى اليمين بالأعلى */
        .btn-back-chevron {
            position: absolute;
            top: 14px;
            right: 12px;
            background: transparent;
            border: none;
            color: #ffffff;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            z-index: 999;
            padding: 4px 8px;
            line-height: 1;
        }

        .btn-back-chevron:hover {
            opacity: 0.8;
        }

        /* مناطق النقر الموزعة */
        .toggle-notifications {
            top: 350px;
            right: 15px;
            width: 50px;
            height: 30px;
        }

        .link-language {
            top: 395px;
            left: 4%;
            width: 92%;
            height: 55px;
        }

        .link-join {
            top: 455px;
            left: 4%;
            width: 92%;
            height: 55px;
        }

        .link-contact {
            top: 515px;
            left: 4%;
            width: 92%;
            height: 55px;
        }

        .link-sub-settings {
            top: 590px;
            left: 4%;
            width: 92%;
            height: 55px;
        }

        .link-clear-cache {
            top: 545px;
            left: 4%;
            width: 92%;
            height: 55px;
        }
    </style>
</head>
<body>

    <div id="settingsScreen" class="settings-screen">
        <div class="click-overlay-container">
            
            <!-- زر الرجوع (الشفرة) -->
            <button class="btn-back-chevron" onclick="closeSettingsScreen()">&#x276F;</button>
            
            <!-- مناطق النقر الأساسية -->
            <div class="clickable-area toggle-notifications" onclick="toggleNotifications()"></div>
            
            <a href="#" class="clickable-area link-language" onclick="handleAction('language'); return false;"></a>
            <a href="#" class="clickable-area link-join" onclick="handleAction('join'); return false;"></a>
            <a href="#" class="clickable-area link-contact" onclick="handleAction('contact'); return false;"></a>
            <a href="#" class="clickable-area link-sub-settings" onclick="handleAction('sub-settings'); return false;"></a>
            <a href="#" class="clickable-area link-clear-cache" onclick="clearCacheAction(); return false;"></a>

        </div>
    </div>

    <script>
        function openSettingsScreen() {
            const screen = document.getElementById('settingsScreen');
            if (screen) {
                screen.classList.add('show');
            }
        }

        function closeSettingsScreen() {
            const screen = document.getElementById('settingsScreen');
            if (screen) {
                screen.classList.remove('show');
            }
        }

        function handleAction(type) {
            console.log("تم الضغط على: " + type);
        }

        function toggleNotifications() {
            console.log("تم تغيير حالة الإشعارات");
        }

        function clearCacheAction() {
            console.log("تم مسح الذاكرة المؤقتة");
        }
    </script>
</body>
</html>
