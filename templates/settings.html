<!DOCTYPE html>
<html lang="ar" dir="rtl" id="appHtml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">الإعدادات - PlotCraft</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #000;
            overflow: hidden;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        .settings-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: url('https://raw.githubusercontent.com/Ghassanridha/PlotCraft/3c0d837613bae10a387c91a8a059563aa7cccd10/Ghas.jpg') center/100% 100% no-repeat;
            z-index: 999999;
            transform: translateX(-100vw);
            transition: transform 0.3s ease-out;
            visibility: hidden;
            overflow: hidden;
        }

        .settings-screen.show {
            visibility: visible;
            transform: translateX(0);
        }

        .click-overlay-container {
            position: relative;
            width: 100%;
            max-width: 480px;
            height: 100vh;
            margin: 0 auto;
        }

        .clickable-area {
            position: absolute;
            cursor: pointer;
            z-index: 50;
        }

        /* زر X الصغير الشفاف بدون خلفية بلون أبيض غامق أعلى اليمين */
        .btn-close-x {
            position: absolute;
            top: 18px;
            right: 18px;
            background: transparent;
            border: none;
            color: #9ca3af; /* أبيض غامق / رمادي */
            font-size: 22px;
            font-weight: 300;
            cursor: pointer;
            z-index: 999;
            padding: 5px;
            transition: color 0.2s;
        }

        .btn-close-x:hover {
            color: #ffffff;
        }

        /* أماكن الأزرار بدقة حسب التصميم */
        .banner-link {
            top: 70px;
            left: 4%;
            width: 92%;
            height: 130px;
        }

        .link-points {
            top: 215px;
            left: 4%;
            width: 92%;
            height: 55px;
        }

        .link-feedback {
            top: 275px;
            left: 4%;
            width: 92%;
            height: 55px;
        }

        /* زر الإشعارات الخاص بالتشغيل (أزرق) والإطفاء (أبيض/رمادي) */
        .toggle-notifications {
            top: 350px;
            right: 15px;
            width: 50px;
            height: 30px;
            background: #d1d5db; /* أبيض/رمادي عند الإطفاء */
            border-radius: 15px;
            cursor: pointer;
            transition: background 0.3s;
            position: absolute;
            z-index: 50;
        }
        .toggle-notifications.active {
            background: #3b82f6; /* أزرق عند التشغيل */
        }

        .link-language {
            top: 395px;
            left: 4%;
            width: 92%;
            height: 55px;
        }

        .link-join {
            top: 455px;
            left: 4%;
            width: 92%;
            height: 55px;
        }

        .link-contact {
            top: 515px;
            left: 4%;
            width: 92%;
            height: 55px;
        }

        .link-sub-settings {
            top: 590px;
            left: 4%;
            width: 92%;
            height: 55px;
        }

        .link-clear-cache {
            top: 545px;
            left: 4%;
            width: 92%;
            height: 55px;
        }

        /* تصميم النوافذ المنبثقة للتفاعل */
        .craft-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }

        .craft-modal.active {
            opacity: 1;
            visibility: visible;
        }

        .craft-modal-content {
            background: #18181b;
            color: #fff;
            width: 90%;
            max-width: 400px;
            border-radius: 20px;
            padding: 24px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            border: 1px solid #27272a;
            text-align: right;
        }

        .craft-modal-content h3 {
            margin-bottom: 15px;
            font-size: 18px;
            color: #3b82f6;
        }

        /* قائمة اللغات العمودية الحقيقية */
        .lang-list-container {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 250px;
            overflow-y: auto;
        }

        .lang-option {
            padding: 12px;
            background: #27272a;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.2s;
            text-align: center;
            font-weight: bold;
            color: #fff;
        }

        .lang-option:hover {
            background: #3f3f46;
        }

        .craft-btn-close {
            margin-top: 15px;
            width: 100%;
            padding: 10px;
            background: #ef4444;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div id="settingsScreen" class="settings-screen show">
        <div class="click-overlay-container">
            
            <!-- زر إغلاق X الصغير الشفاف بلون أبيض غامق -->
            <button class="btn-close-x" onclick="closeSettingsScreen()" title="إغلاق">&times;</button>
            
            <!-- زر تسجيل الدخول / البانر -->
            <a href="#" class="clickable-area banner-link" onclick="handleAction('banner'); return false;"></a>
            
            <!-- زر النقاط -->
            <a href="#" class="clickable-area link-points" onclick="handleAction('points'); return false;"></a>
            
            <!-- زر الآراء والمقترحات -->
            <a href="#" class="clickable-area link-feedback" onclick="handleAction('feedback'); return false;"></a>
            
            <!-- زر الإشعارات (أزرق عند التشغيل، أبيض/رمادي عند الإطفاء) - بدون أي تداخلات -->
            <div id="notifToggle" class="toggle-notifications" onclick="toggleNotifications()"></div>
            
            <!-- زر اللغة (يفتح قائمة عمودية باللغات الحقيقية) -->
            <a href="#" class="clickable-area link-language" onclick="handleAction('language'); return false;"></a>
            
            <!-- زر انضمام إلينا (يحول إلى تلغرام مباشرة بدون أي تنبيهات) -->
            <a href="#" class="clickable-area link-join" onclick="handleAction('join'); return false;"></a>
            
            <!-- زر اتصل بنا (يفتح البريد الإلكتروني) -->
            <a href="#" class="clickable-area link-contact" onclick="handleAction('contact'); return false;"></a>
            
            <!-- الإعدادات الفرعية -->
            <a href="#" class="clickable-area link-sub-settings" onclick="handleAction('sub-settings'); return false;"></a>
            
            <!-- زر مسح الذاكرة المؤقتة (ينفذ المسح ويعرض رسالة النجاح الخاصة به فقط) -->
            <a href="#" class="clickable-area link-clear-cache" onclick="clearCacheAction(); return false;"></a>

        </div>
    </div>

    <!-- نافذة منبثقة عامة لعرض القوائم -->
    <div id="dynamicModal" class="craft-modal">
        <div class="craft-modal-content" id="modalBoxDir">
            <h3 id="modalTitle">العنوان</h3>
            <div id="modalBody"></div>
            <button class="craft-btn-close" id="closeModalBtn" onclick="closeDynamicModal()">إغلاق</button>
        </div>
    </div>

    <script>
        let currentLang = 'ar';

        const translations = {
            ar: {
                pageTitle: "الإعدادات - PlotCraft",
                closeText: "إغلاق",
                bannerAlert: "جاري فتح نافذة تسجيل الدخول بالحسابات الحقيقية...",
                pointsAlert: "عرض رصيد النقاط والمكافآت",
                feedbackAlert: "فتح نافذة الآراء والمقترحات",
                subSettingsAlert: "فتح الإعدادات الفرعية",
                langTitle: "اختر لغة التطبيق",
                cacheSuccess: "تم مسح الذاكرة المؤقتة بنجاح"
            },
            en: {
                pageTitle: "Settings - PlotCraft",
                closeText: "Close",
                bannerAlert: "Opening real accounts login window...",
                pointsAlert: "Displaying points and rewards",
                feedbackAlert: "Opening feedback window",
                subSettingsAlert: "Opening sub-settings",
                langTitle: "Select App Language",
                cacheSuccess: "Cache cleared successfully"
            }
        };

        function closeSettingsScreen() {
            const screen = document.getElementById('settingsScreen');
            if (screen) {
                screen.classList.remove('show');
            }
        }

        function openDynamicModal(title, htmlContent) {
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('modalBody').innerHTML = htmlContent;
            document.getElementById('dynamicModal').classList.add('active');
        }

        function closeDynamicModal() {
            document.getElementById('dynamicModal').classList.remove('active');
        }

        // زر الإشعارات: خاص باللون الأزرق عند التشغيل والأبيض/الرمادي عند الإطفاء حصرياً
        function toggleNotifications() {
            const toggle = document.getElementById('notifToggle');
            toggle.classList.toggle('active');
        }

        function handleAction(type) {
            const t = translations[currentLang];
            
            if (type === 'banner') {
                alert(t.bannerAlert);
            } 
            else if (type === 'points') {
                alert(t.pointsAlert);
            } 
            else if (type === 'feedback') {
                alert(t.feedbackAlert);
            } 
            else if (type === 'language') {
                // عرض قائمة اللغات الحقيقية بشكل عمودي تماماً
                let langHtml = `
                    <div class="lang-list-container">
                        <div class="lang-option" onclick="changeLanguage('ar')">العربية (Arabic)</div>
                        <div class="lang-option" onclick="changeLanguage('en')">English (الإنجليزية)</div>
                        <div class="lang-option" onclick="changeLanguage('fr')">Français (الفرنسية)</div>
                        <div class="lang-option" onclick="changeLanguage('es')">Español (الإسبانية)</div>
                        <div class="lang-option" onclick="changeLanguage('de')">Deutsch (الألمانية)</div>
                    </div>
                `;
                openDynamicModal(t.langTitle, langHtml);
            } 
            else if (type === 'join') {
                // يحول المستخدم إلى تلغرام مباشرة بدون أي تنبيهات
                window.open('https://t.me/', '_blank');
            } 
            else if (type === 'contact') {
                // يحول المستخدم إلى البريد الإلكتروني لإرسال رسالة
                window.location.href = 'mailto:support@plotcraft.ai?subject=Support%20Request';
            } 
            else if (type === 'sub-settings') {
                alert(t.subSettingsAlert);
            }
        }

        // تغيير لغة التطبيق بالكامل وتحديث النصوص والاتجاه
        function changeLanguage(lang) {
            currentLang = lang;
            const htmlTag = document.getElementById('appHtml');
            const modalDir = document.getElementById('modalBoxDir');
            
            if (lang === 'ar') {
                htmlTag.setAttribute('dir', 'rtl');
                htmlTag.setAttribute('lang', 'ar');
                modalDir.style.textAlign = 'right';
                alert("تم تحويل التطبيق إلى اللغة العربية");
            } else {
                htmlTag.setAttribute('dir', 'ltr');
                htmlTag.setAttribute('lang', lang);
                modalDir.style.textAlign = 'left';
                alert("Language changed successfully");
            }

            document.getElementById('pageTitle').innerText = translations[lang] ? translations[lang].pageTitle : "Settings - PlotCraft";
            document.getElementById('closeModalBtn').innerText = translations[lang] ? translations[lang].closeText : "Close";
            closeDynamicModal();
        }

        // مسح الذاكرة المؤقتة مع رسالة النجاح المخصصة حصرياً لهذا الزر
        function clearCacheAction() {
            const t = translations[currentLang];
            localStorage.removeItem('temp_cache');
            localStorage.removeItem('corrupted_projects');
            alert(t.cacheSuccess);
        }
    </script>
</body>
</html>
