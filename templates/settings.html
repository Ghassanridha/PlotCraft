<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الإعدادات - PlotCraft</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #000;
            overflow: hidden;
        }

        /* حاوية الشاشة كاملة مع صورة الخلفية الأصلية الثابتة تماماً */
        .settings-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: url('https://raw.githubusercontent.com/Ghassanridha/PlotCraft/317aa8b2426f2a85f0427ea31c7b44605df108d0/Gh5.jpg') center/cover no-repeat;
            z-index: 999999;
            direction: rtl;
            transform: translateX(-100vw);
            transition: transform 0.3s ease-out;
            visibility: hidden;
            overflow: hidden;
        }

        .settings-screen.show {
            visibility: visible;
            transform: translateX(0);
        }

        /* الطبقة الشفافة لتغطية النقاط */
        .click-overlay-container {
            position: relative;
            width: 100%;
            max-width: 480px;
            height: 100vh;
            margin: 0 auto;
        }

        .clickable-area {
            position: absolute;
            cursor: pointer;
        }

        /* الأزرار الأصلية كما هي تماماً بدون أي تعديل لمواقعها */
        .btn-back {
            top: 15px;
            left: 15px;
            width: 45px;
            height: 45px;
        }

        .btn-upgrade {
            top: 15px;
            right: 15px;
            width: 90px;
            height: 38px;
        }

        .banner-link {
            top: 70px;
            left: 4%;
            width: 92%;
            height: 130px;
        }

        .link-points {
            top: 215px;
            left: 4%;
            width: 92%;
            height: 55px;
        }

        .link-feedback {
            top: 275px;
            left: 4%;
            width: 92%;
            height: 55px;
        }

        .toggle-notifications {
            top: 350px;
            right: 15px;
            width: 50px;
            height: 30px;
        }

        .link-language {
            top: 395px;
            left: 4%;
            width: 92%;
            height: 55px;
        }

        .link-join {
            top: 455px;
            left: 4%;
            width: 92%;
            height: 55px;
        }

        .link-contact {
            top: 515px;
            left: 4%;
            width: 92%;
            height: 55px;
        }

        .link-sub-settings {
            top: 590px;
            left: 4%;
            width: 92%;
            height: 55px;
        }

        /* الزر الأخير (مسح الذاكرة المؤقتة) تم رفعه وحده للأعلى ليكون قريبًا تحت زر الإعدادات وظاهراً تماماً */
        .link-clear-cache {
            top: 648px;
            left: 4%;
            width: 92%;
            height: 55px;
        }
    </style>
</head>
<body>

    <div id="settingsScreen" class="settings-screen">
        <div class="click-overlay-container">
            
            <div class="clickable-area btn-back" onclick="closeSettingsScreen()"></div>
            <div class="clickable-area btn-upgrade" onclick="openSubscriptionModal()"></div>
            
            <a href="#" class="clickable-area banner-link" onclick="handleAction('banner'); return false;"></a>
            <a href="#" class="clickable-area link-points" onclick="handleAction('points'); return false;"></a>
            <a href="#" class="clickable-area link-feedback" onclick="handleAction('feedback'); return false;"></a>
            
            <div class="clickable-area toggle-notifications" onclick="toggleNotifications()"></div>
            
            <a href="#" class="clickable-area link-language" onclick="handleAction('language'); return false;"></a>
            <a href="#" class="clickable-area link-join" onclick="handleAction('join'); return false;"></a>
            <a href="#" class="clickable-area link-contact" onclick="handleAction('contact'); return false;"></a>
            <a href="#" class="clickable-area link-sub-settings" onclick="handleAction('settings'); return false;"></a>
            <a href="#" class="clickable-area link-clear-cache" onclick="clearCacheAction()"></a>

        </div>
    </div>

    <script>
        function openSettingsScreen() {
            const screen = document.getElementById('settingsScreen');
            if (screen) {
                screen.classList.add('show');
            }
        }

        function closeSettingsScreen() {
            const screen = document.getElementById('settingsScreen');
            if (screen) {
                screen.classList.remove('show');
            }
        }

        function handleAction(type) {
            console.log("تم الضغط على: " + type);
        }

        function openSubscriptionModal() {
            if (typeof openSubscription === "function") {
                openSubscription();
            } else {
                alert("فتح نافذة الترقية والاشتراك");
            }
        }

        function toggleNotifications() {
            alert("تم تغيير حالة الإشعارات");
        }

        function clearCacheAction() {
            alert("تم مسح الذاكرة المؤقتة بنجاح!");
        }
    </script>
</body>
</html>
