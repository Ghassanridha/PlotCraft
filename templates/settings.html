<!DOCTYPE html>
<html lang="ar" dir="rtl" id="appHtml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">الإعدادات - PlotCraft</title>
    
    <!-- 🚀 تحميل مسبق للخلفيات البصرية لظهورها الفوري -->
    <link rel="preload" as="image" href="https://raw.githubusercontent.com/Ghassanridha/PlotCraft/87ec5eff439c8c227933258a0e1738538ab7d07b/G2.jpg">
    <link rel="preload" as="image" href="https://raw.githubusercontent.com/Ghassanridha/PlotCraft/4d6212dde00d8debb396a53e5d3cec625ce3f8e0/N.jpg">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #000;
            overflow: hidden;
        }

        /* 1️⃣ خلفية G2.jpg الأساسية (حالة الزائر) */
        .settings-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: url('https://raw.githubusercontent.com/Ghassanridha/PlotCraft/87ec5eff439c8c227933258a0e1738538ab7d07b/G2.jpg') center/100% 100% no-repeat;
            z-index: 999999;
            direction: inherit;
            transform: translateX(-100vw);
            transition: transform 0.3s ease-out;
            visibility: hidden;
            overflow-y: auto;
        }

        /* 2️⃣ خلفية N.jpg الجديدة للتصميم الأساسي بعد تسجيل الدخول */
        .settings-screen.logged-in {
            background: url('https://raw.githubusercontent.com/Ghassanridha/PlotCraft/4d6212dde00d8debb396a53e5d3cec625ce3f8e0/N.jpg') center/100% 100% no-repeat;
        }

        .settings-screen.show {
            visibility: visible;
            transform: translateX(0);
        }

        .settings-container {
            position: relative;
            width: 100%;
            max-width: 480px;
            margin: 0 auto;
            padding: 10px 24px 20px 24px;
            display: flex;
            flex-direction: column;
        }

        /* زر العودة العلوي */
        .settings-header {
            display: flex;
            justify-content: flex-start;
            align-items: center;
            padding: 2px 0;
            position: relative;
            z-index: 20;
        }

        html[dir="ltr"] .settings-header {
            flex-direction: row-reverse;
        }

        .btn-back {
            background: transparent;
            border: none;
            color: #ffffff;
            font-size: 18px;
            cursor: pointer;
            padding: 6px 12px;
            position: relative;
            z-index: 25;
        }

        /* زر تسجيل الدخول للوضع القديم (الزائر) */
        .btn-login-overlay {
            position: absolute;
            top: 76px;
            left: 8px;
            width: 125px;
            height: 42px;
            background: transparent;
            border: none;
            color: #000000;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }

        html[dir="ltr"] .btn-login-overlay {
            left: auto;
            right: 8px;
        }

        .btn-login-overlay:active {
            opacity: 0.6;
        }

        /* طبقة بيانات المستخدم المسجل فوق التصميم الجديد N.jpg */
        .profile-overlay-box {
            display: none;
            position: absolute;
            top: 70px;
            right: 85px;
            flex-direction: column;
            gap: 4px;
            z-index: 15;
            color: #ffffff;
        }

        .user-name-text {
            font-size: 15px;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: 0.3px;
        }

        .user-id-container {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            color: #d1d5db;
            cursor: pointer;
            width: fit-content;
        }

        .copy-icon-btn {
            background: transparent;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            padding: 2px;
        }

        /* المربع الأول (المستطيل الأوسط) */
        .group-middle {
            margin-top: 135px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .settings-screen.logged-in .group-middle {
            margin-top: 195px; /* ضبط الموضع ليتناسق مع البروفايل الجديد */
        }

        .group-middle .setting-item:first-child {
            margin-top: -12px;
        }

        /* العناصر الإضافية للمسجلين فقط (سجل النقاط، التعليقات، زر تسجيل الخروج) */
        .loggedIn-only {
            display: none;
        }

        /* المربع الثاني (المستطيل السفلي) */
        .group-bottom {
            margin-top: 48px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .group-bottom .setting-item:first-child {
            margin-top: 0px;
        }

        .setting-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 44px;
            padding: 0 8px;
            color: #ffffff;
            text-decoration: none;
            cursor: pointer;
        }

        .setting-item:active {
            opacity: 0.7;
        }

        .setting-right {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 15px;
            font-weight: 500;
        }

        html[dir="ltr"] .setting-right {
            flex-direction: row;
        }

        .icon-svg {
            width: 22px;
            height: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .setting-left {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #94a3b8;
            font-size: 13px;
        }

        .arrow-icon {
            color: #ffffff;
            font-size: 14px;
        }

        html[dir="ltr"] .arrow-icon {
            transform: scaleX(-1);
        }

        /* زر التبديل للإشعارات */
        .toggle-switch {
            width: 44px;
            height: 24px;
            background: #475569;
            border-radius: 12px;
            position: relative;
            cursor: pointer;
            transition: background 0.3s;
        }

        .toggle-switch::after {
            content: '';
            position: absolute;
            top: 2px;
            right: 2px;
            width: 20px;
            height: 20px;
            background: #ffffff;
            border-radius: 50%;
            transition: transform 0.3s;
        }

        html[dir="ltr"] .toggle-switch::after {
            right: auto;
            left: 2px;
        }

        .toggle-switch.active {
            background: #3b82f6;
        }

        .toggle-switch.active::after {
            transform: translateX(-20px);
        }

        html[dir="ltr"] .toggle-switch.active::after {
            transform: translateX(20px);
        }

        /* نافذة اختيار اللغات السفلية */
        #languageBottomSheet {
            position: fixed;
            bottom: -100%;
            left: 0;
            width: 100%;
            height: 50vh;
            background: #2a2e35;
            border-top-left-radius: 24px;
            border-top-right-radius: 24px;
            box-shadow: 0 -10px 30px rgba(0,0,0,0.6);
            z-index: 1000000;
            transition: bottom 0.35s cubic-bezier(0.1, 0.9, 0.2, 1);
            display: flex;
            flex-direction: column;
            border: 1px solid rgba(255,255,255,0.08);
        }

        #languageBottomSheet.show {
            bottom: 0;
        }

        .lang-sheet-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 20px;
            border-bottom: 1px solid rgba(255,255,255,0.06);
            color: #ffffff;
            font-weight: 600;
        }

        .lang-sheet-close {
            background: transparent;
            border: none;
            color: #ffffff;
            font-size: 18px;
            cursor: pointer;
        }

        .lang-scroll-container {
            position: relative;
            flex-grow: 1;
            overflow-y: scroll;
            scroll-snap-type: y mandatory;
            padding: calc(50% - 21px) 0;
            scrollbar-width: none;
        }
        .lang-scroll-container::-webkit-scrollbar {
            display: none;
        }

        .lang-item {
            height: 42px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #8c96a5;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            scroll-snap-align: center;
            transition: color 0.2s ease, font-size 0.2s ease;
        }

        .lang-item.active-center {
            color: #ffffff !important;
            font-weight: 700;
            font-size: 15px;
        }

        .lang-sheet-footer {
            padding: 10px 20px 18px 20px;
            display: flex;
            justify-content: center;
            border-top: 1px solid rgba(255,255,255,0.06);
        }

        .lang-apply-btn {
            background: #ffffff;
            color: #000000;
            border: none;
            padding: 7px 0;
            width: 100%;
            max-width: 300px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            text-align: center;
        }

        .lang-apply-btn:active {
            opacity: 0.8;
        }

        #cacheToast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: #1f242d;
            color: #ffffff;
            padding: 10px 20px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
            border: 1px solid rgba(255,255,255,0.15);
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
            z-index: 2000000;
            white-space: nowrap;
        }
        #cacheToast.show {
            opacity: 1;
            visibility: visible;
            transform: translateX(-50%) translateY(0);
        }
    </style>
</head>

        window.addEventListener('DOMContentLoaded', () => {
            const savedLangCode = localStorage.getItem('plotcraft_lang_code') || 'ar';
            const savedLangName = localStorage.getItem('plotcraft_lang_name') || 'العربية';
            
            document.getElementById('currentLangDisplay').innerText = savedLangName;
            setAppLanguage(savedLangCode, false);

            // فحص حالة الدخول المخزنة عند تحميل التطبيق
            const savedLoginState = localStorage.getItem('plotcraft_logged_in') === 'true';
            if (savedLoginState) {
                renderUIState(true);
            }
        });

        function openSettingsScreen() {
            document.getElementById('settingsScreen').classList.add('show');
        }

        function closeSettingsScreen() {
            document.getElementById('settingsScreen').classList.remove('show');
        }

        /* عند الضغط على زر تسجيل الدخول من الإعدادات */
        function handleLoginAction() {
            window.authSource = 'settings';
            const authModal = document.getElementById('authModal');
            if (authModal) {
                authModal.classList.add('show');
                closeSettingsScreen();
            } else {
                // محاكاة سريعة عند إتمام الدخول
                onLoginSuccess("Ghassan ridha", "7842915");
            }
        }

        /* تستدعيها دالة تسجيل الدخول عند النجاح لإغلاق النافذة وتطبيق تصميم N.jpg المباشر */
        function onLoginSuccess(userName, userID) {
            localStorage.setItem('plotcraft_logged_in', 'true');
            if (userName) document.getElementById('displayUserName').innerText = userName;
            if (userID) document.getElementById('displayUserID').innerText = userID;

            renderUIState(true);
            closeAuthModal();
        }

        /* دالة الإغلاق الذكية الخاصة بنافذة تسجيل الدخول */
        function closeAuthModal() {
            const authModal = document.getElementById('authModal');
            if (authModal) {
                authModal.classList.remove('show');
            }

            if (window.authSource === 'settings') {
                openSettingsScreen();
                window.authSource = null;
            } else if (window.authSource === 'subscription') {
                const subModal = document.getElementById('subscriptionModal');
                if (subModal) {
                    subModal.style.display = 'flex';
                    setTimeout(() => subModal.classList.add('show'), 10);
                }
                window.authSource = null;
            }
        }

        /* دالة التبديل بين التصميم القديم G2.jpg والتصميم الجديد N.jpg */
        function renderUIState(loggedIn) {
            isUserLoggedIn = loggedIn;
            const settingsScreen = document.getElementById('settingsScreen');
            const loginBtn = document.getElementById('btnLoginText');
            const profileBox = document.getElementById('profileBox');
            const loggedInElements = document.querySelectorAll('.loggedIn-only');

            if (loggedIn) {
                // تفعيل التصميم الجديد N.jpg
                settingsScreen.classList.add('logged-in');
                loginBtn.style.display = 'none';
                profileBox.style.display = 'flex';
                loggedInElements.forEach(el => el.style.display = 'flex');
            } else {
                // العودة للتصميم القديم G2.jpg
                settingsScreen.classList.remove('logged-in');
                loginBtn.style.display = 'flex';
                profileBox.style.display = 'none';
                loggedInElements.forEach(el => el.style.display = 'none');
            }
        }

        /* نسخ الـ ID المكون من 7 أرقام */
        function copyUserID() {
            const idText = document.getElementById('displayUserID').innerText;
            navigator.clipboard.writeText(idText).then(() => {
                showToast("تم نسخ ID بنجاح");
            });
        }

        /* تسجيل الخروج وإعادة الواجهة إلى التصميم القديم G2.jpg */
        function handleLogoutAction() {
            localStorage.setItem('plotcraft_logged_in', 'false');
            renderUIState(false);
            showToast("تم تسجيل الخروج");
        }

        function showToast(msg) {
            const toast = document.getElementById('cacheToast');
            toast.innerText = msg;
            toast.classList.add('show');
            setTimeout(() => { toast.classList.remove('show'); }, 2000);
        }

        function toggleNotifications() {
            isNotifActive = !isNotifActive;
            const toggle = document.getElementById('notifToggle');
            if (isNotifActive) {
                toggle.classList.add('active');
            } else {
                toggle.classList.remove('active');

        function clearCacheAction() {
            const lang = localStorage.getItem('plotcraft_lang_code') || 'ar';
            showToast(translations[lang] ? translations[lang].toast : translations['ar'].toast);
        }

        function openLanguageSheet() {
            document.getElementById('languageBottomSheet').classList.add('show');
            setTimeout(() => {
                const container = document.getElementById('langScrollContainer');
                const items = container.querySelectorAll('.lang-item');
                const currentName = document.getElementById('currentLangDisplay').innerText;
                items.forEach(item => {
                    if(item.getAttribute('data-name') === currentName) {
                        container.scrollTop = item.offsetTop - container.clientHeight / 2 + item.clientHeight / 2;
                    }
                });
                updateCenterLanguageHighlight();
            }, 50);
        }

        function closeLanguageSheet() {
            document.getElementById('languageBottomSheet').classList.remove('show');
        }

        function updateCenterLanguageHighlight() {
            const container = document.getElementById('langScrollContainer');
            const items = container.querySelectorAll('.lang-item');
            const containerCenter = container.scrollTop + container.clientHeight / 2;

            items.forEach(item => {
                const itemCenter = item.offsetTop + item.offsetHeight / 2;
                const distance = Math.abs(containerCenter - itemCenter);
                if (distance < 25) {
                    item.classList.add('active-center');
                } else {
                    item.classList.remove('active-center');
                }
            });
        }

        function applySelectedLanguage() {
            const container = document.getElementById('langScrollContainer');
            const items = container.querySelectorAll('.lang-item');
            const containerCenter = container.scrollTop + container.clientHeight / 2;
            let closestItem = items[0];
            let minDistance = Infinity;

            items.forEach(item => {
                const itemCenter = item.offsetTop + item.offsetHeight / 2;
                const distance = Math.abs(containerCenter - itemCenter);
                if (distance < minDistance) {
                    minDistance = distance;
                    closestItem = item;
                }
            });

            if (closestItem) {
                const code = closestItem.getAttribute('data-code');
                const name = closestItem.getAttribute('data-name');
                
                document.getElementById('currentLangDisplay').innerText = name;
                
                localStorage.setItem('plotcraft_lang_code', code);
                localStorage.setItem('plotcraft_lang_name', name);

                setAppLanguage(code, true);
                closeLanguageSheet();
            }
        }

        function setAppLanguage(code, animate) {
            const t = translations[code] || translations['ar'];
            
            document.getElementById('pageTitle').innerText = t.title;
            document.getElementById('btnLoginText').innerText = t.login;
            document.getElementById('txtNotif').innerText = t.notif;
            document.getElementById('txtLangTitle').innerText = t.langTitle;
            document.getElementById('txtJoin').innerText = t.join;
            document.getElementById('txtContact').innerText = t.contact;
            document.getElementById('txtSettings').innerText = t.settings;
            document.getElementById('txtClearCache').innerText = t.clearCache;
            document.getElementById('txtSheetLangTitle').innerText = t.sheetTitle;
            document.getElementById('txtApplyBtn').innerText = t.apply;

            if (code === 'en' || code === 'fr' || code === 'es' || code === 'de' || code === 'tr' || code === 'ru') {
                document.getElementById('appHtml').setAttribute('dir', 'ltr');
                document.getElementById('appHtml').setAttribute('lang', code);
            } else if (code === 'zh' || code === 'ja') {
                document.getElementById('appHtml').setAttribute('dir', 'ltr');
                document.getElementById('appHtml').setAttribute('lang', code);
            } else {
                document.getElementById('appHtml').setAttribute('dir', 'rtl');
                document.getElementById('appHtml').setAttribute('lang', 'ar');
            }
        }
    </script>
