<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الإعدادات - PlotCraft</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #000;
            overflow: hidden;
        }

        /* حاوية الشاشة مع الخلفية (مخفية افتراضياً ولن تظهر عند بدء التطبيق) */
        .settings-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: url('https://raw.githubusercontent.com/Ghassanridha/PlotCraft/3c0d837613bae10a387c91a8a059563aa7cccd10/Ghas.jpg') center/100% 100% no-repeat;
            z-index: 999999;
            direction: rtl;
            transform: translateX(-100vw);
            transition: transform 0.3s ease-out;
            visibility: hidden;
            overflow: hidden;
        }

        .settings-screen.show {
            visibility: visible;
            transform: translateX(0);
        }

        .click-overlay-container {
            position: relative;
            width: 100%;
            max-width: 480px;
            height: 100vh;
            margin: 0 auto;
        }

        .clickable-area {
            position: absolute;
            cursor: pointer;
            z-index: 50;
        }

        /* زر علامة X المرفوع للأعلى */
        .btn-close-x {
            position: absolute;
            top: 10px;
            right: 18px;
            background: transparent;
            border: none;
            color: #9ca3af;
            font-size: 24px;
            font-weight: 300;
            cursor: pointer;
            z-index: 999;
            padding: 5px;
        }

        .btn-close-x:hover {
            color: #ffffff;
        }

        /* مناطق النقر الأساسية */
        .banner-link {
            top: 70px;
            left: 4%;
            width: 92%;
            height: 130px;
        }

        .link-points {
            top: 215px;
            left: 4%;
            width: 92%;
            height: 55px;
        }

        .link-feedback {
            top: 275px;
            left: 4%;
            width: 92%;
            height: 55px;
        }

        .toggle-notifications {
            top: 350px;
            right: 15px;
            width: 50px;
            height: 30px;
        }

        .link-language {
            top: 395px;
            left: 4%;
            width: 92%;
            height: 55px;
        }

        .link-join {
            top: 455px;
            left: 4%;
            width: 92%;
            height: 55px;
        }

        .link-contact {
            top: 515px;
            left: 4%;
            width: 92%;
            height: 55px;
        }

        .link-sub-settings {
            top: 590px;
            left: 4%;
            width: 92%;
            height: 55px;
        }

        .link-clear-cache {
            top: 545px;
            left: 4%;
            width: 92%;
            height: 55px;
        }
    </style>
</head>
<body>

    <!-- تم إزالة الكلاس show من هنا لكي تبدأ الشاشة مخفية وتظهر الواجهة الرئيسية أولاً -->
    <div id="settingsScreen" class="settings-screen">
        <div class="click-overlay-container">
            
            <!-- زر إغلاق (X) المرفوع للأعلى -->
            <button class="btn-close-x" onclick="closeSettingsScreen()">&times;</button>
            
            <!-- أزرارك الأصلية النظيفة -->
            <a href="#" class="clickable-area banner-link" onclick="handleAction('banner'); return false;"></a>
            <a href="#" class="clickable-area link-points" onclick="handleAction('points'); return false;"></a>
            <a href="#" class="clickable-area link-feedback" onclick="handleAction('feedback'); return false;"></a>
            
            <div class="clickable-area toggle-notifications" onclick="toggleNotifications()"></div>
            
            <a href="#" class="clickable-area link-language" onclick="handleAction('language'); return false;"></a>
            <a href="#" class="clickable-area link-join" onclick="handleAction('join'); return false;"></a>
            <a href="#" class="clickable-area link-contact" onclick="handleAction('contact'); return false;"></a>
            <a href="#" class="clickable-area link-sub-settings" onclick="handleAction('sub-settings'); return false;"></a>
            <a href="#" class="clickable-area link-clear-cache" onclick="clearCacheAction(); return false;"></a>

        </div>
    </div>

    <script>
        // دالة لإظهار شاشة الإعدادات عندما تحتاجها (مثلاً عند الضغط على زر الإعدادات في الواجهة الرئيسية)
        function openSettingsScreen() {
            const screen = document.getElementById('settingsScreen');
            if (screen) {
                screen.classList.add('show');
            }
        }

        function closeSettingsScreen() {
            const screen = document.getElementById('settingsScreen');
            if (screen) {
                screen.classList.remove('show');
            }
        }

        function handleAction(type) {
            console.log("تم الضغط على: " + type);
        }

        function toggleNotifications() {
            console.log("تم تغيير حالة الإشعارات");
        }

        function clearCacheAction() {
            console.log("تم مسح الذاكرة المؤقتة");
        }
    </script>
</body>
</html>
