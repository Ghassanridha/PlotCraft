<!DOCTYPE html>
<html lang="ar" dir="rtl" id="appHtml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">الإعدادات - PlotCraft</title>
    
    <!-- التحميل المسبق للخلفيات بالروابط المباشرة المتطابقة 100% -->
    <link rel="preload" as="image" href="https://raw.githubusercontent.com/Ghassanridha/PlotCraft/87ec5eff439c8c227933258a0e1738538ab7d07b/G2.jpg">
    <link rel="preload" as="image" href="https://raw.githubusercontent.com/Ghassanridha/PlotCraft/4d6212dde00d8debb396a53e5d3cec625ce3f8e0/N.jpg">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #000;
            overflow: hidden;
        }

        /* 1️⃣ التصميم القديم (حالة الزائر) */
        .settings-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: url('https://raw.githubusercontent.com/Ghassanridha/PlotCraft/87ec5eff439c8c227933258a0e1738538ab7d07b/G2.jpg') center/100% 100% no-repeat;
            z-index: 999999;
            direction: inherit;
            transform: translateX(-100vw);
            transition: transform 0.3s ease-out;
            visibility: hidden;
            overflow-y: auto;
        }

        /* 2️⃣ التصميم الجديد (يظهر فور تسجيل الدخول بنفس صيغة الرابط القديم المضمونة) */
        .settings-screen.logged-in {
            background: url('https://raw.githubusercontent.com/Ghassanridha/PlotCraft/4d6212dde00d8debb396a53e5d3cec625ce3f8e0/N.jpg') center/100% 100% no-repeat;
        }

        .settings-screen.show {
            visibility: visible;
            transform: translateX(0);
        }

        .settings-container {
            position: relative;
            width: 100%;
            max-width: 480px;
            margin: 0 auto;
            padding: 10px 24px 20px 24px;
            display: flex;
            flex-direction: column;
        }

        .settings-header {
            display: flex;
            justify-content: flex-start;
            align-items: center;
            padding: 2px 0;
            position: relative;
            z-index: 20;
        }

        .btn-back {
            background: transparent;
            border: none;
            color: #ffffff;
            font-size: 18px;
            cursor: pointer;
            padding: 6px 12px;
            position: relative;
            z-index: 25;
        }

        .btn-login-overlay {
            position: absolute;
            top: 76px;
            left: 8px;
            width: 125px;
            height: 42px;
            background: transparent;
            border: none;
            color: #000000;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }

        .btn-login-overlay:active {
            opacity: 0.6;
        }

        .group-middle {
            margin-top: 135px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .group-bottom {
            margin-top: 48px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .setting-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 44px;
            padding: 0 8px;
            color: #ffffff;
            text-decoration: none;
            cursor: pointer;
        }

        .setting-item:active {
            opacity: 0.7;
        }

        .setting-right {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 15px;
            font-weight: 500;
        }

        .icon-svg {
            width: 22px;
            height: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .setting-left {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #94a3b8;
            font-size: 13px;
        }

        .arrow-icon {
            color: #ffffff;
            font-size: 14px;
        }

        .toggle-switch {
            width: 44px;
            height: 24px;
            background: #475569;
            border-radius: 12px;
            position: relative;
            cursor: pointer;
            transition: background 0.3s;
        }

        .toggle-switch::after {
            content: '';
            position: absolute;
            top: 2px;
            right: 2px;
            width: 20px;
            height: 20px;
            background: #ffffff;
            border-radius: 50%;
            transition: transform 0.3s;
        }

        .toggle-switch.active {
            background: #3b82f6;
        }

        .toggle-switch.active::after {
            transform: translateX(-20px);
        }

        .loggedIn-only {
            display: none !important;
        }

        .settings-screen.logged-in .loggedIn-only {
            display: flex !important;
        }

        #languageBottomSheet {
            position: fixed;
            bottom: -100%;
            left: 0;
            width: 100%;
            height: 50vh;
            background: #2a2e35;
            border-top-left-radius: 24px;
            border-top-right-radius: 24px;
            box-shadow: 0 -10px 30px rgba(0,0,0,0.6);
            z-index: 1000000;
            transition: bottom 0.35s cubic-bezier(0.1, 0.9, 0.2, 1);
            display: flex;
            flex-direction: column;
            border: 1px solid rgba(255,255,255,0.08);
        }

        #languageBottomSheet.show {
            bottom: 0;
        }

        .lang-sheet-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 20px;
            border-bottom: 1px solid rgba(255,255,255,0.06);
            color: #ffffff;
            font-weight: 600;
        }

        .lang-sheet-close {
            background: transparent;
            border: none;
            color: #ffffff;
            font-size: 18px;
            cursor: pointer;
        }

        .lang-scroll-container {
            position: relative;
            flex-grow: 1;
            overflow-y: scroll;
            scroll-snap-type: y mandatory;
            padding: calc(50% - 21px) 0;
            scrollbar-width: none;
        }
        .lang-scroll-container::-webkit-scrollbar {
            display: none;
        }

        .lang-item {
            height: 42px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #8c96a5;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            scroll-snap-align: center;
            transition: color 0.2s ease, font-size 0.2s ease;
        }

        .lang-item.active-center {
            color: #ffffff !important;
            font-weight: 700;
            font-size: 15px;
        }

        .lang-sheet-footer {
            padding: 10px 20px 18px 20px;
            display: flex;
            justify-content: center;
            border-top: 1px solid rgba(255,255,255,0.06);
        }

        .lang-apply-btn {
            background: #ffffff;
            color: #000000;
            border: none;
            padding: 7px 0;
            width: 100%;
            max-width: 300px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            text-align: center;
        }

        #cacheToast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: #1f242d;
            color: #ffffff;
            padding: 10px 20px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
            border: 1px solid rgba(255,255,255,0.15);
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
            z-index: 2000000;
            white-space: nowrap;
        }
        #cacheToast.show {
            opacity: 1;
            visibility: visible;
            transform: translateX(-50%) translateY(0);
        }
    </style>
</head>
<body>

    <div id="settingsScreen" class="settings-screen">
        <div class="settings-container">
            
            <div class="settings-header">
                <button class="btn-back" onclick="closeSettingsScreen()">&#10095;</button>
            </div>

            <!-- زر تسجيل الدخول يظهر فقط للزائر -->
            <button class="btn-login-overlay" id="btnLoginText" onclick="handleLoginAction()">تسجيل الدخول</button>

            <div class="group-middle">
                <div class="setting-item" onclick="toggleNotifications()">
                    <div class="setting-right">
                        <span class="icon-svg">
                            <svg width="22" height="22" viewBox="0 0 24 24" fill="#ffffff"><path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.9 2 2 2zm6-6v-5c0-3.07-1.63-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.64 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z"/></svg>
                        </span>
                        <span id="txtNotif">الإشعارات</span>
                    </div>
                    <div class="toggle-switch" id="notifToggle"></div>
                </div>

                <div class="setting-item" onclick="openLanguageSheet()">
                    <div class="setting-right">
                        <span class="icon-svg">
                            <svg width="22" height="22" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#ffffff" /><path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10z" fill="none" stroke="#000000" stroke-width="1.5"/></svg>
                        </span>
                        <span id="txtLangTitle">اللغة</span>
                    </div>
                    <div class="setting-left">
                        <span id="currentLangDisplay">العربية</span>
                        <span class="arrow-icon">&#10094;</span>
                    </div>
                </div>

                <div class="setting-item" onclick="window.open('https://t.me/G_ri63', '_blank')">
                    <div class="setting-right">
                        <span class="icon-svg">
                            <svg width="22" height="22" viewBox="0 0 24 24" fill="#ffffff"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
                        </span>
                        <span>انضم إلينا</span>
                    </div>
                    <span class="arrow-icon">&#10094;</span>
                </div>

                <div class="setting-item" onclick="window.location.href='mailto:support@plotcraft.com'">
                    <div class="setting-right">
                        <span class="icon-svg">
                            <svg width="22" height="22" viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" rx="3" fill="#ffffff"/><path d="M22 6l-10 7L2 6" fill="none" stroke="#000000" stroke-width="1.5"/></svg>
                        </span>
                        <span>اتصل بنا</span>
                    </div>
                    <span class="arrow-icon">&#10094;</span>
                </div>
            </div>

            <div class="group-bottom">
                <div class="setting-item" onclick="showToast('الإعدادات الفرعية')">
                    <div class="setting-right">
                        <span class="icon-svg">
                            <svg width="22" height="22" viewBox="0 0 24 24" fill="#ffffff"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
                        </span>
                        <span>الإعدادات</span>
                    </div>
                    <span class="arrow-icon">&#10094;</span>
                </div>

                <div class="setting-item" onclick="showToast('تم مسح الذاكرة المؤقتة بنجاح')">
                    <div class="setting-right">
                        <span class="icon-svg">
                            <svg width="22" height="22" viewBox="0 0 24 24" fill="#ffffff"><path d="M15 16h4v2h-4zm0-8h7v2h-7zm0 4h6v2h-6zM3 18c0 1.1.9 2 2 2h6c1.1 0 2-.9 2-2V8H3v10zM14 5h-3l-1-1H6L5 5H2v2h12z"/></svg>
                        </span>
                        <span>مسح الذاكرة المؤقتة</span>
                    </div>
                    <div class="setting-left">
                        <span>MB 131.48</span>
                    </div>
                </div>

                <!-- زر تسجيل الخروج يظهر فقط عند تسجيل الدخول -->
                <div class="setting-item loggedIn-only" onclick="handleLogoutAction()" style="color: #ef4444;">
                    <div class="setting-right">
                        <span class="icon-svg">
                            <svg width="22" height="22" viewBox="0 0 24 24" fill="#ef4444"><path d="M17 7l-1.41 1.41L18.17 11H8v2h10.17l-2.58 2.58L17 17l5-5zM4 5h8V3H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h8v-2H4V5z"/></svg>
                        </span>
                        <span>تسجيل الخروج</span>
                    </div>
                    <span class="arrow-icon" style="color: #ef4444;">&#10094;</span>
                </div>
            </div>

        </div>
    </div>

    <!-- نافذة اختيار اللغات -->
    <div id="languageBottomSheet">
        <div class="lang-sheet-header">
            <span id="txtSheetLangTitle">اللغة</span>
            <button class="lang-sheet-close" onclick="closeLanguageSheet()">&#x2715;</button>
        </div>
        <div class="lang-scroll-container" id="langScrollContainer">
            <div class="lang-item">العربية</div>
            <div class="lang-item">English</div>
        </div>
        <div class="lang-sheet-footer">
            <button class="lang-apply-btn" onclick="closeLanguageSheet()">تطبيق</button>
        </div>
    </div>

    <div id="cacheToast">تم المسح بنجاح</div>

    <script>
        let isNotifActive = false;

        window.addEventListener('DOMContentLoaded', () => {
            checkLoginState();
        });

        window.addEventListener('storage', (event) => {
            if (event.key === 'plotcraft_logged_in') {
                checkLoginState();
            }
        });

        function checkLoginState() {
            const isLogged = localStorage.getItem('plotcraft_logged_in') === 'true';
            renderUIState(isLogged);
        }

        function openSettingsScreen() {
            document.getElementById('settingsScreen').classList.add('show');
            checkLoginState();
        }

        function closeSettingsScreen() {
            document.getElementById('settingsScreen').classList.remove('show');
        }

        function handleLoginAction() {
            window.authSource = 'settings';
            const authModal = document.getElementById('authModal');
            if (authModal) {
                authModal.classList.add('show');
                closeSettingsScreen();
            } else {
                onLoginSuccess();
            }
        }

        function onLoginSuccess() {
            localStorage.setItem('plotcraft_logged_in', 'true');
            renderUIState(true);
            closeAuthModal();
        }

        function handleLogoutAction() {
            localStorage.setItem('plotcraft_logged_in', 'false');
            renderUIState(false);
            showToast("تم تسجيل الخروج بنجاح");
        }

        function renderUIState(loggedIn) {
            const settingsScreen = document.getElementById('settingsScreen');
            if (loggedIn) {
                settingsScreen.classList.add('logged-in');
            } else {
                settingsScreen.classList.remove('logged-in');
            }
        }

        function closeAuthModal() {
            const authModal = document.getElementById('authModal');
            if (authModal) authModal.classList.remove('show');

            if (window.authSource === 'settings') {
                openSettingsScreen();
                window.authSource = null;
            } else if (window.authSource === 'subscription') {
                const subModal = document.getElementById('subscriptionModal');
                if (subModal) {
                    subModal.style.display = 'flex';
                    setTimeout(() => subModal.classList.add('show'), 10);
                }
                window.authSource = null;
            }
        }

        function toggleNotifications() {
            isNotifActive = !isNotifActive;
            const toggle = document.getElementById('notifToggle');
            if (toggle) {
                if (isNotifActive) toggle.classList.add('active');
                else toggle.classList.remove('active');
            }
        }

        function showToast(msg) {
            const toast = document.getElementById('cacheToast');
            toast.innerText = msg;
            toast.classList.add('show');
            setTimeout(() => { toast.classList.remove('show'); }, 2000);
        }

        function openLanguageSheet() {
            document.getElementById('languageBottomSheet').classList.add('show');
        }

        function closeLanguageSheet() {
            document.getElementById('languageBottomSheet').classList.remove('show');
        }
    </script>
</body>
</html>
