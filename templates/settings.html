<!DOCTYPE html>
<html lang="ar" dir="rtl" id="appHtml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">الإعدادات - PlotCraft</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #000;
            overflow: hidden;
        }

        /* خلفية G2.jpg الأساسية */
        .settings-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: url('https://raw.githubusercontent.com/Ghassanridha/PlotCraft/87ec5eff439c8c227933258a0e1738538ab7d07b/G2.jpg') center/100% 100% no-repeat;
            z-index: 999999;
            direction: inherit;
            transform: translateX(-100vw);
            transition: transform 0.3s ease-out;
            visibility: hidden;
            overflow-y: auto;
        }

        /* خلفية N.jpg الجديدة: العرض 100% ثابت والارتفاع تلقائي ومسحوبة شوية لفوق */
        .settings-screen.email-logged-in {
            background-color: #121418;
            background-image: url('https://raw.githubusercontent.com/Ghassanridha/PlotCraft/8d079cab8f84b7524e5d87ffa43f7644affb47f6/N.jpg');
            background-position: center 6px;
            background-size: 100% auto;
            background-repeat: no-repeat;
        }

        /* إخفاء عناصر الإعدادات القديمة بالكامل عند ظهور التصميم الجديد N.jpg */
        .settings-screen.email-logged-in .btn-login-overlay,
        .settings-screen.email-logged-in .group-middle,
        .settings-screen.email-logged-in .group-bottom {
            display: none !important;
        }

        /* حاوية الأزرار فوق التصميم الجديد N.jpg */
        .email-ui-layer {
            display: none;
            position: relative;
            width: 100%;
            min-height: 100%;
        }

        .settings-screen.email-logged-in .email-ui-layer {
            display: block;
        }

        /* اسم المستخدم بمحاذاة مستطيل الآيدي دون أن يعبره */
        .user-name-display {
            position: absolute;
            top: 22px;
            right: 64px;
            color: #ffffff;
            font-size: 15.5px;
            font-weight: 700;
            line-height: 1.2;
            white-space: nowrap;
            pointer-events: none;
            z-index: 20;
        }

        /* زر القلم لتعديل الاسم على مسافة مناسبة من الاسم */
        .btn-edit-name-overlay {
            position: absolute;
            top: 20px;
            right: 195px;
            width: 30px;
            height: 28px;
            background: transparent;
            border: none;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 20;
        }

        /* حاوية المستطيل الصغير للآيدي */
        .user-id-display-overlay {
            position: relative;
            width: 100%;
            height: 0;
            pointer-events: none;
            z-index: 20;
        }

        /* كلمة ID: محركة شوية لليسار */
        .user-id-label {
            position: absolute;
            top: 52px;
            right: 70px;
            color: #ffffff;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.3px;
            line-height: 1;
        }

        /* أرقام الآيدي: ثابتة دون أي تحريك */
        .user-id-value {
            position: absolute;
            top: 52px;
            right: 84px;
            color: #f1f5f9;
            font-size: 12.5px;
            font-weight: 700;
            letter-spacing: 0.4px;
            line-height: 1;
        }

        /* زر نسخ الآيدي: محرك قليل لليسار */
        .btn-copy-id-overlay {
            position: absolute;
            top: 46px;
            right: 142px;
            width: 26px;
            height: 24px;
            background: transparent;
            border: none;
            color: #e2e8f0;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 20;
        }

        /* المستطيل الأول: سجل النقاط ، التعليقات */
        .card1-group {
            position: absolute;
            top: 96px;
            left: 10px;
            right: 10px;
            display: flex;
            flex-direction: column;
            gap: 0px;
            z-index: 15;
        }

        .row-points-n {
            transform: translateY(-4px);
            height: 46px;
        }

        .row-comments-n {
            transform: translateY(-6px);
            height: 46px;
        }

        /* المستطيل الثاني: الإشعارات ، اللغة ، انضم إلينا ، اتصل بنا */
        .card2-group {
            position: absolute;
            top: 234px;
            left: 10px;
            right: 10px;
            display: flex;
            flex-direction: column;
            z-index: 15;
        }

        .row-notif-n {
            transform: translateY(-16px);
            height: 44px;
        }

        .row-lang-n {
            transform: translateY(-16px);
            height: 48px;
        }

        .row-join-n {
            transform: translateY(-13px);
            height: 46px;
        }

        .row-contact-n {
            transform: translateY(0px);
            height: 52px;
        }

        /* المستطيل الثالث: الإعدادات ، مسح الذاكرة المؤقتة */
        .card3-group {
            position: absolute;
            top: 486px;
            left: 10px;
            right: 10px;
            display: flex;
            flex-direction: column;
            z-index: 15;
        }

        .row-settings-n {
            transform: translateY(0px);
            height: 52px;
        }

        /* الأزرار مسحوبة أكثر لليمين للطرف، والأسهم مسحوبة أكثر لليسار للطرف */
        .n-row-btn {
            width: 100%;
            height: 52px;
            background: transparent;
            border: none;
            padding: 0 2px;
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: space-between;
            color: #ffffff;
            cursor: pointer;
        }

        .n-row-btn:active {
            opacity: 0.7;
        }

        .n-row-right {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 15px;
            font-weight: 500;
            flex-shrink: 0;
        }

        .n-lang-text-wrap {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            line-height: 1.25;
        }

        .n-lang-sub {
            font-size: 12px;
            color: #cbd5e1;
            font-weight: 400;
        }

        .n-row-left {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #cbd5e1;
            font-size: 13px;
            flex-shrink: 0;
        }

        .n-row-btn > .arrow-icon {
            flex-shrink: 0;
        }

        /* نافذة صغيرة لتغيير اسم المستخدم عند النقر على القلم */
        #editNameModal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.75);
            z-index: 1500000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        #editNameModal.show {
            display: flex;
        }

        .edit-name-box {
            width: 100%;
            max-width: 340px;
            background: #23272f;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 16px;
            padding: 18px;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .edit-name-box input {
            width: 100%;
            padding: 10px 12px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.18);
            background: #14171d;
            color: #ffffff;
            font-size: 14px;
            outline: none;
        }

        .edit-name-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }

        .edit-name-actions button {
            padding: 8px 16px;
            border-radius: 10px;
            border: none;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
        }

        .btn-save-name {
            background: #ffffff;
            color: #000000;
        }

        .btn-cancel-name {
            background: #3a404a;
            color: #ffffff;
        }

        /* منع ظهور نافذة تسجيل الدخول بالبريد إذا كان المستخدم مسجلاً دخوله */
        body.email-already-logged-in #authModal {
            display: none !important;
            visibility: hidden !important;
            opacity: 0 !important;
        }

        .settings-screen.show {
            visibility: visible;
            transform: translateX(0);
        }

        .settings-container {
            position: relative;
            width: 100%;
            max-width: 480px;
            margin: 0 auto;
            padding: 10px 24px 20px 24px;
            display: flex;
            flex-direction: column;
        }

        /* زر العودة العلوي */
        .settings-header {
            display: flex;
            justify-content: flex-start;
            align-items: center;
            padding: 2px 0;
            position: relative;
            z-index: 20;
        }

        html[dir="ltr"] .settings-header {
            flex-direction: row-reverse;
        }

        .btn-back {
            background: transparent;
            border: none;
            color: #ffffff;
            font-size: 18px;
            cursor: pointer;
            padding: 6px 12px;
            position: relative;
            z-index: 25;
        }

        /* زر تسجيل الدخول المرفوع والمعدل الموضع */
        .btn-login-overlay {
            position: absolute;
            top: 76px;
            left: 8px;
            width: 125px;
            height: 42px;
            background: transparent;
            border: none;
            color: #000000;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }

        html[dir="ltr"] .btn-login-overlay {
            left: auto;
            right: 8px;
        }

        .btn-login-overlay:active {
            opacity: 0.6;
        }

        /* المربع الأول (المستطيل الأوسط) */
        .group-middle {
            margin-top: 135px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .group-middle .setting-item:first-child {
            margin-top: -12px;
        }

        /* المربع الثاني (المستطيل السفلي) */
        .group-bottom {
            margin-top: 48px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .group-bottom .setting-item:first-child {
            margin-top: 0px;
        }

        .setting-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 44px;
            padding: 0 8px;
            color: #ffffff;
            text-decoration: none;
            cursor: pointer;
        }

        .setting-item:active {
            opacity: 0.7;
        }

        .setting-right {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 15px;
            font-weight: 500;
        }

        html[dir="ltr"] .setting-right {
            flex-direction: row;
        }

        .icon-svg {
            width: 22px;
            height: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .setting-left {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #94a3b8;
            font-size: 13px;
        }

        .arrow-icon {
            color: #ffffff;
            font-size: 14px;
        }

        html[dir="ltr"] .arrow-icon {
            transform: scaleX(-1);
        }

        /* زر التبديل للإشعارات */
        .toggle-switch {
            width: 44px;
            height: 24px;
            background: #475569;
            border-radius: 12px;
            position: relative;
            cursor: pointer;
            transition: background 0.3s;
            flex-shrink: 0;
        }

        .toggle-switch::after {
            content: '';
            position: absolute;
            top: 2px;
            right: 2px;
            width: 20px;
            height: 20px;
            background: #ffffff;
            border-radius: 50%;
            transition: transform 0.3s;
        }

        html[dir="ltr"] .toggle-switch::after {
            right: auto;
            left: 2px;
        }

        .toggle-switch.active {
            background: #3b82f6;
        }

        .toggle-switch.active::after {
            transform: translateX(-20px);
        }

        html[dir="ltr"] .toggle-switch.active::after {
            transform: translateX(20px);
        }

        /* نافذة اختيار اللغات السفلية بلون رمادي داكن مطفأ */
        #languageBottomSheet {
            position: fixed;
            bottom: -100%;
            left: 0;
            width: 100%;
            height: 50vh;
            background: #2a2e35;
            border-top-left-radius: 24px;
            border-top-right-radius: 24px;
            box-shadow: 0 -10px 30px rgba(0,0,0,0.6);
            z-index: 1000000;
            transition: bottom 0.35s cubic-bezier(0.1, 0.9, 0.2, 1);
            display: flex;
            flex-direction: column;
            border: 1px solid rgba(255,255,255,0.08);
        }

        #languageBottomSheet.show {
            bottom: 0;
        }

        .lang-sheet-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 20px;
            border-bottom: 1px solid rgba(255,255,255,0.06);
            color: #ffffff;
            font-weight: 600;
        }

        .lang-sheet-close {
            background: transparent;
            border: none;
            color: #ffffff;
            font-size: 18px;
            cursor: pointer;
        }

        .lang-scroll-container {
            position: relative;
            flex-grow: 1;
            overflow-y: scroll;
            scroll-snap-type: y mandatory;
            padding: calc(50% - 21px) 0;
            scrollbar-width: none;
        }
        .lang-scroll-container::-webkit-scrollbar {
            display: none;
        }

        .lang-item {
            height: 42px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #8c96a5;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            scroll-snap-align: center;
            transition: color 0.2s ease, font-size 0.2s ease;
        }

        .lang-item.active-center {
            color: #ffffff !important;
            font-weight: 700;
            font-size: 15px;
        }

        .lang-sheet-footer {
            padding: 10px 20px 18px 20px;
            display: flex;
            justify-content: center;
            border-top: 1px solid rgba(255,255,255,0.06);
        }

        .lang-apply-btn {
            background: #ffffff;
            color: #000000;
            border: none;
            padding: 7px 0;
            width: 100%;
            max-width: 300px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            text-align: center;
        }

        .lang-apply-btn:active {
            opacity: 0.8;
        }

        #cacheToast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: #1f242d;
            color: #ffffff;
            padding: 10px 20px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
            border: 1px solid rgba(255,255,255,0.15);
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
            z-index: 2000000;
            white-space: nowrap;
        }
        #cacheToast.show {
            opacity: 1;
            visibility: visible;
            transform: translateX(-50%) translateY(0);
        }
    </style>
</head>
<body>

    <div id="settingsScreen" class="settings-screen">
        <div class="settings-container">
            
            <!-- زر العودة العلوي -->
            <div class="settings-header">
                <button class="btn-back" onclick="closeSettingsScreen()">&#10095;</button>
            </div>

            <!-- الأزرار فوق التصميم الجديد N.jpg بالترتيب -->
            <div class="email-ui-layer">
                <!-- اسم المستخدم ظاهر فوق الآيدي -->
                <span class="user-name-display" id="userNameValue"></span>

                <!-- زر القلم لتعديل الاسم -->
                <button type="button" class="btn-edit-name-overlay" id="editNameBtn" onclick="openEditNameModal()" aria-label="تعديل الاسم">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04a1.003 1.003 0 0 0 0-1.42l-2.34-2.34a1.003 1.003 0 0 0-1.42 0l-1.83 1.83 3.75 3.75 1.84-1.82z"/>
                    </svg>
                </button>

                <!-- المستطيل الصغير للآيدي: كلمة ID وأرقام الآيدي -->
                <div class="user-id-display-overlay" id="userIdBox">
                    <span class="user-id-label">ID</span>
                    <span class="user-id-value" id="userIdValue"></span>
                </div>

                <!-- زر نسخ الآيدي بجانب المستطيل الصغير -->
                <button type="button" class="btn-copy-id-overlay" id="copyIdBtn" onclick="copyUserId()" aria-label="نسخ الآيدي">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="9" y="9" width="13" height="13" rx="2"/>
                        <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
                    </svg>
                </button>

                <!-- المستطيل الأول: 1. سجل النقاط | 2. التعليقات -->
                <div class="card1-group">
                    <button type="button" class="n-row-btn row-points-n" onclick="handlePointsHistory()">
                        <span class="n-row-right">
                            <span class="icon-svg">✦</span>
                            <span id="nTxtPoints">سجل النقاط</span>
                        </span>
                        <span class="arrow-icon">&#10094;</span>
                    </button>

                    <button type="button" class="n-row-btn row-comments-n" onclick="handleComments()">
                        <span class="n-row-right">
                            <span class="icon-svg">💬</span>
                            <span id="nTxtComments">التعليقات</span>
                        </span>
                        <span class="arrow-icon">&#10094;</span>
                    </button>
                </div>

                <!-- المستطيل الثاني: 1. الإشعارات | 2. اللغة | 3. انضم إلينا | 4. اتصل بنا -->
                <div class="card2-group">
                    <button type="button" class="n-row-btn row-notif-n" onclick="toggleNotifications()">
                        <span class="n-row-right">
                            <span class="icon-svg">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="#ffffff">
                                    <path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.9 2 2 2zm6-6v-5c0-3.07-1.63-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.64 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z"/>
                                </svg>
                            </span>
                            <span id="nTxtNotif">الإشعارات</span>
                        </span>
                        <span class="toggle-switch" id="nNotifToggle"></span>
                    </button>

                    <button type="button" class="n-row-btn row-lang-n" onclick="openLanguageSheet()">
                        <span class="n-row-right">
                            <span class="icon-svg">
                                <svg width="20" height="20" viewBox="0 0 24 24">
                                    <circle cx="12" cy="12" r="10" fill="#ffffff"/>
                                    <line x1="5" y1="19" x2="19" y2="5" stroke="#000000" stroke-width="2" stroke-linecap="round"/>
                                </svg>
                            </span>
                            <span class="n-lang-text-wrap">
                                <span id="nTxtLangTitle">اللغة</span>
                                <span class="n-lang-sub" id="nCurrentLangDisplay">العربية</span>
                            </span>
                        </span>
                        <span class="arrow-icon">&#10094;</span>
                    </button>

                    <button type="button" class="n-row-btn row-join-n" onclick="openTelegram()">
                        <span class="n-row-right">
                            <span class="icon-svg">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="#ffffff">
                                    <path d="M21.5 3.5L2.5 11.2l6.2 2.4 2.4 6.2 3.1-3.6 4.8 3.6L21.5 3.5zm-11.2 10.7l8.2-7.1-6.5 8.5-.3 3.1-1.4-4.5z"/>
                                </svg>
                            </span>
                            <span id="nTxtJoin">انضم إلينا</span>
                        </span>
                        <span class="arrow-icon">&#10094;</span>
                    </button>

                    <button type="button" class="n-row-btn row-contact-n" onclick="openEmail()">
                        <span class="n-row-right">
                            <span class="icon-svg">
                                <svg width="20" height="20" viewBox="0 0 24 24">
                                    <rect x="2" y="4" width="20" height="16" rx="2.5" fill="#ffffff"/>
                                    <path d="M2.8 5.2L12 12.4l9.2-7.2" fill="none" stroke="#000000" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                                </svg>
                            </span>
                            <span id="nTxtContact">اتصل بنا</span>
                        </span>
                        <span class="arrow-icon">&#10094;</span>
                    </button>
                </div>

                <!-- المستطيل الثالث: 1. الإعدادات | 2. مسح الذاكرة المؤقتة -->
                <div class="card3-group">
                    <button type="button" class="n-row-btn row-settings-n" onclick="handleSubSettings()">
                        <span class="n-row-right">
                            <span class="icon-svg">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="#ffffff">

        const RANDOM_NICKNAMES = [
            "صقر", "ليث", "نجم", "سحاب", "رعد", "موج", "فهد", "بدر", "طارق", "كريم",
            "زائر", "مبدع", "بطل", "ذئب", "شهاب", "سيف", "رحال", "مرايا", "أفق", "ظل"
        ];

        function normalizeEmail(email) {
            return String(email || '').trim().toLowerCase();
        }

        function getAccountsMap() {
            try {
                const raw = localStorage.getItem(ACCOUNTS_MAP_KEY);
                const parsed = raw ? JSON.parse(raw) : {};
                return parsed && typeof parsed === 'object' ? parsed : {};
            } catch (e) {
                return {};
            }
        }

        function saveAccountsMap(map) {
            try {
                localStorage.setItem(ACCOUNTS_MAP_KEY, JSON.stringify(map));
            } catch (e) {}
        }

        function generateRandomUniqueId(existingIdsSet) {
            let candidate = '';
            let tries = 0;
            do {
                candidate = String(Math.floor(1000000 + Math.random() * 9000000));
                tries++;
            } while (existingIdsSet.has(candidate) && tries < 200);
            return candidate;
        }

        function generateRandomNameFromEmail(email) {
            const cleanEmail = normalizeEmail(email);
            const prefix = (cleanEmail.split('@')[0] || 'user').replace(/[^a-zA-Z0-9\u0600-\u06FF]/g, '');
            const basePart = prefix.slice(0, 6) || 'User';
            const nick = RANDOM_NICKNAMES[Math.floor(Math.random() * RANDOM_NICKNAMES.length)];
            const num = Math.floor(10 + Math.random() * 89);
            return `${nick}_${basePart}${num}`;
        }

        function ensureAccountProfile(email) {
            const map = getAccountsMap();
            const cleanEmail = normalizeEmail(email) || 'guest_session';
            const usedIds = new Set(
                Object.values(map)
                    .map(acc => acc && acc.id)
                    .filter(Boolean)
            );

            if (!map[cleanEmail]) {
                map[cleanEmail] = {
                    id: generateRandomUniqueId(usedIds),
                    name: generateRandomNameFromEmail(cleanEmail)
                };
                saveAccountsMap(map);
            } else {
                if (!/^\d{7}$/.test(map[cleanEmail].id || '')) {
                    map[cleanEmail].id = generateRandomUniqueId(usedIds);
                    saveAccountsMap(map);
                }
                if (!map[cleanEmail].name || !String(map[cleanEmail].name).trim()) {
                    map[cleanEmail].name = generateRandomNameFromEmail(cleanEmail);
                    saveAccountsMap(map);
                }
            }

            try {
                if (normalizeEmail(email)) {
                    localStorage.setItem(ACTIVE_EMAIL_KEY, cleanEmail);
                }
                localStorage.setItem(USER_ID_STORAGE_KEY, map[cleanEmail].id);
                localStorage.setItem(USER_NAME_STORAGE_KEY, map[cleanEmail].name);
            } catch (e) {}

            return map[cleanEmail];
        }

        function getActiveAccountProfile() {
            let activeEmail = '';
            try {
                activeEmail = normalizeEmail(localStorage.getItem(ACTIVE_EMAIL_KEY) || '');
            } catch (e) {}

            if (!activeEmail) {
                const authModal = document.getElementById('authModal');
                if (authModal) {
                    const emailInput = authModal.querySelector('input[type="email"], input[name*="email" i], input[id*="email" i]');
                    if (emailInput && emailInput.value && emailInput.value.includes('@')) {
                        activeEmail = normalizeEmail(emailInput.value);
                    }
                }
            }

            const profile = ensureAccountProfile(activeEmail || 'default_account');

            try {
                const customName = (localStorage.getItem(USER_NAME_STORAGE_KEY) || '').trim();
                if (customName) {
                    profile.name = customName;
                }
            } catch (e) {}

            return profile;
        }

        /* توليد آيدي عشوائي من 7 أرقام خاص بكل حساب وحفظه */
        function getOrCreateUserId() {
            return getActiveAccountProfile().id;
        }

        function getOrCreateUserName() {
            return getActiveAccountProfile().name;
        }

        function renderUserId() {
            const profile = getActiveAccountProfile();
            const valEl = document.getElementById('userIdValue');
            const nameEl = document.getElementById('userNameValue');
            if (valEl) {
                valEl.textContent = profile.id;
            }
            if (nameEl) {
                nameEl.textContent = profile.name;
            }
        }

        /* نسخ الآيدي عند النقر على الزر الذي بجانبه */
        function copyUserId() {
            const idText = getOrCreateUserId();
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(idText).catch(() => fallbackCopy(idText));
            } else {
                fallbackCopy(idText);
            }
            showToastMessage(getTranslatedText('copied'));
        }

        function fallbackCopy(text) {
            const temp = document.createElement('textarea');
            temp.value = text;
            document.body.appendChild(temp);
            temp.select();
            document.execCommand('copy');
            document.body.removeChild(temp);
        }

        /* فتح نافذة تعديل الاسم عند النقر على القلم */
        function openEditNameModal() {
            const modal = document.getElementById('editNameModal');
            const input = document.getElementById('newUserNameInput');
            if (!modal || !input) return;
            input.value = getOrCreateUserName();
            modal.classList.add('show');
            setTimeout(() => input.focus(), 50);
        }

        function closeEditNameModal() {
            const modal = document.getElementById('editNameModal');
            if (modal) {
                modal.classList.remove('show');
            }
        }

        function saveUserName() {
            const input = document.getElementById('newUserNameInput');
            if (!input) return;
            const trimmed = input.value.trim();
            if (trimmed) {
                const profile = getActiveAccountProfile();
                const map = getAccountsMap();
                let activeEmail = '';
                try {
                    activeEmail = normalizeEmail(localStorage.getItem(ACTIVE_EMAIL_KEY) || '') || 'default_account';
                } catch (e) {
                    activeEmail = 'default_account';
                }
                map[activeEmail] = {
                    id: profile.id,
                    name: trimmed
                };
                saveAccountsMap(map);

                try {
                    localStorage.setItem(USER_NAME_STORAGE_KEY, trimmed);
                } catch (e) {}

                renderUserId();
                window.dispatchEvent(new CustomEvent('plotcraft:usernameChanged', { detail: { name: trimmed, id: profile.id } }));
            }
            closeEditNameModal();
        }

        function handlePointsHistory() {
            console.log("سجل النقاط");

        function handleComments() {

        function getTranslatedText(key) {
            const lang = localStorage.getItem('plotcraft_lang_code') || 'ar';
            const dict = translations[lang] || translations['ar'];
            return dict[key] || translations['ar'][key] || '';
        }

        function showToastMessage(message) {
            const toast = document.getElementById('cacheToast');
            if (!toast) return;
            toast.innerText = message;
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 2000);
        }

        /* التحقق من حالة تسجيل الدخول بالبريد */
        window.isEmailLoggedIn = function() {
            try {
                return localStorage.getItem(EMAIL_AUTH_STORAGE_KEY) === 'true';
            } catch (e) {
                return false;
            }
        };

        /* إخفاء نافذة الدخول عبر البريد إذا كان المستخدم مسجلاً دخوله */
        window.guardAuthModal = function() {
            if (!window.isEmailLoggedIn()) return false;
            const authModal = document.getElementById('authModal');
            if (authModal) {
                authModal.classList.remove('show');
                authModal.style.display = 'none';
            }
            return true;
        };

        /* setEmailLoggedIn(true, email) يحفظ الحالة ويولّد اسماً عشوائياً وآيدي خاصاً لكل بريد جديد، و setEmailLoggedIn(false) يمسح الحالة */
        window.setEmailLoggedIn = function(isLoggedIn, email) {
            const loggedIn = Boolean(isLoggedIn);
            try {
                if (loggedIn) {
                    localStorage.setItem(EMAIL_AUTH_STORAGE_KEY, 'true');
                } else {
                    localStorage.removeItem(EMAIL_AUTH_STORAGE_KEY);
                }
            } catch (e) {}

            document.body.classList.toggle('email-already-logged-in', loggedIn);

            const screen = document.getElementById('settingsScreen');
            if (screen) {
                screen.classList.toggle('email-logged-in', loggedIn);
            }

            if (loggedIn) {
                const cleanEmail = normalizeEmail(email);
                if (cleanEmail) {
                    const map = getAccountsMap();
                    const isNewEmail = !map[cleanEmail];
                    const acc = ensureAccountProfile(cleanEmail);
                    try {
                        localStorage.setItem(ACTIVE_EMAIL_KEY, cleanEmail);
                        if (isNewEmail) {
                            localStorage.setItem(USER_NAME_STORAGE_KEY, acc.name);
                        }
                        localStorage.setItem(USER_ID_STORAGE_KEY, acc.id);
                    } catch (e) {}
                }
                renderUserId();
                window.guardAuthModal();
            }
        };

        window.addEventListener('plotcraft:emailLogin', (ev) => {
            const emailArg = ev && ev.detail && ev.detail.email ? ev.detail.email : '';
            window.setEmailLoggedIn(true, emailArg);
        });

        /* استعادة حالة تسجيل الدخول تلقائياً عند فتح التطبيق أو إعادة التحميل */
        function restoreEmailLoginState() {
            renderUserId();
            window.setEmailLoggedIn(window.isEmailLoggedIn());
        }

        restoreEmailLoginState();

        window.addEventListener('DOMContentLoaded', () => {
            restoreEmailLoginState();

            const savedLangCode = localStorage.getItem('plotcraft_lang_code') || 'ar';
            const savedLangName = localStorage.getItem('plotcraft_lang_name') || 'العربية';
            
            document.getElementById('currentLangDisplay').innerText = savedLangName;
            document.getElementById('nCurrentLangDisplay').innerText = savedLangName;
            setAppLanguage(savedLangCode, false);
        });

        function openSettingsScreen() {
            restoreEmailLoginState();
            document.getElementById('settingsScreen').classList.add('show');
        }

        function closeSettingsScreen() {
            document.getElementById('settingsScreen').classList.remove('show');
        }

        /* عند الضغط على تسجيل الدخول: إذا مسجل دخول بالبريد لا تفتح نافذة البريد نهائياً */
        function handleLoginAction() {
            if (window.guardAuthModal()) {
                openSettingsScreen();
                return;
            }
            window.authSource = 'settings'; // تحديد أن الدخول تم من الإعدادات
            const authModal = document.getElementById('authModal');
            if (authModal) {
                authModal.style.display = '';
                authModal.classList.add('show');
                closeSettingsScreen();
            }
        }

        /* دالة الإغلاق الذكية: نتحقق من المصدر لإرجاع المستخدم للمكان الصحيح */
        function closeAuthModal() {
            const authModal = document.getElementById('authModal');
            if (authModal) {
                authModal.classList.remove('show');
            }

            // إذا كان الدخول صادراً من الإعدادات فقط نفتح شاشة الإعدادات
            if (window.authSource === 'settings') {
                openSettingsScreen();
                window.authSource = null; // إعادة تعيين المصدر
            } else if (window.authSource === 'subscription') {
                // إذا كان الدخول من الترقية/الاشتراكات تفتح نافذة الاشتراكات
                const subModal = document.getElementById('subscriptionModal');
                if (subModal) {
                    subModal.style.display = 'flex';
                    setTimeout(() => subModal.classList.add('show'), 10);
                }
                window.authSource = null; // إعادة تعيين المصدر
            }
        }

        function toggleNotifications() {
            isNotifActive = !isNotifActive;
            const toggle = document.getElementById('notifToggle');
            const nToggle = document.getElementById('nNotifToggle');
            if (isNotifActive) {
                toggle.classList.add('active');
                if (nToggle) nToggle.classList.add('active');
            } else {
                toggle.classList.remove('active');
                if (nToggle) nToggle.classList.remove('active');
            }
        }

        function openTelegram() {
            window.open('https://t.me/G_ri63', '_blank');
        }

        function openEmail() {
            window.location.href = 'mailto:support@plotcraft.com';
        }

        function handleSubSettings() {
            console.log("الإعدادات الفرعية");
        }

        function clearCacheAction() {
            showToastMessage(getTranslatedText('toast'));
        }

        function openLanguageSheet() {
            document.getElementById('languageBottomSheet').classList.add('show');
            setTimeout(() => {
                const container = document.getElementById('langScrollContainer');
                const items = container.querySelectorAll('.lang-item');
                const currentName = document.getElementById('currentLangDisplay').innerText;
                items.forEach(item => {
                    if(item.getAttribute('data-name') === currentName) {
                        container.scrollTop = item.offsetTop - container.clientHeight / 2 + item.clientHeight / 2;
                    }
                });
                updateCenterLanguageHighlight();
            }, 50);
        }

        function closeLanguageSheet() {
            document.getElementById('languageBottomSheet').classList.remove('show');
        }

        function updateCenterLanguageHighlight() {
            const container = document.getElementById('langScrollContainer');
            const items = container.querySelectorAll('.lang-item');
            const containerCenter = container.scrollTop + container.clientHeight / 2;

            items.forEach(item => {
                const itemCenter = item.offsetTop + item.offsetHeight / 2;
                const distance = Math.abs(containerCenter - itemCenter);
                if (distance < 25) {
                    item.classList.add('active-center');
                } else {
                    item.classList.remove('active-center');
                }
            });
        }

        function applySelectedLanguage() {
            const container = document.getElementById('langScrollContainer');
            const items = container.querySelectorAll('.lang-item');
            const containerCenter = container.scrollTop + container.clientHeight / 2;
            let closestItem = items[0];
            let minDistance = Infinity;

            items.forEach(item => {
                const itemCenter = item.offsetTop + item.offsetHeight / 2;
                const distance = Math.abs(containerCenter - itemCenter);
                if (distance < minDistance) {
                    minDistance = distance;
                    closestItem = item;
                }
            });

            if (closestItem) {
                const code = closestItem.getAttribute('data-code');
                const name = closestItem.getAttribute('data-name');
                
                document.getElementById('currentLangDisplay').innerText = name;
                document.getElementById('nCurrentLangDisplay').innerText = name;
                
                localStorage.setItem('plotcraft_lang_code', code);
                localStorage.setItem('plotcraft_lang_name', name);

                setAppLanguage(code, true);
                closeLanguageSheet();
            }
        }

        function setAppLanguage(code, animate) {
            const t = translations[code] || translations['ar'];
            
            document.getElementById('pageTitle').innerText = t.title;
            document.getElementById('btnLoginText').innerText = t.login;
            document.getElementById('nTxtPoints').innerText = t.points;
            document.getElementById('nTxtComments').innerText = t.comments;
            document.getElementById('txtNotif').innerText = t.notif;
            document.getElementById('nTxtNotif').innerText = t.notif;
            document.getElementById('txtLangTitle').innerText = t.langTitle;
            document.getElementById('nTxtLangTitle').innerText = t.langTitle;
            document.getElementById('txtJoin').innerText = t.join;
            document.getElementById('nTxtJoin').innerText = t.join;
            document.getElementById('txtContact').innerText = t.contact;
            document.getElementById('nTxtContact').innerText = t.contact;
            document.getElementById('txtSettings').innerText = t.settings;
            document.getElementById('nTxtSettings').innerText = t.settings;
            document.getElementById('txtClearCache').innerText = t.clearCache;
            document.getElementById('nTxtClearCache').innerText = t.clearCache;
            document.getElementById('txtSheetLangTitle').innerText = t.sheetTitle;
            document.getElementById('txtApplyBtn').innerText = t.apply;

            if (code === 'en' || code === 'fr' || code === 'es' || code === 'de' || code === 'tr' || code === 'ru') {
                document.getElementById('appHtml').setAttribute('dir', 'ltr');
                document.getElementById('appHtml').setAttribute('lang', code);
            } else if (code === 'zh' || code === 'ja') {
                document.getElementById('appHtml').setAttribute('dir', 'ltr');
                document.getElementById('appHtml').setAttribute('lang', code);
            } else {
                document.getElementById('appHtml').setAttribute('dir', 'rtl');
                document.getElementById('appHtml').setAttribute('lang', 'ar');
            }
        }
    </script>
</body>
