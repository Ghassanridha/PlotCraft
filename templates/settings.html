<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الإعدادات - PlotCraft</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #000;
            overflow: hidden;
        }

        /* خلفية G2.jpg الأساسية */
        .settings-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: url('https://raw.githubusercontent.com/Ghassanridha/PlotCraft/87ec5eff439c8c227933258a0e1738538ab7d07b/G2.jpg') center/100% 100% no-repeat;
            z-index: 999999;
            direction: rtl;
            transform: translateX(-100vw);
            transition: transform 0.3s ease-out;
            visibility: hidden;
            overflow-y: auto;
        }

        .settings-screen.show {
            visibility: visible;
            transform: translateX(0);
        }

        .settings-container {
            width: 100%;
            max-width: 480px;
            margin: 0 auto;
            padding: 20px 24px;
            display: flex;
            flex-direction: column;
        }

        /* زر العودة العلوية */
        .settings-header {
            display: flex;
            justify-content: flex-start;
            align-items: center;
            padding: 10px 0;
        }

        .btn-back {
            background: transparent;
            border: none;
            color: #ffffff;
            font-size: 22px;
            cursor: pointer;
            padding: 4px;
        }

        /* المربع الأول (المستطيل الأوسط) */
        .group-middle {
            margin-top: 145px;
            display: flex;
            flex-direction: column;
        }

        /* رفع زر الإشعارات للأعلى قليلاً داخل المربع */
        .group-middle .setting-item:first-child {
            padding-top: 4px;
            padding-bottom: 12px;
            margin-top: -6px;
        }

        /* المربع الثاني (المستطيل السفلي - تم ضبطه ليبقى زر الإعدادات داخله تماماً) */
        .group-bottom {
            margin-top: 31px; 
            display: flex;
            flex-direction: column;
        }

        .setting-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 48px;
            padding: 0 8px;
            color: #ffffff;
            text-decoration: none;
            cursor: pointer;
        }

        .setting-item:active {
            opacity: 0.7;
        }

        .setting-right {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 15px;
            font-weight: 500;
        }

        .icon-svg {
            width: 22px;
            height: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .setting-left {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #94a3b8;
            font-size: 13px;
        }

        .arrow-icon {
            color: #ffffff;
            font-size: 14px;
        }

        /* زر التبديل للإشعارات */
        .toggle-switch {
            width: 44px;
            height: 24px;
            background: #475569;
            border-radius: 12px;
            position: relative;
            cursor: pointer;
            transition: background 0.3s;
        }

        .toggle-switch::after {
            content: '';
            position: absolute;
            top: 2px;
            right: 2px;
            width: 20px;
            height: 20px;
            background: #ffffff;
            border-radius: 50%;
            transition: transform 0.3s;
        }

        .toggle-switch.active {
            background: #3b82f6;
        }

        .toggle-switch.active::after {
            transform: translateX(-20px);
        }

        /* نافذة اختيار اللغات السفلية */
        #languageBottomSheet {
            position: fixed;
            bottom: -100%;
            left: 0;
            width: 100%;
            height: 50vh;
            background: #151922;
            border-top-left-radius: 24px;
            border-top-right-radius: 24px;
            box-shadow: 0 -10px 30px rgba(0,0,0,0.6);
            z-index: 1000000;
            transition: bottom 0.35s cubic-bezier(0.1, 0.9, 0.2, 1);
            display: flex;
            flex-direction: column;
            border: 1px solid rgba(255,255,255,0.1);
        }

        #languageBottomSheet.show {
            bottom: 0;
        }

        .lang-sheet-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            border-bottom: 1px solid rgba(255,255,255,0.08);
            color: #ffffff;
        }

        .lang-sheet-close {
            background: transparent;
            border: none;
            color: #ffffff;
            font-size: 18px;
            cursor: pointer;
        }

        .lang-scroll-container {
            position: relative;
            flex-grow: 1;
            overflow-y: scroll;
            scroll-snap-type: y mandatory;
            padding: 60px 0;
            scrollbar-width: none;
        }
        .lang-scroll-container::-webkit-scrollbar {
            display: none;
        }

        .lang-selection-indicator {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 85%;
            height: 48px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            pointer-events: none;
            z-index: 5;
        }

        .lang-item {
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #94a3b8;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            scroll-snap-align: center;
        }

        .lang-sheet-footer {
            padding: 12px 20px 20px 20px;
            display: flex;
            justify-content: center;
            border-top: 1px solid rgba(255,255,255,0.08);
        }

        .lang-apply-btn {
            background: #1f242d;
            color: #ffffff;
            border: 1px solid rgba(255,255,255,0.2);
            padding: 12px 0;
            width: 100%;
            max-width: 300px;
            border-radius: 14px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            text-align: center;
        }

        #cacheToast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: #1f242d;
            color: #ffffff;
            padding: 10px 20px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
            border: 1px solid rgba(255,255,255,0.15);
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
            z-index: 2000000;
            white-space: nowrap;
        }
        #cacheToast.show {
            opacity: 1;
            visibility: visible;
            transform: translateX(-50%) translateY(0);
        }
    </style>
</head>
<body>

    <div id="settingsScreen" class="settings-screen">
        <div class="settings-container">
            
            <!-- زر العودة العلوية -->
            <div class="settings-header">
                <button class="btn-back" onclick="closeSettingsScreen()">&#10095;</button>
            </div>

            <!-- أزرار المربع الأوسط -->
            <div class="group-middle">
                <!-- 1. الإشعارات -->
                <div class="setting-item" onclick="toggleNotifications()">
                    <div class="setting-right">
                        <span class="icon-svg">
                            <svg width="22" height="22" viewBox="0 0 24 24" fill="#ffffff">
                                <path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.9 2 2 2zm6-6v-5c0-3.07-1.63-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.64 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z"/>
                            </svg>
                        </span>
                        <span>الإشعارات</span>
                    </div>
                    <div class="toggle-switch" id="notifToggle"></div>
                </div>

                <!-- 2. اللغة -->
                <div class="setting-item" onclick="openLanguageSheet()">
                    <div class="setting-right">
                        <span class="icon-svg">
                            <svg width="22" height="22" viewBox="0 0 24 24">
                                <circle cx="12" cy="12" r="10" fill="#ffffff" />
                                <path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z" fill="none" stroke="#000000" stroke-width="1.5" stroke-linecap="round"/>
                            </svg>
                        </span>
                        <span>اللغة</span>
                    </div>
                    <div class="setting-left">
                        <span id="currentLangDisplay">العربية</span>
                        <span class="arrow-icon">&#10094;</span>
                    </div>
                </div>

                <!-- 3. انضم إلينا -->
                <div class="setting-item" onclick="openTelegram()">
                    <div class="setting-right">
                        <span class="icon-svg">
                            <svg width="22" height="22" viewBox="0 0 24 24" fill="#ffffff">
                                <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
                            </svg>
                        </span>
                        <span>انضم إلينا</span>
                    </div>
                    <span class="arrow-icon">&#10094;</span>
                </div>

                <!-- 4. اتصل بنا (ثابت بمكانه) -->
                <div class="setting-item" onclick="openEmail()">
                    <div class="setting-right">
                        <span class="icon-svg">
                            <svg width="22" height="22" viewBox="0 0 24 24">
                                <rect x="2" y="4" width="20" height="16" rx="3" fill="#ffffff"/>
                                <path d="M22 6l-10 7L2 6" fill="none" stroke="#000000" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                            </svg>
                        </span>
                        <span>اتصل بنا</span>
                    </div>
                    <span class="arrow-icon">&#10094;</span>
                </div>
            </div>

            <!-- أزرار المستطيل السفلي الأخير -->
            <div class="group-bottom">
                <!-- 5. الإعدادات -->
                <div class="setting-item" onclick="handleSubSettings()">
                    <div class="setting-right">
                        <span class="icon-svg">
                            <svg width="22" height="22" viewBox="0 0 24 24" fill="#ffffff">
                                <path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/>
                            </svg>
                        </span>
                        <span>الإعدادات</span>
                    </div>
                    <span class="arrow-icon">&#10094;</span>
                </div>

                <!-- 6. مسح الذاكرة المؤقتة -->
                <div class="setting-item" onclick="clearCacheAction()">
                    <div class="setting-right">
                        <span class="icon-svg">
                            <svg width="22" height="22" viewBox="0 0 24 24" fill="#ffffff">
                                <path d="M15 16h4v2h-4zm0-8h7v2h-7zm0 4h6v2h-6zM3 18c0 1.1.9 2 2 2h6c1.1 0 2-.9 2-2V8H3v10zM14 5h-3l-1-1H6L5 5H2v2h12z"/>
                            </svg>
                        </span>
                        <span>مسح الذاكرة المؤقتة</span>
                    </div>
                    <div class="setting-left">
                        <span>MB 131.48</span>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <!-- نافذة اللغات السفلية -->
    <div id="languageBottomSheet">
        <div class="lang-sheet-header">
            <span>اللغة</span>
            <button class="lang-sheet-close" onclick="closeLanguageSheet()">&#x2715;</button>
        </div>
        <div class="lang-scroll-container" id="langScrollContainer">
            <div class="lang-selection-indicator"></div>
            <div class="lang-item" data-code="ar" data-name="العربية">العربية</div>
            <div class="lang-item" data-code="sa" data-name="العربية (السعودية)">العربية (السعودية)</div>
            <div class="lang-item" data-code="en" data-name="English">English</div>
            <div class="lang-item" data-code="fr" data-name="Français">Français</div>
            <div class="lang-item" data-code="es" data-name="Español">Español</div>
            <div class="lang-item" data-code="de" data-name="Deutsch">Deutsch</div>
            <div class="lang-item" data-code="tr" data-name="Türkçe">Türkçe</div>
            <div class="lang-item" data-code="ru" data-name="Русский">Русский</div>
            <div class="lang-item" data-code="zh" data-name="中文">中文</div>
            <div class="lang-item" data-code="ja" data-name="日本語">日本語</div>
        </div>
        <div class="lang-sheet-footer">
            <button class="lang-apply-btn" onclick="applySelectedLanguage()">تطبيق</button>
        </div>
    </div>

    <div id="cacheToast">تم المسح بنجاح</div>

    <script>
        let isNotifActive = false;

        function openSettingsScreen() {
            document.getElementById('settingsScreen').classList.add('show');
        }

        function closeSettingsScreen() {
            document.getElementById('settingsScreen').classList.remove('show');
        }

        function toggleNotifications() {
            isNotifActive = !isNotifActive;
            const toggle = document.getElementById('notifToggle');
            if (isNotifActive) {
                toggle.classList.add('active');
            } else {
                toggle.classList.remove('active');
            }
        }

        function openTelegram() {
            window.open('https://t.me/G_ri63', '_blank');
        }

        function openEmail() {
            window.location.href = 'mailto:support@plotcraft.com';
        }

        function handleSubSettings() {
            console.log("الإعدادات الفرعية");
        }

        function clearCacheAction() {
            const toast = document.getElementById('cacheToast');
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 2000);
        }

        function openLanguageSheet() {
            document.getElementById('languageBottomSheet').classList.add('show');
        }

        function closeLanguageSheet() {
            document.getElementById('languageBottomSheet').classList.remove('show');
        }

        function applySelectedLanguage() {
            const container = document.getElementById('langScrollContainer');
            const items = container.querySelectorAll('.lang-item');
            const containerCenter = container.scrollTop + container.clientHeight / 2;
            let closestItem = items[0];
            let minDistance = Infinity;

            items.forEach(item => {
                const itemCenter = item.offsetTop + item.offsetHeight / 2;
                const distance = Math.abs(containerCenter - itemCenter);
                if (distance < minDistance) {
                    minDistance = distance;
                    closestItem = item;
                }
            });

            if (closestItem) {
                const code = closestItem.getAttribute('data-code');
                const name = closestItem.getAttribute('data-name');
                document.getElementById('currentLangDisplay').innerText = name;
                
                if (code === 'en') {
                    document.documentElement.setAttribute('dir', 'ltr');
                } else {
                    document.documentElement.setAttribute('dir', 'rtl');
                }
                closeLanguageSheet();
            }
        }
    </script>
</body>
</html>
