<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الإعدادات - PlotCraft</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #000;
            overflow: hidden;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        /* حاوية الشاشة مع الخلفية */
        .settings-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: url('https://raw.githubusercontent.com/Ghassanridha/PlotCraft/3c0d837613bae10a387c91a8a059563aa7cccd10/Ghas.jpg') center/100% 100% no-repeat;
            z-index: 999999;
            direction: rtl;
            transform: translateX(-100vw);
            transition: transform 0.3s ease-out;
            visibility: hidden;
            overflow: hidden;
        }

        .settings-screen.show {
            visibility: visible;
            transform: translateX(0);
        }

        .click-overlay-container {
            position: relative;
            width: 100%;
            max-width: 480px;
            height: 100vh;
            margin: 0 auto;
        }

        .clickable-area {
            position: absolute;
            cursor: pointer;
            z-index: 50;
        }

        /* ---------------------------------------------------- */
        /* بناء الأزرار المرئية الجديدة في الشريط العلوي بصورة صحيحة */
        /* ---------------------------------------------------- */
        
        /* زر السهم المرئي للرجوع - أعلى اليمين */
        .custom-visible-back {
            position: absolute;
            top: 18px;
            right: 18px;
            width: 36px;
            height: 36px;
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            cursor: pointer;
            z-index: 999;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            transition: background 0.2s, transform 0.1s;
        }

        .custom-visible-back:active {
            transform: scale(0.92);
            background: rgba(255, 255, 255, 0.25);
        }

        /* زر الترقية المرئي - أعلى اليسار */
        .custom-visible-upgrade {
            position: absolute;
            top: 18px;
            left: 18px;
            padding: 6px 14px;
            background: linear-gradient(135deg, #f59e0b, #d97706);
            border: none;
            border-radius: 20px;
            color: #000;
            font-weight: bold;
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            z-index: 999;
            box-shadow: 0 2px 8px rgba(245, 158, 11, 0.3);
            transition: transform 0.1s;
        }

        .custom-visible-upgrade:active {
            transform: scale(0.95);
        }

        /* باقي مناطق النقر الشفافة المحددة في التصميم */
        .banner-link {
            top: 70px;
            left: 4%;
            width: 92%;
            height: 130px;
        }

        .link-points {
            top: 215px;
            left: 4%;
            width: 92%;
            height: 55px;
        }

        .link-feedback {
            top: 275px;
            left: 4%;
            width: 92%;
            height: 55px;
        }

        .toggle-notifications {
            top: 350px;
            right: 15px;
            width: 50px;
            height: 30px;
        }

        .link-language {
            top: 395px;
            left: 4%;
            width: 92%;
            height: 55px;
        }

        .link-join {
            top: 455px;
            left: 4%;
            width: 92%;
            height: 55px;
        }

        .link-contact {
            top: 515px;
            left: 4%;
            width: 92%;
            height: 55px;
        }

        .link-sub-settings {
            top: 590px;
            left: 4%;
            width: 92%;
            height: 55px;
        }

        .link-clear-cache {
            top: 545px;
            left: 4%;
            width: 92%;
            height: 55px;
        }
    </style>
</head>
<body>

    <div id="settingsScreen" class="settings-screen show">
        <div class="click-overlay-container">
            
            <!-- الأزرار المرئية التفاعلية الجديدة الممتازة للنقر -->
            <button class="custom-visible-back" onclick="closeSettingsScreen()" title="رجوع">&#x276F;</button>
            <button class="custom-visible-upgrade" onclick="openSubscriptionModal()">⭐ ترقية</button>
            
            <!-- باقي مناطق النقر للتصميم -->
            <a href="#" class="clickable-area banner-link" onclick="handleAction('banner'); return false;"></a>
            <a href="#" class="clickable-area link-points" onclick="handleAction('points'); return false;"></a>
            <a href="#" class="clickable-area link-feedback" onclick="handleAction('feedback'); return false;"></a>
            
            <div class="clickable-area toggle-notifications" onclick="toggleNotifications()"></div>
            
            <a href="#" class="clickable-area link-language" onclick="handleAction('language'); return false;"></a>
            <a href="#" class="clickable-area link-join" onclick="handleAction('join'); return false;"></a>
            <a href="#" class="clickable-area link-contact" onclick="handleAction('contact'); return false;"></a>
            <a href="#" class="clickable-area link-sub-settings" onclick="handleAction('sub-settings'); return false;"></a>
            <a href="#" class="clickable-area link-clear-cache" onclick="clearCacheAction()"></a>

        </div>
    </div>

    <script>
        function closeSettingsScreen() {
            const screen = document.getElementById('settingsScreen');
            if (screen) {
                screen.classList.remove('show');
            }
        }

        function handleAction(type) {
            console.log("تم الضغط على: " + type);
            
            if (type === 'banner') {
                alert("جاري فتح نافذة تسجيل الدخول بالحسابات الحقيقية...");
            } else if (type === 'points') {
                alert("عرض النقاط والمكافآت");
            } else if (type === 'feedback') {
                alert("فتح نافذة الآراء والمقترحات");
            } else if (type === 'language') {
                alert("تغيير اللغة");
            } else if (type === 'join') {
                alert("الانضمام إلى مجتمع PlotCraft");
            } else if (type === 'contact') {
                alert("اتصل بنا والبريد الإلكتروني");
            } else if (type === 'sub-settings') {
                alert("الإعدادات الفرعية");
            }
        }

        function openSubscriptionModal() {
            if (typeof openSubscription === "function") {
                openSubscription();
            } else {
                alert("فتح نافذة الاشتراكات والترقية");
            }
        }

        function toggleNotifications() {
            console.log("تم تغيير حالة الإشعارات");
            alert("تم تغيير حالة مفتاح الإشعارات");
        }

        function clearCacheAction() {
            console.log("تم مسح الذاكرة المؤقتة");
            alert("تم مسح الذاكرة المؤقتة بنجاح");
        }
    </script>
</body>
</html>
