<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>الأدوات - PlotCraft</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            width: 100%;
            height: 100vh;
            background-color: #0b0f19;
            color: #ffffff;
            overflow-y: auto;
            padding-bottom: 90px;
        }

        .tools-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 20px;
            background: rgba(31, 36, 45, 0.85);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255,255,255,0.08);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .tools-header-title { color: #ffffff; font-size: 20px; font-weight: 700; }

        .tools-body { padding: 16px; display: flex; flex-direction: column; gap: 16px; }

        .tool-card-item { 
            position: relative; 
            width: 100%; 
            height: 180px; 
            border-radius: 20px; 
            overflow: hidden; 
            display: flex; 
            flex-direction: column; 
            justify-content: flex-end; 
            padding: 18px; 
            box-shadow: 0 6px 20px rgba(0,0,0,0.5); 
            border: 1px solid rgba(255,255,255,0.1); 
            cursor: pointer; 
        }

        .tool-card-1 { background: linear-gradient(180deg, rgba(0,0,0,0.1) 0%, rgba(0,0,0,0.85) 100%), url('https://images.unsplash.com/photo-1542751371-adc38448a05e?q=80&w=600&auto=format&fit=crop') center/cover; }
        .tool-card-2 { background: linear-gradient(180deg, rgba(0,0,0,0.1) 0%, rgba(0,0,0,0.85) 100%), url('https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?q=80&w=600&auto=format&fit=crop') center/cover; }
        .tool-card-3 { background: linear-gradient(180deg, rgba(0,0,0,0.1) 0%, rgba(0,0,0,0.85) 100%), url('https://images.unsplash.com/photo-1534528741775-53994a69daeb?q=80&w=600&auto=format&fit=crop') center/cover; }

        .tool-info-box { position: relative; z-index: 2; }
        .tool-main-title { color: #ffffff; font-size: 17px; font-weight: 700; margin-bottom: 4px; }
        .tool-sub-desc { color: #cbd5e1; font-size: 12px; }

        /* شريط التنقل السفلي للرجوع أو التنقل */
        .plotcraft-nav-bar {
            position: fixed;
            bottom: 0; left: 0; width: 100%;
            background-color: #1f242d;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 -4px 15px rgba(0,0,0,0.6);
        }

        .back-btn {
            background: #3b82f6;
            color: #ffffff;
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 700;
        }
    </style>
</head>
<body>

    <div class="tools-header">
        <div class="tools-header-title">الأدوات</div>
    </div>

    <div class="tools-body">
        <div class="tool-card-item tool-card-1">
            <div class="tool-info-box">
                <div class="tool-main-title">تأثيرات الفيديو</div>
                <div class="tool-sub-desc">أضف لمسة سينمائية</div>
            </div>
        </div>
        <div class="tool-card-item tool-card-2">
            <div class="tool-info-box">
                <div class="tool-main-title">توليد الفيديو</div>
                <div class="tool-sub-desc">حول توجيهاً إلى فيديو خاص بك</div>
            </div>
        </div>
        <div class="tool-card-item tool-card-3">
            <div class="tool-info-box">
                <div class="tool-main-title">توليد الصور</div>
                <div class="tool-sub-desc">حول فكرة إلى صورة مكتملة</div>
            </div>
        </div>
    </div>

    <div class="plotcraft-nav-bar">
        <a href="index.html" class="back-btn">الرجوع للرئيسية</a>
    </div>

</body>
</html>
