<!DOCTYPE html>
<html lang="ar" dir="rtl" id="appHtmlRoot">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PlotCraft UI</title>
    <!-- مكتبة Google Sign-In -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 680px;
            background-color: #0b0f19;
            overflow: hidden;
            position: relative;
        }

        .app-shell {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 680px;
            position: relative;
            overflow: hidden;
            background-color: #0b0f19;
        }

        .screen-view {
            display: none;
            flex-direction: column;
            width: 100%;
            height: 100%;
            background-color: #1f242d;
            overflow-y: auto;
            overflow-x: hidden;
            padding-bottom: 110px;
            box-sizing: border-box;
        }

        .screen-view.active {
            display: flex;
        }

        #homeScreen.screen-view {
            background-color: #0b0f19;
        }

        .hero-box {
            position: relative;
            width: 100%;
            min-height: 52vh;
            background: linear-gradient(180deg, rgba(11,15,25,0.2) 0%, rgba(11,15,25,0.8) 75%, #0b0f19 100%),
                        url('https://images.unsplash.com/photo-1518709268805-4e9042af9f23?q=80&w=1080&auto=format&fit=crop') center/cover no-repeat;
            border-bottom-left-radius: 35px;
            border-bottom-right-radius: 35px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 24px 20px 20px 20px;
            flex-shrink: 0;
        }

        .top-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }

        .brand-title {
            color: #ffffff;
            font-size: 20px;
            font-weight: 700;
        }

        .welcome-section {
            margin-top: 15px;
        }

        .welcome-section h1 {
            color: #ffffff;
            font-size: 22px;
            font-weight: 700;
            line-height: 1.4;
        }

        .toast-notification {
            position: fixed;
            top: 25px;
            left: 50%;
            transform: translateX(-50%) translateY(-20px);
            background: rgba(31, 36, 45, 0.95);
            color: #ffffff;
            padding: 10px 20px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 600;
            border: 1px solid rgba(255, 255, 255, 0.2);
            z-index: 9999999;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }
        .toast-notification.show {
            opacity: 1;
            visibility: visible;
            transform: translateX(-50%) translateY(0);
        }

        .plotcraft-nav-bar {
            position: absolute;
            bottom: 0; left: 0; width: 100%;
            background-color: #1f242d;
            padding: 8px 16px 16px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            z-index: 1000;
            box-sizing: border-box;
        }
        .plotcraft-nav-pill {
            background-color: #282f3d;
            border: 1px solid #343d50;
            border-radius: 35px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 6px 12px;
            flex-grow: 1;
        }
        .plotcraft-nav-item {
            color: #cbd5e1;
            font-size: 13px;
            text-decoration: none;
            cursor: pointer;
        }
        .plotcraft-nav-item.active {
            color: #ffffff;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="app-shell" id="appShellContainer">
        <div class="toast-notification" id="toastNotification"></div>

        <div id="homeScreen" class="screen-view active">
            <div class="hero-box">
                <div class="top-header">
                    <div class="brand-title">PlotCraft</div>
                </div>
                <div class="welcome-section">
                    <h1>مساء الخير، أيها المخرج<br>أي قصة سنصنع اليوم؟</h1>
                </div>
            </div>
        </div>

        <div id="toolsScreen" class="screen-view">
            <div style="padding: 20px; color: #fff; font-size: 18px; font-weight: bold;">قسم الأدوات</div>
        </div>

        <div id="worksScreen" class="screen-view">
            <div style="padding: 20px; color: #fff; font-size: 18px; font-weight: bold;">مشاريع القصة والأعمال</div>
        </div>

        <div class="plotcraft-nav-bar" id="mainNavBar">
            <div class="plotcraft-nav-pill">
                <a href="#" class="plotcraft-nav-item active" id="navHome" onclick="switchScreen('homeScreen', event); setActiveNav('navHome')">الرئيسية</a>
                <a href="#" class="plotcraft-nav-item" id="navTools" onclick="switchScreen('toolsScreen', event); setActiveNav('navTools')">الأدوات</a>
                <a href="#" class="plotcraft-nav-item" id="navWorks" onclick="switchScreen('worksScreen', event); setActiveNav('navWorks')">الأعمال</a>
            </div>
        </div>
    </div>

    <!-- استدعاء ملفات الجافا سكريبت -->
    <script src="main.js"></script>
    <script src="extra-features.js"></script>

</body>
</html>
