<!DOCTYPE html>
<html lang="ar" dir="rtl" id="appHtmlRoot">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PlotCraft UI</title>
    <!-- مكتبة Google Identity Services الرسمية -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 680px;
            background-color: #0b0f19;
            overflow: hidden;
            position: relative;
        }

        .app-shell {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 680px;
            position: relative;
            overflow: hidden;
            background-color: #0b0f19;
        }

        .screen-view {
            display: none;
            flex-direction: column;
            width: 100%;
            height: 100%;
            background-color: #1f242d;
            overflow-y: auto;
            overflow-x: hidden;
            padding-bottom: 110px;
            box-sizing: border-box;
        }

        .screen-view.active {
            display: flex;
        }

        #homeScreen.screen-view {
            background-color: #0b0f19;
        }

        .hero-box {
            position: relative;
            width: 100%;
            min-height: 52vh;
            background: linear-gradient(180deg, rgba(11,15,25,0.2) 0%, rgba(11,15,25,0.8) 75%, #0b0f19 100%),
                        url('https://images.unsplash.com/photo-1518709268805-4e9042af9f23?q=80&w=1080&auto=format&fit=crop') center/cover no-repeat;
            border-bottom-left-radius: 35px;
            border-bottom-right-radius: 35px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 24px 20px 20px 20px;
            flex-shrink: 0;
        }

        .top-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }

        .brand-title {
            color: #ffffff;
            font-size: 20px;
            font-weight: 700;
        }

        .upgrade-badge {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            padding: 8px 16px;
            border-radius: 25px;
            color: #ffffff;
            font-size: 14px;
            font-weight: 500;
            display: flex;
            align-items: center;
            border: 1px solid rgba(255, 255, 255, 0.2);
            cursor: pointer;
            transition: 0.2s;
        }

        .welcome-section {
            margin-top: 15px;
        }

        .welcome-section h1 {
            color: #ffffff;
            font-size: 22px;
            font-weight: 700;
            line-height: 1.4;
            text-shadow: 0 2px 8px rgba(0,0,0,0.6);
        }

        .cards-row {
            display: flex;
            gap: 12px;
            width: 100%;
            margin-top: 20px;
        }

        .interactive-card {
            flex: 1;
            background: rgba(20, 25, 40, 0.65);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 18px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            cursor: pointer;
            transition: 0.2s;
            position: relative;
        }

        .login-modal-overlay {
            display: none;
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            z-index: 99999;
            align-items: flex-end;
            justify-content: center;
        }
        .login-modal-overlay.show { display: flex; }
        
        .login-modal-content {
            background: #1f242d;
            border-top-left-radius: 28px;
            border-top-right-radius: 28px;
            border: 1px solid rgba(255,255,255,0.12);
            width: 100%;
            max-width: 480px;
            padding: 24px 20px 40px 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            position: relative;
        }

        .login-close-x-btn {
            position: absolute;
            top: 16px;
            right: 16px;
            color: #ffffff;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.1);
            width: 26px;
            height: 26px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .auth-input-field {
            width: 100%;
            background: #282f3d;
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 12px;
            padding: 12px;
            color: #ffffff;
            font-size: 13px;
            outline: none;
        }

        .auth-main-btn {
            width: 100%;
            background: #ffffff;
            color: #1f242d;
            border: none;
            border-radius: 12px;
            padding: 12px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            text-align: center;
        }

        .plotcraft-nav-bar {
            position: absolute;
            bottom: 0; left: 0; width: 100%;
            background-color: #1f242d;
            padding: 6px 15px 16px 15px;
            display: flex; justify-content: center; align-items: center; gap: 12px;
            z-index: 1000; box-sizing: border-box;
        }
    </style>
</head>
<body>

    <div class="app-shell" id="appShellContainer">

        <div id="homeScreen" class="screen-view active">
            <div class="hero-box">
                <div class="top-header">
                    <div class="brand-title">PlotCraft</div>
                </div>
                <div class="welcome-section">
                    <h1>مساء الخير، أيها المخرج<br>أي قصة سنصنع اليوم؟</h1>
                </div>
            </div>
        </div>

        <div class="login-modal-overlay show" id="loginModalOverlay">
            <div class="login-modal-content">
                <div class="login-close-x-btn" onclick="closeLoginModal()">✕</div>
                <div style="color: #ffffff; font-size: 18px; font-weight: 700; text-align: center;">تسجيل الدخول إلى PlotCraft</div>

                <input type="email" class="auth-input-field" placeholder="البريد الإلكتروني">
                <input type="password" class="auth-input-field" placeholder="كلمة المرور">

                <button class="auth-main-btn">دخول</button>

                <!-- زر Google Sign-In المربوط مباشرة برابط Google Cloud Console الخاص بك -->
                <div style="display: flex; justify-content: center; width: 100%; margin-top: 10px;">
                    <div id="g_id_onload"
                         data-client_id="1087604212326-ar74pri9eaaneqvi552b04fba91k0804.apps.googleusercontent.com"
                         data-callback="handleGoogleCredentialResponse"
                         data-auto_select="false"
                         data-itp_support="true">
                    </div>
                    <div class="g_id_signin"
                         data-type="standard"
                         data-size="large"
                         data-theme="outline"
                         data-text="sign_in_with"
                         data-shape="rectangular"
                         data-logo_alignment="left"
                         data-width="100%">
                    </div>
                </div>
            </div>
        </div>

    </div>

    <script>
        function closeLoginModal() {
            document.getElementById('loginModalOverlay').style.display = 'none';
        }

        function handleGoogleCredentialResponse(response) {
            console.log("Encoded JWT ID token: " + response.credential);
            alert("تم تسجيل الدخول بنجاح عبر حساب جوجل!");
        }
    </script>
</body>
</html>
